<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="VOID FARMER — неоновый космический выживач-собиратель">
<title>VOID FARMER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hud hidden">
    <div class="hud-top">
      <div class="panel stats">
        <div class="hull">
          <div class="hull-fill" id="hullFill"></div>
          <span class="hull-label">HULL</span>
          <span class="hull-text" id="hullText">100</span>
        </div>
        <div class="res-row" id="resRow"></div>
      </div>
      <div class="panel sector">
        <div class="sector-name">СЕКТОР <span id="sectorNum">1</span></div>
        <div class="sector-bar"><div id="sectorFill"></div></div>
      </div>
      <div class="panel combo" id="comboPanel">
        <div class="combo-mult" id="comboMult">x1</div>
        <div class="combo-bar"><div id="comboFill"></div></div>
      </div>
      <button id="pauseBtn" class="pause-btn" aria-label="Пауза">❚❚</button>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="stick" class="stick"><div id="stickKnob" class="stick-knob"></div></div>
  <button id="dashBtn" class="dash-btn hidden">PULSE</button>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Menu -->
  <div id="menu" class="screen">
    <div class="menu-inner">
      <h1 class="title">VOID<span>FARMER</span></h1>
      <p class="subtitle">Дрон-собиратель · Бесконечный пояс астероидов</p>
      <button id="playBtn" class="btn-primary">НАЧАТЬ ЗАБЕГ</button>
      <div class="controls-hint">
        <div><kbd>WASD</kbd> / <kbd>←↑↓→</kbd> — движение</div>
        <div><kbd>SPACE</kbd> — импульс (рывок)</div>
        <div><kbd>ESC</kbd> — пауза</div>
        <div>На телефоне: левая часть — джойстик, справа — <b>PULSE</b></div>
      </div>
    </div>
  </div>

  <!-- Game over -->
  <div id="over" class="screen hidden">
    <div class="menu-inner">
      <h1 class="title small">ДРОН <span>ПОТЕРЯН</span></h1>
      <div class="stats-grid">
        <div><span>Сектор</span><b id="finalSector">1</b></div>
        <div><span>Феррит</span><b id="finalRes0">0</b></div>
        <div><span>Плазма</span><b id="finalRes1">0</b></div>
        <div><span>Кристалл</span><b id="finalRes2">0</b></div>
      </div>
      <button id="againBtn" class="btn-primary">НОВЫЙ ЗАБЕГ</button>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen hidden">
    <div class="menu-inner">
      <h1 class="title small">ПАУЗА</h1>
      <button id="resumeBtn" class="btn-primary">ПРОДОЛЖИТЬ</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
