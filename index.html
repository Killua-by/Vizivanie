function drawOceanBg() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  if (game.isNight) {
    bgGrad.addColorStop(0, '#0b1220'); bgGrad.addColorStop(0.5, '#020617'); bgGrad.addColorStop(1, '#000000');
  } else {
    bgGrad.addColorStop(0, '#1a5f8a'); bgGrad.addColorStop(0.5, '#0c4a6e'); bgGrad.addColorStop(1, '#082f49');
  }
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  const cx = game.camera.x, cy = game.camera.y, zoom = game.camera.zoom;
  
  ctx.lineWidth = 3;
  ctx.strokeStyle = game.isNight ? 'rgba(56, 189, 248, 0.08)' : 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath();
  const s1 = 180;
  const o1x = (cx * zoom) % s1, o1y = (cy * zoom) % s1;
  for (let x = -s1; x < W + s1; x += s1) {
    for (let y = -s1; y < H + s1; y += s1) {
      const px = x - o1x + Math.sin((y + game.time*50)*0.01)*20;
      const py = y - o1y + Math.cos((x + game.time*50)*0.01)*20;
      ctx.moveTo(px - 40, py);
      ctx.quadraticCurveTo(px, py - 12, px + 40, py);
    }
  }
  ctx.stroke();

  if (!game.isNight) {
    for (let i = 0; i < 30; i++) {
      const bx = (pseudo(i*7) * W + game.time * 15 * (0.5 + pseudo(i))) % W;
      const by = (pseudo(i*13) * H + game.time * 8 * (0.5 + pseudo(i*3))) % H;
      const alpha = 0.3 + 0.5 * Math.sin(game.time * 3 + i);
      ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, alpha) * 0.4})`;
      ctx.beginPath(); ctx.ellipse(bx, by, 12, 3, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  if (game.isNight) {
    ctx.fillStyle = 'rgba(255, 250, 205, 0.85)';
    ctx.beginPath(); ctx.arc(W - 80, 100, 40, 0, Math.PI*2); ctx.fill();
    for (let i = 0; i < 80; i++) {
      const sx = pseudo(i) * W, sy = pseudo(i*3) * H * 0.9;
      const blink = 0.5 + 0.5 * Math.sin(game.time * 2 + i);
      ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + blink * 0.6})`;
      ctx.fillRect(sx, sy, pseudo(i*5) > 0.9 ? 2.5 : 1, pseudo(i*5) > 0.9 ? 2.5 : 1);
    }
  }
}

function drawMountains() {
  for (const m of mountains) {
    // Тень
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath(); ctx.ellipse(m.x, m.y + m.size * 0.3, m.size * 0.9, m.size * 0.25, 0, 0, Math.PI*2); ctx.fill();
    // Гора
    const grad = ctx.createLinearGradient(m.x - m.size, m.y + m.size*0.5, m.x + m.size, m.y - m.size);
    grad.addColorStop(0, '#1e293b'); grad.addColorStop(0.5, '#334155'); grad.addColorStop(1, '#64748b');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(m.x - m.size, m.y + m.size*0.5);
    ctx.lineTo(m.x, m.y - m.size);
    ctx.lineTo(m.x + m.size, m.y + m.size*0.5);
    ctx.closePath(); ctx.fill();
    // Снег на вершине
    ctx.fillStyle = '#f1f5f9';
    ctx.beginPath();
    ctx.moveTo(m.x - m.size*0.25, m.y - m.size*0.55);
    ctx.lineTo(m.x, m.y - m.size);
    ctx.lineTo(m.x + m.size*0.25, m.y - m.size*0.55);
    ctx.lineTo(m.x + m.size*0.1, m.y - m.size*0.4);
    ctx.lineTo(m.x - m.size*0.1, m.y - m.size*0.5);
    ctx.closePath(); ctx.fill();
    // Трещины
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x - m.size*0.3, m.y - m.size*0.2);
    ctx.lineTo(m.x - m.size*0.15, m.y + m.size*0.1);
    ctx.stroke();
  }
}

function drawIsland() {
  ctx.fillStyle = 'rgba(255, 224, 130, 0.3)';
  ctx.beginPath(); ctx.arc(island.x, island.y, island.r + 40, 0, Math.PI*2); ctx.fill();
  const sandGrad = ctx.createRadialGradient(island.x, island.y, island.r*0.7, island.x, island.y, island.r);
  sandGrad.addColorStop(0, '#fcd34d'); sandGrad.addColorStop(1, '#d97706');
  ctx.fillStyle = sandGrad;
  ctx.beginPath(); ctx.arc(island.x, island.y, island.r, 0, Math.PI*2); ctx.fill();
  const grassGrad = ctx.createRadialGradient(island.x, island.y, 0, island.x, island.y, island.r*0.85);
  grassGrad.addColorStop(0, '#4ade80'); grassGrad.addColorStop(0.7, '#22c55e'); grassGrad.addColorStop(1, '#166534');
  ctx.fillStyle = grassGrad;
  ctx.beginPath(); ctx.arc(island.x, island.y, island.r * 0.85, 0, Math.PI*2); ctx.fill();
  // Пальмы
  for (let i = 0; i < 6; i++) {
    const angle = pseudo(i*17) * Math.PI * 2;
    const r = 80 + pseudo(i*23) * island.r * 0.55;
    drawPalmTree(island.x + Math.cos(angle) * r, island.y + Math.sin(angle) * r, i);
  }
  // Вход в пещеру
  ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(caveEntrance.x, caveEntrance.y, 45, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(caveEntrance.x, caveEntrance.y, 30, 0, Math.PI*2); ctx.fill();
  // Причал
  ctx.fillStyle = '#78350f';
  ctx.fillRect(boatDock.x - 45, boatDock.y - 18, 90, 36);
  for (let i = 0; i < 8; i++) {
    ctx.strokeStyle = i % 2 === 0 ? '#5a2d0c' : '#92400e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(boatDock.x - 45 + i * 11, boatDock.y - 18); ctx.lineTo(boatDock.x - 45 + i * 11, boatDock.y + 18); ctx.stroke();
  }
}

function drawPalmTree(x, y, seed) {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath(); ctx.ellipse(x + 10, y + 10, 25, 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#78350f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y - 25, x + 5, y - 50); ctx.stroke();
  const topX = x + 5, topY = y - 50;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + Math.PI/2 + pseudo(seed*7 + i) * 0.3;
    const len = 25 + pseudo(seed*11 + i) * 12;
    const endX = topX + Math.cos(a) * len;
    const endY = topY + Math.sin(a) * len * 0.6;
    ctx.fillStyle = i % 2 === 0 ? '#16a34a' : '#15803d';
    ctx.beginPath();
    ctx.moveTo(topX, topY);
    ctx.quadraticCurveTo((topX + endX)/2 + Math.cos(a+Math.PI/2)*8, (topY + endY)/2 + Math.sin(a+Math.PI/2)*8, endX, endY);
    ctx.quadraticCurveTo((topX + endX)/2, (topY + endY)/2, topX, topY);
    ctx.fill();
  }
}

function drawBoat() {
  const level = BOAT_LEVELS[game.boatLevel - 1];
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle + Math.PI/2);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.beginPath(); ctx.ellipse(6, 6, level.size * 0.9, level.size * 1.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 0, level.size*1.2, level.size*1.8, 0, 0, Math.PI*2); ctx.stroke();

  if (game.boatLevel === 1) {
    for (let i = -2; i <= 2; i++) {
      const g = ctx.createLinearGradient(i*9, -level.size*1.5, i*9, level.size*1.5);
      g.addColorStop(0, '#92400e'); g.addColorStop(0.5, '#78350f'); g.addColorStop(1, '#5a2d0c');
      ctx.fillStyle = g; ctx.fillRect(i*9 - 4, -level.size*1.5, 8, level.size*3);
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1; ctx.strokeRect(i*9 - 4, -level.size*1.5, 8, level.size*3);
    }
    ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2.5;
    for (let i = 0; i < 2; i++) {
      const y = -level.size*0.8 + i * level.size*1.2;
      ctx.beginPath(); ctx.moveTo(-level.size*1.2, y); ctx.lineTo(level.size*1.2, y); ctx.stroke();
    }
  }
  else if (game.boatLevel === 2) {
    const innerGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, level.size*1.4);
    innerGrad.addColorStop(0, '#5a2d0c'); innerGrad.addColorStop(1, '#78350f');
    ctx.fillStyle = innerGrad;
    ctx.beginPath();
    ctx.moveTo(0, -level.size*1.6);
    ctx.quadraticCurveTo(level.size, -level.size*0.5, level.size*0.8, level.size*1.2);
    ctx.lineTo(-level.size*0.8, level.size*1.2);
    ctx.quadraticCurveTo(-level.size, -level.size*0.5, 0, -level.size*1.6);
    ctx.fill();
    ctx.strokeStyle = '#b45309'; ctx.lineWidth = 4; ctx.stroke();
    for (let i = 0; i < 2; i++) {
      const sy = -5 + i * 20;
      ctx.fillStyle = '#d97706'; ctx.fillRect(-level.size*0.6, sy, level.size*1.2, 6);
    }
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-level.size*0.4, 10); ctx.lineTo(-level.size*1.3, 40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(level.size*0.4, 10); ctx.lineTo(level.size*1.3, 40); ctx.stroke();
  }
  else if (game.boatLevel === 3) {
    const hullGrad = ctx.createLinearGradient(-level.size, 0, level.size, 0);
    hullGrad.addColorStop(0, '#1e293b'); hullGrad.addColorStop(0.5, '#334155'); hullGrad.addColorStop(1, '#0f172a');
    ctx.fillStyle = hullGrad;
    ctx.beginPath();
    ctx.moveTo(0, -level.size*1.6);
    ctx.quadraticCurveTo(level.size, -level.size*0.5, level.size*0.8, level.size*1.2);
    ctx.lineTo(-level.size*0.8, level.size*1.2);
    ctx.quadraticCurveTo(-level.size, -level.size*0.5, 0, -level.size*1.6);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#1e293b'; ctx.fillRect(-level.size*0.5, -level.size*0.5, level.size, level.size*0.8);
    const glassGrad = ctx.createLinearGradient(0, -level.size*0.5, 0, -level.size*0.1);
    glassGrad.addColorStop(0, 'rgba(56, 189, 248, 0.8)'); glassGrad.addColorStop(1, 'rgba(14, 165, 233, 0.6)');
    ctx.fillStyle = glassGrad; ctx.fillRect(-level.size*0.4, -level.size*0.4, level.size*0.8, level.size*0.3);
    ctx.fillStyle = '#475569'; ctx.fillRect(-level.size*0.3, level.size*1.2, level.size*0.6, level.size*0.3);
  }
  else if (game.boatLevel === 4) {
    const hullGrad = ctx.createLinearGradient(-level.size, 0, level.size, 0);
    hullGrad.addColorStop(0, '#cbd5e1'); hullGrad.addColorStop(0.5, '#ffffff'); hullGrad.addColorStop(1, '#94a3b8');
    ctx.fillStyle = hullGrad;
    ctx.beginPath();
    ctx.moveTo(0, -level.size*1.6);
    ctx.quadraticCurveTo(level.size, -level.size*0.5, level.size*0.8, level.size*1.2);
    ctx.lineTo(-level.size*0.8, level.size*1.2);
    ctx.quadraticCurveTo(-level.size, -level.size*0.5, 0, -level.size*1.6);
    ctx.fill();
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-level.size*0.75, level.size*0.7); ctx.lineTo(level.size*0.75, level.size*0.7); ctx.stroke();
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(-level.size*0.6, -level.size*0.8, level.size*1.2, level.size*0.8);
    ctx.fillStyle = '#0ea5e9';
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i*level.size*0.3, -level.size*0.4, level.size*0.1, 0, Math.PI*2); ctx.fill(); }
  }
  else if (game.boatLevel === 5) {
    const hullGrad = ctx.createLinearGradient(-level.size*1.1, 0, level.size*1.1, 0);
    hullGrad.addColorStop(0, '#94a3b8'); hullGrad.addColorStop(0.5, '#ffffff'); hullGrad.addColorStop(1, '#64748b');
    ctx.fillStyle = hullGrad;
    ctx.beginPath();
    ctx.moveTo(0, -level.size*1.8);
    ctx.quadraticCurveTo(level.size*1.1, -level.size*0.5, level.size*0.9, level.size*1.2);
    ctx.lineTo(-level.size*0.9, level.size*1.2);
    ctx.quadraticCurveTo(-level.size*1.1, -level.size*0.5, 0, -level.size*1.8);
    ctx.fill();
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-level.size*0.85, level.size*0.6); ctx.lineTo(level.size*0.85, level.size*0.6); ctx.stroke();
    ctx.fillStyle = '#f1f5f9'; ctx.fillRect(-level.size*0.75, -level.size*1.2, level.size*1.5, level.size*0.8);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(-level.size*0.5, -level.size*1.6, level.size, level.size*0.4);
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -level.size*0.85, level.size*0.28, 0, Math.PI*2); ctx.stroke();
    for (let i = -2; i <= 2; i++) {
      const wx = i * level.size * 0.22, wy = level.size*0.15;
      ctx.fillStyle = 'rgba(56, 189, 248, 0.95)';
      ctx.fillRect(wx - level.size*0.06, wy - level.size*0.04, level.size*0.12, level.size*0.06);
    }
  }

  // Грядки
  if (game.zone === 'ocean' && crops.length > 0) {
    for (let i = 0; i < crops.length; i++) {
      const cx = -level.size*0.6 + (i * 15) % level.size;
      const cy = level.size*0.4;
      ctx.fillStyle = '#451a03'; ctx.fillRect(cx - 1, cy - 1, 14, 14);
      ctx.fillStyle = '#1f2937'; ctx.fillRect(cx + 1, cy + 1, 10, 10);
      const h = 8 * crops[i].progress;
      ctx.fillStyle = '#22c55e'; ctx.fillRect(cx + 5, cy + 10 - h, 2, h);
    }
  }

  // ТУРЕЛЬ (меняется по уровням)
  if (tools.turret > 0) {
    ctx.save();
    ctx.translate(0, -level.size*0.5);
    const turretSize = level.size * (0.2 + tools.turret * 0.05);
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, 0, turretSize, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = tools.turret >= 3 ? '#fbbf24' : '#475569'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*turretSize*0.7, Math.sin(a)*turretSize*0.7, 1.5, 0, Math.PI*2); ctx.fill();
    }
    // Направление
    if (megalodon) {
      const wa = Math.atan2(megalodon.y - player.y, megalodon.x - player.x);
      ctx.rotate(wa - (player.angle + Math.PI/2));
    } else if (sharks.length > 0) {
      const wa = Math.atan2(sharks[0].y - player.y, sharks[0].x - player.x);
      ctx.rotate(wa - (player.angle + Math.PI/2));
    }
    // Ствол (длиннее с уровнем)
    const barrelLen = level.size * (0.5 + tools.turret * 0.1);
    ctx.fillStyle = '#475569'; ctx.fillRect(0, -3, barrelLen, 6);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(barrelLen - 5, -5, level.size*0.15, 10);
    // Второй ствол на 3 уровне
    if (tools.turret >= 3) {
      ctx.fillStyle = '#475569'; ctx.fillRect(0, -8, barrelLen*0.9, 5);
      ctx.fillStyle = '#475569'; ctx.fillRect(0, 3, barrelLen*0.9, 5);
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawResource(res) {
  ctx.save();
  ctx.translate(res.x, res.y);
  ctx.rotate(res.rotation);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath(); ctx.ellipse(2, 4, res.r*1.1, res.r*0.5, 0, 0, Math.PI*2); ctx.fill();

  if (res.type === 'wood') {
    for (let j = 0; j < 2; j++) {
      const y = -res.r*0.4 + j * res.r*0.6;
      const g = ctx.createLinearGradient(0, y, 0, y + res.r*0.6);
      g.addColorStop(0, '#b45309'); g.addColorStop(0.5, '#92400e'); g.addColorStop(1, '#78350f');
      ctx.fillStyle = g; ctx.fillRect(-res.r, y, res.r*2, res.r*0.6);
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1; ctx.strokeRect(-res.r, y, res.r*2, res.r*0.6);
    }
  }
  else if (res.type === 'metal') {
    const g = ctx.createLinearGradient(-res.r, 0, res.r, 0);
    g.addColorStop(0, '#1e293b'); g.addColorStop(0.5, '#64748b'); g.addColorStop(1, '#1e293b');
    ctx.fillStyle = g; ctx.fillRect(-res.r*0.8, -res.r, res.r*1.6, res.r*2);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.strokeRect(-res.r*0.8, -res.r, res.r*1.6, res.r*2);
  }
  else if (res.type === 'plastic') {
    ctx.fillStyle = 'rgba(14, 165, 233, 0.8)'; ctx.fillRect(-res.r*0.5, -res.r, res.r, res.r*2);
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(-res.r*0.25, -res.r*1.3, res.r*0.5, 4);
  }
  else if (res.type === 'fabric') {
    const g = ctx.createLinearGradient(-res.r*0.7, 0, res.r*0.7, 0);
    g.addColorStop(0, '#7e22ce'); g.addColorStop(0.5, '#a855f7'); g.addColorStop(1, '#7e22ce');
    ctx.fillStyle = g; ctx.fillRect(-res.r*0.7, -res.r*0.9, res.r*1.4, res.r*1.8);
    ctx.strokeStyle = '#e9d5ff'; ctx.lineWidth = 2; ctx.strokeRect(-res.r*0.7, -res.r*0.9, res.r*1.4, res.r*1.8);
  }
  else if (res.type === 'seed') {
    ctx.fillStyle = '#10b981'; ctx.fillRect(-res.r*0.6, -res.r*0.7, res.r*1.2, res.r*1.4);
    ctx.fillStyle = '#065f46'; ctx.font = `bold ${res.r*0.8}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🌱', 0, 0);
  }
  ctx.restore();
}

function drawShark(sh) {
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.rotate(sh.angle);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath(); ctx.ellipse(0, 0, 25, 10, 0, 0, Math.PI*2); ctx.fill();
  // Цвет зависит от состояния
  ctx.fillStyle = sh.state === 'chase' ? '#dc2626' : '#475569';
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(16, 10); ctx.lineTo(0, 6); ctx.lineTo(-16, 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5; ctx.stroke();
  // Красный глаз если преследует
  if (sh.state === 'chase') {
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.arc(8, -3, 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawOre(ore) {
  ctx.save(); ctx.translate(ore.x, ore.y);
  const rockGrad = ctx.createRadialGradient(-5, -5, 3, 0, 0, 25);
  rockGrad.addColorStop(0, '#475569'); rockGrad.addColorStop(1, '#1e293b');
  ctx.fillStyle = rockGrad;
  ctx.beginPath();
  ctx.moveTo(-20, -8); ctx.lineTo(-13, -20); ctx.lineTo(5, -22); ctx.lineTo(20, -10);
  ctx.lineTo(18, 12); ctx.lineTo(-5, 22); ctx.lineTo(-18, 15); ctx.closePath(); ctx.fill();
  let colors = [];
  if (ore.type === 'copper') colors = ['#fb923c', '#f97316'];
  else if (ore.type === 'iron') colors = ['#cbd5e1', '#94a3b8'];
  else if (ore.type === 'coal') colors = ['#334155', '#0f172a'];
  else if (ore.type === 'gold') colors = ['#fde047', '#fbbf24'];
  else if (ore.type === 'diamond') colors = ['#a5f3fc', '#67e8f9'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath();
    const cx = -10 + i * 10, cy = -2 + (i%2)*4, size = 5;
    ctx.moveTo(cx, cy - size); ctx.lineTo(cx + size*0.6, cy); ctx.lineTo(cx, cy + size); ctx.lineTo(cx - size*0.6, cy);
    ctx.closePath(); ctx.fill();
  }
  if (ore.hp < 3) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(-15, -28, 30, 5);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(-14, -27, 28 * (ore.hp/3), 3);
  }
  ctx.restore();
}

function drawMob(m) {
  ctx.save(); ctx.translate(m.x, m.y);
  if (m.type === 'boar') {
    ctx.fillStyle = '#78350f';
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#451a03';
    ctx.beginPath(); ctx.arc(18, 0, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(10, -5, 2.5, 0, Math.PI*2); ctx.fill();
  } else if (m.type === 'bat') {
    const wing = Math.sin(game.time * 20) * 10;
    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-22, -8 + wing); ctx.lineTo(-12, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22, -8 + wing); ctx.lineTo(12, 0); ctx.fill();
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(-2, -1, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(2, -1, 1.2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBuilding(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.type === 'gen') {
    ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#d8b4fe'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⚡', 0, 2);
    ctx.strokeStyle = 'rgba(168, 85, 247, 0.2)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 250, 0, Math.PI*2); ctx.stroke();
  } else if (b.type === 'drill') {
    ctx.fillStyle = '#64748b'; ctx.fillRect(-22, -22, 44, 44);
    ctx.strokeStyle = b.fuel > 0 ? '#22c55e' : '#ef4444'; ctx.lineWidth = 3;
    ctx.strokeRect(-22, -22, 44, 44);
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(12,8); ctx.lineTo(-12,8); ctx.fill();
    if (b.fuel > 0) {
      ctx.fillStyle = '#22c55e'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b.fuel, 0, 38);
    }
  }
  ctx.restore();
}

function drawMegalodon() {
  if (!megalodon) return;
  ctx.save(); ctx.translate(megalodon.x, megalodon.y); ctx.rotate(megalodon.angle);
  if (megalodon.state === 'charging' && megalodon.stateTimer > 0.5) {
    const auraR = megalodon.r * 2.2;
    const auraGrad = ctx.createRadialGradient(0, 0, megalodon.r, 0, 0, auraR);
    auraGrad.addColorStop(0, 'rgba(239, 68, 68, 0.5)'); auraGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
    ctx.fillStyle = auraGrad; ctx.beginPath(); ctx.arc(0, 0, auraR, 0, Math.PI*2); ctx.fill();
  }
  const bodyGrad = ctx.createLinearGradient(0, -megalodon.r, 0, megalodon.r);
  if (megalodon.hitFlash > 0) { bodyGrad.addColorStop(0, '#fff'); bodyGrad.addColorStop(1, '#e0e0e0'); }
  else { bodyGrad.addColorStop(0, '#475569'); bodyGrad.addColorStop(0.5, '#1e293b'); bodyGrad.addColorStop(1, '#0f172a'); }
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(megalodon.r*1.5, 0);
  ctx.quadraticCurveTo(megalodon.r*0.8, -megalodon.r*1.0, -megalodon.r*0.3, -megalodon.r*0.9);
  ctx.lineTo(-megalodon.r*1.2, -megalodon.r*0.7);
  ctx.lineTo(-megalodon.r*0.9, 0);
  ctx.lineTo(-megalodon.r*1.2, megalodon.r*0.7);
  ctx.lineTo(-megalodon.r*0.3, megalodon.r*0.9);
  ctx.quadraticCurveTo(megalodon.r*0.8, megalodon.r*1.0, megalodon.r*1.5, 0);
  ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2.5; ctx.stroke();
  // Спинной плавник
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  ctx.moveTo(-megalodon.r*0.1, -megalodon.r*0.85);
  ctx.lineTo(-megalodon.r*0.5, -megalodon.r*1.4);
  ctx.lineTo(-megalodon.r*0.5, -megalodon.r*0.7);
  ctx.fill();
  // Хвост
  const tailWave = Math.sin(game.time*8) * 5;
  ctx.beginPath();
  ctx.moveTo(-megalodon.r*1.0, 0);
  ctx.lineTo(-megalodon.r*1.6, -megalodon.r*0.6 + tailWave);
  ctx.lineTo(-megalodon.r*1.4, 0);
  ctx.lineTo(-megalodon.r*1.6, megalodon.r*0.6 + tailWave);
  ctx.fill();
  // Глаза
  ctx.fillStyle = '#ef4444'; ctx.shadowBlur = 15; ctx.shadowColor = '#ef4444';
  ctx.beginPath(); ctx.arc(megalodon.r*0.65, -15, 6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(megalodon.r*0.65, 15, 6, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // Зубы
  if (megalodon.state === 'charging' && megalodon.stateTimer <= 0.5) {
    ctx.fillStyle = '#fff';
    for (let i = -3; i <= 3; i++) {
      const ty = i * 6;
      ctx.beginPath();
      ctx.moveTo(megalodon.r*1.35, ty); ctx.lineTo(megalodon.r*1.55, ty + 3); ctx.lineTo(megalodon.r*1.35, ty + 6);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawPlayer() {
  if (!player.isOnFoot) {
    drawBoat();
    if (fishing.state !== 'idle') {
      const lineLen = 100;
      const lineX = player.x + Math.cos(player.angle) * lineLen;
      const lineY = player.y + Math.sin(player.angle) * lineLen;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(lineX, lineY); ctx.stroke();
      ctx.fillStyle = fishing.state === 'biting' ? '#ef4444' : '#fbbf24';
      ctx.beginPath(); ctx.arc(lineX, lineY, 6, 0, Math.PI*2); ctx.fill();
      if (fishing.state === 'biting') {
        ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign='center';
        ctx.fillText('❗', lineX, lineY - 20);
      }
    }
  } else {
    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0, 5, 12, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -3, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawHarpoons() {
  for (const h of harpoons) {
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.angle);
    ctx.strokeStyle = '#d97706'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(8, 0); ctx.stroke();
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(4, -5); ctx.lineTo(4, 5); ctx.fill();
    ctx.restore();
  }
}

function drawMiniMap() {
  miniCtx.clearRect(0, 0, 220, 220);
  miniCtx.fillStyle = 'rgba(2, 6, 23, 0.9)';
  miniCtx.fillRect(0, 0, 220, 220);
  
  // Мир
  const scaleX = 220 / (WORLD.maxX - WORLD.minX);
  const scaleY = 220 / (WORLD.maxY - WORLD.minY);
  const scale = Math.min(scaleX, scaleY) * 0.9;
  const offsetX = (220 - (WORLD.maxX - WORLD.minX) * scale) / 2;
  const offsetY = (220 - (WORLD.maxY - WORLD.minY) * scale) / 2;
  const wx = (x) => offsetX + (x - WORLD.minX) * scale;
  const wy = (y) => offsetY + (y - WORLD.minY) * scale;
  
  // Рамка мира
  miniCtx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
  miniCtx.lineWidth = 2;
  miniCtx.strokeRect(offsetX, offsetY, (WORLD.maxX - WORLD.minX) * scale, (WORLD.maxY - WORLD.minY) * scale);
  
  // Остров
  if (game.zone === 'ocean' || game.zone === 'island') {
    miniCtx.fillStyle = '#22c55e';
    miniCtx.beginPath();
    miniCtx.arc(wx(island.x), wy(island.y), island.r * scale, 0, Math.PI*2);
    miniCtx.fill();
    miniCtx.fillStyle = '#fcd34d';
    miniCtx.beginPath();
    miniCtx.arc(wx(caveEntrance.x), wy(caveEntrance.y), 4, 0, Math.PI*2);
    miniCtx.fill();
  }
  
  // Ресурсы
  if (game.zone === 'ocean') {
    for (const res of resources) {
      if (res.type === 'wood') miniCtx.fillStyle = '#fbbf24';
      else if (res.type === 'metal') miniCtx.fillStyle = '#cbd5e1';
      else if (res.type === 'plastic') miniCtx.fillStyle = '#38bdf8';
      else if (res.type === 'fabric') miniCtx.fillStyle = '#d8b4fe';
      else miniCtx.fillStyle = '#10b981';
      miniCtx.fillRect(wx(res.x) - 1.5, wy(res.y) - 1.5, 3, 3);
    }
    // Акулы
    for (const sh of sharks) {
      miniCtx.fillStyle = sh.state === 'chase' ? '#ef4444' : '#94a3b8';
      miniCtx.beginPath();
      miniCtx.arc(wx(sh.x), wy(sh.y), 2.5, 0, Math.PI*2);
      miniCtx.fill();
    }
    // Мегалодон
    if (megalodon) {
      miniCtx.fillStyle = '#dc2626';
      miniCtx.beginPath();
      miniCtx.arc(wx(megalodon.x), wy(megalodon.y), 4, 0, Math.PI*2);
      miniCtx.fill();
    }
  }
  
  // Игрок
  miniCtx.fillStyle = '#38bdf8';
  miniCtx.strokeStyle = '#fff';
  miniCtx.lineWidth = 1.5;
  miniCtx.beginPath();
  miniCtx.arc(wx(player.x), wy(player.y), 4, 0, Math.PI*2);
  miniCtx.fill();
  miniCtx.stroke();
  
  // Стрелка направления
  miniCtx.strokeStyle = '#fff';
  miniCtx.beginPath();
  miniCtx.moveTo(wx(player.x), wy(player.y));
  miniCtx.lineTo(wx(player.x) + Math.cos(player.angle) * 8, wy(player.y) + Math.sin(player.angle) * 8);
  miniCtx.stroke();
}

function draw() {
  if (game.zone === 'ocean' || game.zone === 'island') drawOceanBg();
  else if (game.zone === 'cave') { ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, W, H); }

  if (game.state === 'menu') return;

  ctx.save();
  ctx.translate(W/2, H/2); ctx.scale(game.camera.zoom, game.camera.zoom); ctx.translate(-game.camera.x, -game.camera.y);

  // Горы
  if (game.zone === 'ocean' || game.zone === 'island') drawMountains();

  // Остров
  if (game.zone === 'ocean' || game.zone === 'island') drawIsland();

  // Руды
  if (game.zone === 'island' || game.zone === 'cave') {
    for (const ore of ores) drawOre(ore);
  }

  // Пещера (лифт, выход)
  if (game.zone === 'cave') {
    if (game.caveDepth < 3) {
      ctx.fillStyle = '#475569'; ctx.fillRect(-30, -430, 60, 60);
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.strokeRect(-30, -430, 60, 60);
      ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign='center';
      ctx.fillText('🛗', 0, -390);
    }
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, 400, 40, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🚪', 0, 410);
  }

  // Постройки
  for (const b of buildings) drawBuilding(b);
  // Мобы
  for (const m of mobs) drawMob(m);
  // Босс
  if (megalodon) drawMegalodon();
  // Гарпуны
  drawHarpoons();
  // Ресурсы и акулы
  if (game.zone === 'ocean') {
    for (const res of resources) drawResource(res);
    for (const sh of sharks) drawShark(sh);
  }
  // Игрок
  drawPlayer();
  // Частицы
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Ночь/пещера
  if (game.zone === 'ocean' && game.isNight) {
    const lightGrad = ctx.createRadialGradient(player.x, player.y, 80, player.x, player.y, 350);
    lightGrad.addColorStop(0, 'rgba(15, 23, 42, 0)'); lightGrad.addColorStop(1, 'rgba(2, 6, 23, 0.9)');
    ctx.fillStyle = lightGrad; ctx.beginPath(); ctx.arc(player.x, player.y, 450, 0, Math.PI*2); ctx.fill();
  } else if (game.zone === 'cave') {
    const darkness = Math.min(0.95, 0.8 + game.caveDepth * 0.05);
    const lightGrad = ctx.createRadialGradient(player.x, player.y, 50, player.x, player.y, 200);
    lightGrad.addColorStop(0, 'rgba(0, 0, 0, 0)'); lightGrad.addColorStop(1, `rgba(0, 0, 0, ${darkness})`);
    ctx.fillStyle = lightGrad; ctx.beginPath(); ctx.arc(player.x, player.y, 300, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();

  // Джойстик
  if (joystick.active) {
    ctx.save(); ctx.globalAlpha = 0.2;
    ctx.beginPath(); ctx.arc(joystick.bx, joystick.by, JOY_MAX, 0, Math.PI*2); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(joystick.bx + joystick.dx*JOY_MAX, joystick.by + joystick.dy*JOY_MAX, 22, 0, Math.PI*2); ctx.fillStyle = '#38bdf8'; ctx.fill();
    ctx.restore();
  }

  // Мини-карта
  drawMiniMap();

  // Предупреждение
  if (bossWarningTimer > 0 && !megalodon) {
    ctx.fillStyle = 'rgba(239, 68, 68, ' + (Math.sin(game.time * 15) * 0.5 + 0.5) + ')';
    ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('ВНИМАНИЕ: МЕГАЛОДОН', W/2, H/2 - 60);
    ctx.fillText('ПРИБЛИЖАЕТСЯ', W/2, H/2 - 30);
  }
}

function loop(now) {
  let dt = (now - lastTime) / 1000; lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (game.state === 'playing') {
    update(dt); draw();
  }
  requestAnimationFrame(loop);
}

function showMenu() {
  game.state = 'menu';
  overlayContent.innerHTML = `
    <h1 class="title">МОРСКОЙ ВОЛК</h1>
    <p class="subtitle">Выживи, победи Мегалодона, построй империю!</p>
    <button class="btn" id="playBtn">▶ НАЧАТЬ</button>
    <div class="hint">
      <p>🕹️ Двигайся пальцем</p>
      <p>🛠️ Крафт и улучшения в ВЕРСТАКЕ</p>
      <p>🎯 Турель автостреляет по врагам</p>
      <p>🦈 Акулы патрулируют океан</p>
      <p>🏝️ Найди остров для шахт</p>
      <p>⚡ Убей босса — получи ядро</p>
    </div>`;
  overlay.classList.add('active');
  document.getElementById('playBtn').addEventListener('click', startGame);
}

window.addEventListener('error', e => console.error('JS ERROR:', e.message, e.lineno));

showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
