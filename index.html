<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Выживание: Зомби</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0e14;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e6edf3;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }

  #pauseBtn {
    position: absolute; top: 12px; right: 12px;
    width: 46px; height: 46px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 13px;
    background: rgba(255,255,255,0.08);
    color: #e6edf3; font-size: 20px; line-height: 1;
    z-index: 5; cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  #pauseBtn:active { background: rgba(255,255,255,0.18); }

  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(4, 8, 16, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlayContent { text-align: center; max-width: 460px; width: 100%; }

  .title {
    font-size: 34px; font-weight: 800; letter-spacing: 3px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ef4444, #f97316);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title.blue {
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 22px; }

  .btn {
    display: block; width: 100%; padding: 16px 20px; margin: 10px 0;
    border: none; border-radius: 15px;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff; font-size: 17px; font-weight: 700;
    font-family: inherit; letter-spacing: 0.5px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.965); }

  .btn.upgrade {
    background: linear-gradient(135deg, #15803d, #14532d);
    box-shadow: 0 6px 20px rgba(21, 128, 61, 0.35);
    text-align: left; padding: 15px 18px;
  }
  .btn.upgrade .t { display: block; font-size: 16px; margin-bottom: 3px; }
  .btn.upgrade .d { display: block; font-size: 12.5px; font-weight: 400; opacity: 0.8; }

  .btn.gray {
    background: linear-gradient(135deg, #4b5563, #374151);
    box-shadow: none;
  }

  .hint { margin-top: 18px; font-size: 13px; color: #6b7280; line-height: 2; }

  .stats {
    display: flex; justify-content: space-around; margin: 18px 0 24px;
    background: rgba(255,255,255,0.05); border-radius: 14px; padding: 16px 8px;
  }
  .stats div { display: flex; flex-direction: column; gap: 4px; }
  .stats span { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }
  .stats b { font-size: 22px; color: #f3f4f6; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="pauseBtn" aria-label="Пауза">⏸</button>
<div id="overlay" class="hidden"><div id="overlayContent"></div></div>

<script>
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayContent = document.getElementById('overlayContent');
const pauseBtn = document.getElementById('pauseBtn');

let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let actx = null;
function initAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type = 'square', vol = 0.04) {
  if (!actx || actx.state !== 'running') return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

const game = {
  state: 'menu',
  player: null,
  zombies: [],
  bullets: [],
  particles: [],
  pickups: [],
  wave: 0,
  score: 0,
  kills: 0,
  time: 0,
  spawnQueue: [],
  spawnTimer: 0,
  waveActive: false,
};

const ZOMBIE_TYPES = {
  normal: { hp: 30,  speed: 48, r: 13, dps: 11, color: '#5d8a4a', score: 10 },
  fast:   { hp: 18,  speed: 98, r: 10, dps: 15, color: '#b8493a', score: 15 },
  tank:   { hp: 150, speed: 30, r: 21, dps: 22, color: '#7d5aa0', score: 35 },
};

let shake = 0;
let currentUpgrades = [];

function createPlayer() {
  return {
    x: W / 2, y: H / 2,
    r: 14,
    hp: 100, maxHp: 100,
    speed: 185,
    angle: -Math.PI / 2,
    fireRate: 4.5,
    damage: 11,
    bulletSpeed: 620,
    pierce: 0,
    shootCooldown: 0,
    hurtFlash: 0,
  };
}

const joystick = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
const JOY_MAX = 62;
const keys = { w: false, a: false, s: false, d: false };

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (!joystick.active) {
      joystick.active = true;
      joystick.id = t.identifier;
      joystick.bx = t.clientX;
      joystick.by = t.clientY;
      joystick.dx = 0; joystick.dy = 0;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      let dx = t.clientX - joystick.bx;
      let dy = t.clientY - joystick.by;
      const d = Math.hypot(dx, dy);
      if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
      joystick.dx = dx / JOY_MAX;
      joystick.dy = dy / JOY_MAX;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      joystick.active = false;
      joystick.id = null;
      joystick.dx = 0; joystick.dy = 0;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k] = true;
  if (k === 'escape') togglePause();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k in keys) keys[k] = false;
});

function roundRect(x, y, w, h, r) {
  if (w <= 0 || h <= 0) return;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function nearestZombie(x, y) {
  let best = null, bestD = Infinity;
  for (const z of game.zombies) {
    const dx = z.x - x, dy = z.y - y;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = z; }
  }
  return best;
}

function spawnBlood(x, y, count = 6, spread = 1) {
  for (let i = 0; i < count; i++) {
    if (game.particles.length > 320) break;
    const a = Math.random() * Math.PI * 2;
    const s = (40 + Math.random() * 130) * spread;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 0.35 + Math.random() * 0.45,
      maxLife: 0.8,
      size: 2 + Math.random() * 3,
      color: `hsl(${348 + Math.random() * 16}, 82%, ${32 + Math.random() * 22}%)`,
    });
  }
}

function spawnMuzzle(x, y, angle) {
  for (let i = 0; i < 4; i++) {
    if (game.particles.length > 320) break;
    const a = angle + (Math.random() - 0.5) * 0.9;
    const s = 90 + Math.random() * 140;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 0.12 + Math.random() * 0.1,
      maxLife: 0.25,
      size: 2 + Math.random() * 2.5,
      color: '#ffd166',
    });
  }
}

function startWave(n) {
  game.wave = n;
  game.spawnQueue = [];
  game.spawnTimer = 0;
  game.waveActive = true;

  const count = Math.floor(5 + n * 2.4);
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    let type = 'normal';
    if (n >= 2 && r < 0.30) type = 'fast';
    if (n >= 3 && r < 0.12) type = 'tank';
    game.spawnQueue.push(type);
  }
  game.state = 'playing';
}

function spawnZombie(type) {
  const cfg = ZOMBIE_TYPES[type];
  const side = Math.floor(Math.random() * 4);
  const m = 70;
  let x, y;
  if (side === 0)      { x = Math.random() * W; y = -m; }
  else if (side === 1) { x = W + m; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + m; }
  else                 { x = -m; y = Math.random() * H; }

  const hpScale = 1 + (game.wave - 1) * 0.17;
  const spScale = 1 + (game.wave - 1) * 0.035;
  const hp = Math.round(cfg.hp * hpScale);

  game.zombies.push({
    x, y, type,
    r: cfg.r,
    hp, maxHp: hp,
    speed: cfg.speed * spScale,
    dps: cfg.dps,
    color: cfg.color,
    score: cfg.score,
    angle: 0,
    hitFlash: 0,
  });
}

function waveComplete() {
  game.waveActive = false;
  const p = game.player;
  p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.12);
  beep(880, 0.12, 'sine', 0.06);
  setTimeout(() => beep(1180, 0.18, 'sine', 0.06), 110);
  showUpgrades();
}

const UPGRADES = [
  { name: '💥 Урон',            desc: '+25% к урону пуль',            apply: p => { p.damage *= 1.25; } },
  { name: '⚡ Скорострельность', desc: '+20% к скорости стрельбы',     apply: p => { p.fireRate *= 1.2; } },
  { name: '❤️ Здоровье',        desc: '+30 к макс. HP и полное лечение', apply: p => { p.maxHp += 30; p.hp = p.maxHp; } },
  { name: '👟 Скорость',        desc: '+15% к скорости передвижения', apply: p => { p.speed *= 1.15; } },
  { name: '🎯 Пробивание',      desc: 'Пули пробивают +1 врага',      apply: p => { p.pierce += 1; } },
  { name: '🚀 Скорость пуль',   desc: '+30% к скорости полёта пуль',  apply: p => { p.bulletSpeed *= 1.3; } },
  { name: '🩹 Аптечка',         desc: 'Восстановить 60 HP',           apply: p => { p.hp = Math.min(p.maxHp, p.hp + 60); },
    cond: p => p.hp < p.maxHp * 0.9 },
];

function pickUpgrades(n) {
  const p = game.player;
  const pool = UPGRADES.filter(u => !u.cond || u.cond(p));
  const res = [];
  const copy = pool.slice();
  while (res.length < n && copy.length) {
    const i = Math.floor(Math.random() * copy.length);
    res.push(copy.splice(i, 1)[0]);
  }
  return res;
}

function showOverlay(html) {
  overlayContent.innerHTML = html;
  overlay.classList.remove('hidden');
}
function hideOverlay() {
  overlay.classList.add('hidden');
}

function showMenu() {
  game.state = 'menu';
  game.player = null;
  game.zombies = [];
  game.bullets = [];
  game.particles = [];
  game.pickups = [];
  showOverlay(`
    <h1 class="title">ВЫЖИВАНИЕ</h1>
    <p class="subtitle">Зомби наступают. Продержись как можно дольше.</p>
    <button class="btn" onclick="startGame()">▶ ИГРАТЬ</button>
    <div class="hint">
      <p>🕹️ Води пальцем по экрану — движение</p>
      <p>🎯 Стрельба ведётся автоматически</p>
      <p>⬆️ После каждой волны выбирай улучшение</p>
    </div>
  `);
}

function showUpgrades() {
  game.state = 'upgrade';
  currentUpgrades = pickUpgrades(3);
  let html = `
    <h2 class="title blue" style="font-size:26px">ВОЛНА ${game.wave} ПРОЙДЕНА</h2>
    <p class="subtitle">Выбери улучшение</p>`;
  currentUpgrades.forEach((u, i) => {
    html += `<button class="btn upgrade" onclick="chooseUpgrade(${i})">
      <span class="t">${u.name}</span>
      <span class="d">${u.desc}</span>
    </button>`;
  });
  showOverlay(html);
}

function showGameOver() {
  game.state = 'gameover';
  beep(140, 0.5, 'sawtooth', 0.09);
  showOverlay(`
    <h1 class="title">ТЫ ПАЛ</h1>
    <p class="subtitle">Зомби добрались до тебя...</p>
    <div class="stats">
      <div><span>Волна</span><b>${game.wave}</b></div>
      <div><span>Убито</span><b>${game.kills}</b></div>
      <div><span>Очки</span><b>${game.score}</b></div>
    </div>
    <button class="btn" onclick="startGame()">↻ ЗАНОВО</button>
  `);
}

function togglePause() {
  if (game.state === 'playing') {
    game.state = 'paused';
    joystick.active = false; joystick.dx = 0; joystick.dy = 0;
    showOverlay(`
      <h1 class="title blue">ПАУЗА</h1>
      <p class="subtitle">Волна ${game.wave}</p>
      <button class="btn" onclick="resumeGame()">▶ ПРОДОЛЖИТЬ</button>
      <button class="btn gray" onclick="showMenu()">В МЕНЮ</button>
    `);
  } else if (game.state === 'paused') {
    resumeGame();
  }
}

window.startGame = function () {
  initAudio();
  game.player = createPlayer();
  game.zombies = [];
  game.bullets = [];
  game.particles = [];
  game.pickups = [];
  game.score = 0;
  game.kills = 0;
  game.time = 0;
  shake = 0;
  hideOverlay();
  startWave(1);
  beep(520, 0.1, 'square', 0.05);
};

window.resumeGame = function () {
  hideOverlay();
  game.state = 'playing';
  joystick.active = false; joystick.dx = 0; joystick.dy = 0;
};

window.chooseUpgrade = function (i) {
  const u = currentUpgrades[i];
  if (u) u.apply(game.player);
  beep(700, 0.1, 'sine', 0.06);
  hideOverlay();
  startWave(game.wave + 1);
};

window.showMenu = showMenu;

pauseBtn.addEventListener('click', e => {
  e.preventDefault();
  togglePause();
});

function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  if (game.state !== 'playing') return;

  const p = game.player;
  game.time += dt;

  let mx = 0, my = 0;
  if (joystick.active) { mx = joystick.dx; my = joystick.dy; }
  if (keys.w) my -= 1;
  if (keys.s) my += 1;
  if (keys.a) mx -= 1;
  if (keys.d) mx += 1;

  const mag = Math.hypot(mx, my);
  if (mag > 1) { mx /= mag; my /= mag; }
  if (mag > 0.02) {
    p.x += mx * p.speed * dt;
    p.y += my * p.speed * dt;
  }
  p.x = Math.max(p.r, Math.min(W - p.r, p.x));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y));

  const target = nearestZombie(p.x, p.y);
  if (target) p.angle = Math.atan2(target.y - p.y, target.x - p.x);

  p.shootCooldown -= dt;
  if (target && p.shootCooldown <= 0) {
    p.shootCooldown = 1 / p.fireRate;
    const a = p.angle + (Math.random() - 0.5) * 0.07;
    const bx = p.x + Math.cos(a) * (p.r + 8);
    const by = p.y + Math.sin(a) * (p.r + 8);
    game.bullets.push({
      x: bx, y: by,
      vx: Math.cos(a) * p.bulletSpeed,
      vy: Math.sin(a) * p.bulletSpeed,
      r: 4, dmg: p.damage,
      pierce: p.pierce, hits: [],
    });
    spawnMuzzle(bx, by, a);
    beep(240 + Math.random() * 40, 0.045, 'square', 0.022);
  }

  if (game.spawnQueue.length > 0) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      const interval = Math.max(0.28, 0.9 - game.wave * 0.03);
      game.spawnTimer = interval;
      const type = game.spawnQueue.shift();
      if (game.zombies.length < 90) spawnZombie(type);
    }
  }

  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) {
      game.bullets.splice(i, 1);
      continue;
    }

    let removed = false;
    for (const z of game.zombies) {
      if (z.hp <= 0) continue;
      if (b.hits.indexOf(z) !== -1) continue;
      const dx = z.x - b.x, dy = z.y - b.y;
      if (dx * dx + dy * dy < (z.r + b.r) * (z.r + b.r)) {
        z.hp -= b.dmg;
        z.hitFlash = 0.12;
        b.hits.push(z);
        spawnBlood(b.x, b.y, 4, 0.7);
        beep(150, 0.035, 'sawtooth', 0.022);
        if (b.pierce > 0) {
          b.pierce--;
          b.dmg *= 0.85;
        } else {
          game.bullets.splice(i, 1);
          removed = true;
        }
        break;
      }
    }
    if (removed) continue;
  }

  for (const z of game.zombies) {
    if (z.hitFlash > 0) z.hitFlash -= dt;
    const dx = p.x - z.x, dy = p.y - z.y;
    const d = Math.hypot(dx, dy) || 1;
    z.x += (dx / d) * z.speed * dt;
    z.y += (dy / d) * z.speed * dt;
    z.angle = Math.atan2(dy, dx);
  }

  const zs = game.zombies;
  for (let i = 0; i < zs.length; i++) {
    const a = zs[i];
    for (let j = i + 1; j < zs.length; j++) {
      const b = zs[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const minD = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 < minD * minD && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const push = (minD - d) * 0.5;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }

  let touching = false;
  for (const z of game.zombies) {
    const dx = p.x - z.x, dy = p.y - z.y;
    const d = Math.hypot(dx, dy);
    if (d < z.r + p.r) {
      p.hp -= z.dps * dt;
      touching = true;
    }
  }
  if (touching) {
    p.hurtFlash = Math.min(1, p.hurtFlash + dt * 4);
    shake = Math.min(12, shake + dt * 45);
    if (Math.random() < dt * 3) beep(70, 0.09, 'sawtooth', 0.05);
  } else {
    p.hurtFlash = Math.max(0, p.hurtFlash - dt * 2);
  }

  for (let i = game.zombies.length - 1; i >= 0; i--) {
    const z = game.zombies[i];
    if (z.hp <= 0) {
      game.zombies.splice(i, 1);
      game.kills++;
      game.score += Math.round(z.score * (1 + game.wave * 0.1));
      spawnBlood(z.x, z.y, 14, 1.3);
      beep(95, 0.12, 'sawtooth', 0.045);
      if (Math.random() < 0.075) {
        game.pickups.push({ x: z.x, y: z.y, r: 12, life: 22 });
      }
    }
  }

  for (let i = game.pickups.length - 1; i >= 0; i--) {
    const pk = game.pickups[i];
    pk.life -= dt;
    if (pk.life <= 0) { game.pickups.splice(i, 1); continue; }
    const dx = p.x - pk.x, dy = p.y - pk.y;
    if (dx * dx + dy * dy < (p.r + pk.r + 6) * (p.r + pk.r + 6)) {
      p.hp = Math.min(p.maxHp, p.hp + 30);
      game.pickups.splice(i, 1);
      beep(880, 0.1, 'sine', 0.07);
      beep(1180, 0.1, 'sine', 0.05);
    }
  }

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vx *= 0.92;
    pt.vy *= 0.92;
    pt.life -= dt;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }

  if (p.hp <= 0) {
    p.hp = 0;
    spawnBlood(p.x, p.y, 30, 1.6);
    showGameOver();
    return;
  }

  if (game.waveActive && game.spawnQueue.length === 0 && game.zombies.length === 0) {
    waveComplete();
  }
}

function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  ctx.beginPath();
  ctx.ellipse(0, p.r * 0.75, p.r * 0.95, p.r * 0.45, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(-p.r * 0.3, -p.r * 0.3, 2, 0, 0, p.r);
  grad.addColorStop(0, '#93c5fd');
  grad.addColorStop(1, '#2563eb');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#bfdbfe';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.rotate(p.angle);
  ctx.fillStyle = '#1e293b';
  roundRect(p.r * 0.35, -4.5, p.r * 1.15, 9, 3);
  ctx.fill();
  ctx.fillStyle = '#475569';
  roundRect(p.r * 1.3, -3, 6, 6, 2);
  ctx.fill();

  ctx.restore();

  if (p.hurtFlash > 0) {
    ctx.save();
    ctx.globalAlpha = p.hurtFlash * 0.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ef4444';
    ctx.fill();
    ctx.restore();
  }
}

function drawZombie(z) {
  ctx.save();
  ctx.translate(z.x, z.y);

  ctx.beginPath();
  ctx.ellipse(0, z.r * 0.72, z.r * 0.9, z.r * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, z.r, 0, Math.PI * 2);
  ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : z.color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.rotate(z.angle);
  ctx.fillStyle = '#1a0a0a';
  ctx.beginPath();
  ctx.arc(z.r * 0.32, -z.r * 0.36, z.r * 0.17, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(z.r * 0.32, z.r * 0.36, z.r * 0.17, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  if (z.hp < z.maxHp) {
    const w = z.r * 2;
    const x = z.x - z.r;
    const y = z.y - z.r - 9;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(x, y, w, 4, 2); ctx.fill();
    ctx.fillStyle = '#ef4444';
    roundRect(x, y, w * Math.max(0, z.hp / z.maxHp), 4, 2); ctx.fill();
  }
}

function drawHUD() {
  const p = game.player;

  const barW = Math.min(170, W * 0.36);
  const barH = 17;
  const bx = 14, by = 14;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(bx, by, barW, barH, 8.5); ctx.fill();

  const frac = Math.max(0, Math.min(1, p.hp / p.maxHp));
  ctx.fillStyle = frac > 0.5 ? '#22c55e' : frac > 0.25 ? '#eab308' : '#ef4444';
  roundRect(bx, by, barW * frac, barH, 8.5); ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${Math.max(0, Math.ceil(p.hp))} / ${p.maxHp}`, bx + 9, by + barH / 2 + 0.5);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = '#e6edf3';
  ctx.fillText(`ВОЛНА ${game.wave}`, W / 2, 23);

  ctx.textAlign = 'right';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(`★ ${game.score}`, W - 68, 23);

  ctx.textAlign = 'left';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(230,237,243,0.5)';
  const left = game.zombies.length + game.spawnQueue.length;
  ctx.fillText(`Врагов: ${left}   Убито: ${game.kills}`, 15, 44);
}

function drawJoystick() {
  if (!joystick.active) return;

  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.beginPath();
  ctx.arc(joystick.bx, joystick.by, JOY_MAX, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  const kx = joystick.bx + joystick.dx * JOY_MAX;
  const ky = joystick.by + joystick.dy * JOY_MAX;

  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.arc(kx, ky, 27, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(kx - 8, ky - 8, 3, kx, ky, 27);
  g.addColorStop(0, '#93c5fd');
  g.addColorStop(1, '#3b82f6');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();
}

function render() {
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(110, 150, 210, 0.055)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const gs = 52;
  for (let x = 0; x < W; x += gs) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = 0; y < H; y += gs) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();

  if (!game.player) return;

  ctx.save();
  if (shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  const p = game.player;

  for (const pk of game.pickups) {
    const pulse = 1 + Math.sin(game.time * 6 + pk.x) * 0.12;
    const r = pk.r * pulse;
    ctx.save();
    ctx.translate(pk.x, pk.y);
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = '#16a34a';
    ctx.fill();
    ctx.strokeStyle = '#86efac';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    roundRect(-3.5, -8, 7, 16, 1.5); ctx.fill();
    roundRect(-8, -3.5, 16, 7, 1.5); ctx.fill();
    ctx.restore();
  }

  for (const pt of game.particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const z of game.zombies) drawZombie(z);

  ctx.save();
  ctx.fillStyle = '#fde047';
  ctx.shadowColor = '#facc15';
  ctx.shadowBlur = 8;
  for (const b of game.bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  drawPlayer(p);

  ctx.restore();

  drawHUD();
  drawJoystick();
}

let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

showMenu();
requestAnimationFrame(loop);

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
</script>
</body>
