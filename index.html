<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Морской Волк: Индустриализация</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f172a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #f8fafc;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }

  #uiLayer {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; padding: 10px;
  }

  .top-panel { display: flex; justify-content: space-between; align-items: flex-start; }
  
  #bossBarContainer {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    width: 85%; max-width: 400px; display: none; flex-direction: column; align-items: center;
  }
  .boss-name { font-size: 16px; font-weight: 900; color: #ef4444; letter-spacing: 2px; text-shadow: 0 2px 4px #000; margin-bottom: 4px; }
  .boss-bar-bg { width: 100%; height: 16px; background: rgba(0,0,0,0.8); border: 2px solid #7f1d1d; border-radius: 8px; overflow: hidden; }
  .boss-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #b91c1c, #ef4444, #f87171); transition: width 0.1s; }

  .stats-container {
    display: flex; flex-direction: column; gap: 5px;
    background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 10px 14px; width: 150px;
  }
  .bar-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.6); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; width: 100%; transition: width 0.2s; border-radius: 5px; }
  .hp-fill { background: linear-gradient(90deg, #dc2626, #f87171); }
  .hunger-fill { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .thirst-fill { background: linear-gradient(90deg, #0284c7, #38bdf8); }

  .resources {
    background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 10px 14px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 15px;
    font-weight: 800; font-size: 14px;
  }
  .res-wood { color: #fbbf24; } .res-metal { color: #cbd5e1; }
  .res-plastic { color: #38bdf8; } .res-fabric { color: #d8b4fe; }
  .res-copper { color: #f97316; } .res-iron { color: #94a3b8; }
  .res-coal { color: #cbd5e1; } .res-gold { color: #fbbf24; } .res-diamond { color: #67e8f9; }
  .res-core { color: #a855f7; font-size: 16px; grid-column: span 2; text-align: center; }

  #pauseBtn {
    width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px; background: rgba(15, 23, 42, 0.9);
    color: #f8fafc; font-size: 20px; pointer-events: auto;
    position: absolute; bottom: 20px; left: 20px; z-index: 5;
  }

  .inventory {
    pointer-events: auto; background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 8px 14px;
    margin-top: 10px; display: flex; gap: 15px; font-size: 14px; font-weight: 800;
  }

  .bottom-panel { display: flex; justify-content: flex-end; align-items: flex-end; }
  .actions {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    pointer-events: auto; width: 100%; max-width: 300px; margin-left: auto;
  }

  .action-btn {
    width: 100%; aspect-ratio: 1; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(30, 41, 59, 0.9);
    color: white; font-size: 24px; display: flex; justify-content: center; align-items: center;
    transition: transform 0.1s, background 0.2s;
  }
  .action-btn:active { transform: scale(0.9); background: rgba(56, 189, 248, 0.4); }
  .action-btn:disabled { opacity: 0.4; filter: grayscale(1); }
  .action-btn.upgrade-btn {
    grid-column: span 4; width: 100%; aspect-ratio: auto; height: 50px;
    font-size: 14px; font-weight: 900; border-radius: 12px;
    background: linear-gradient(135deg, #10b981, #047857); flex-direction: column; gap: 2px;
  }
  .action-btn.upgrade-btn .cost { font-size: 11px; font-weight: 600; opacity: 0.9; }
  .action-btn.craft-btn { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
  
  #interactBtn {
    display: none; position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    padding: 15px 30px; border-radius: 30px; border: 2px solid #38bdf8;
    background: rgba(15, 23, 42, 0.95); color: #38bdf8; font-weight: 900; font-size: 16px;
    pointer-events: auto; white-space: nowrap;
  }
  #interactBtn:active { background: rgba(56, 189, 248, 0.2); }

  #toast {
    position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    background: rgba(168, 85, 247, 0.95); color: white; padding: 10px 20px;
    border-radius: 20px; font-weight: 800; font-size: 14px; pointer-events: none;
    opacity: 0; transition: opacity 0.3s; z-index: 20; text-align: center;
    max-width: 80%;
  }

  #overlay {
    position: absolute; inset: 0;
    background: #0f172a;
    z-index: 10; display: flex; justify-content: center; align-items: flex-start;
    overflow-y: auto; text-align: center;
  }
  #overlay.hidden { display: none; }
  .modal { width: 100%; max-width: 420px; padding: 20px; padding-top: 70px; padding-bottom: 80px; margin: 0 auto; }

  .craft-close-top {
    position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
    z-index: 100; width: calc(100% - 40px); max-width: 380px;
    padding: 12px; background: #475569; color: white;
    border: none; border-radius: 12px; font-weight: 800; font-size: 15px;
    pointer-events: auto;
  }
  
  .title { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-bottom: 15px; color: #38bdf8; }
  .title.red { color: #ef4444; }
  .title.purple { color: #a855f7; }
  .subtitle { font-size: 15px; color: #94a3b8; margin-bottom: 25px; line-height: 1.6; }
  
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #0f172a;
    font-size: 17px; font-weight: 800; margin-bottom: 12px;
  }
  .btn:active { background: #0ea5e9; }
  .btn-gray { background: linear-gradient(135deg, #475569, #334155); color: white; }
  
  .craft-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
  .craft-item {
    background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 15px; text-align: left;
  }
  .craft-item .craft-title { font-weight: 900; font-size: 16px; margin-bottom: 6px; display: flex; justify-content: space-between;}
  .craft-item .craft-desc { font-size: 13px; color: #cbd5e1; margin-bottom: 10px; line-height: 1.4; }
  .craft-item .craft-cost { font-size: 13px; font-weight: 800; margin-bottom: 10px; color: #fbbf24; }
  .craft-item .craft-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; font-weight: 800; font-size: 15px;
  }
  .craft-item .craft-btn:disabled { background: #475569; opacity: 0.6; }
  
  .hint { font-size: 13px; color: #64748b; margin-top: 15px; line-height: 2; text-align: left; padding-left: 10px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="uiLayer">
  <div class="top-panel">
    <div>
      <div class="stats-container">
        <div class="bar-bg"><div class="bar-fill hp-fill" id="hpBar"></div></div>
        <div class="bar-bg"><div class="bar-fill hunger-fill" id="hungerBar"></div></div>
        <div class="bar-bg"><div class="bar-fill thirst-fill" id="thirstBar"></div></div>
      </div>
      <div class="inventory">
        <span>🐟 <span id="invFish">0</span></span>
        <span>💧 <span id="invWater">0</span></span>
        <span>🥩 <span id="invMeat">0</span></span>
      </div>
    </div>
    <div class="resources">
      <div><span class="res-wood">🪵</span> <span id="uiWood">0</span></div>
      <div><span class="res-metal">⚙️</span> <span id="uiMetal">0</span></div>
      <div><span class="res-plastic">🧴</span> <span id="uiPlastic">0</span></div>
      <div><span class="res-fabric">🧵</span> <span id="uiFabric">0</span></div>
      <div><span class="res-copper">🟠</span> <span id="uiCopper">0</span></div>
      <div><span class="res-iron">⛓️</span> <span id="uiIron">0</span></div>
      <div><span class="res-coal">⚫</span> <span id="uiCoal">0</span></div>
      <div id="goldRow" style="display:none;"><span class="res-gold">🟡</span> <span id="uiGold">0</span></div>
      <div id="diamondRow" style="display:none;"><span class="res-diamond">💎</span> <span id="uiDiamond">0</span></div>
      <div class="res-core" id="coreRow" style="display:none;">🔮 <span id="uiCore">0</span></div>
    </div>
  </div>
  
  <div id="bossBarContainer">
    <div class="boss-name">🦈 МЕГАЛОДОН 🦈</div>
    <div class="boss-bar-bg"><div class="boss-bar-fill" id="bossHpBar"></div></div>
  </div>

  <button id="pauseBtn">⏸</button>
  <button id="interactBtn">ДЕЙСТВИЕ</button>
  <div id="toast"></div>

  <div class="bottom-panel">
    <div class="actions">
      <button class="action-btn upgrade-btn" id="upgradeBtn">
        <span>УЛУЧШИТЬ СУДНО</span>
        <span class="cost" id="uiCost">🪵 40 | ⚙️ 10</span>
      </button>
      <button class="action-btn" id="fishBtn">🎣</button>
      <button class="action-btn" id="purifyBtn">💧</button>
      <button class="action-btn" id="plantBtn">🌱</button>
      <button class="action-btn craft-btn" id="craftBtn">🛠️</button>
    </div>
  </div>
</div>

<div id="overlay" class="hidden"><div class="modal" id="overlayContent"></div></div>

<script>
"use strict";

// ИСПРАВЛЕНИЕ ОШИБКИ КРАФТА: переменная объявлена в самом начале
let lastTime = performance.now();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayContent = document.getElementById('overlayContent');
const toastEl = document.getElementById('toast');

const uiWood = document.getElementById('uiWood'); const uiMetal = document.getElementById('uiMetal');
const uiPlastic = document.getElementById('uiPlastic'); const uiFabric = document.getElementById('uiFabric');
const uiCopper = document.getElementById('uiCopper'); const uiIron = document.getElementById('uiIron');
const uiCoal = document.getElementById('uiCoal'); const uiGold = document.getElementById('uiGold');
const uiDiamond = document.getElementById('uiDiamond'); const uiCore = document.getElementById('uiCore');
const coreRow = document.getElementById('coreRow'); const goldRow = document.getElementById('goldRow'); const diamondRow = document.getElementById('diamondRow');
const uiCost = document.getElementById('uiCost'); const upgradeBtn = document.getElementById('upgradeBtn');
const fishBtn = document.getElementById('fishBtn'); const purifyBtn = document.getElementById('purifyBtn');
const plantBtn = document.getElementById('plantBtn'); const craftBtn = document.getElementById('craftBtn');
const pauseBtn = document.getElementById('pauseBtn'); const interactBtn = document.getElementById('interactBtn');
const bossBarContainer = document.getElementById('bossBarContainer'); const bossHpBar = document.getElementById('bossHpBar');
const invFish = document.getElementById('invFish'); const invWater = document.getElementById('invWater'); const invMeat = document.getElementById('invMeat');
const hpBar = document.getElementById('hpBar'); const hungerBar = document.getElementById('hungerBar'); const thirstBar = document.getElementById('thirstBar');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

let actx = null;
function initAudio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.05) {
  if (!actx || actx.state !== 'running') return;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}

function pseudo(n) {
  const x = Math.sin(n * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

const game = {
  state: 'menu', wood: 0, metal: 0, plastic: 0, fabric: 0, copper: 0, iron: 0, coal: 0, gold: 0, diamond: 0, core: 0,
  boatLevel: 1, isNight: false, zone: 'ocean', caveDepth: 1,
  blueprints: { gen: false, drill: false },
  camera: { x: 0, y: 0, zoom: 1, targetZoom: 1 }, time: 0, toastTimer: 0
};

const player = {
  x: 0, y: 0, vx: 0, vy: 0, angle: -Math.PI/2, wakeTimer: 0,
  hp: 100, maxHp: 100, hunger: 100, maxHunger: 100, thirst: 100, maxThirst: 100,
  isOnFoot: false, interactMode: 'none', invuln: 0
};

const inventory = { fish: 0, water: 0, seeds: 0, crops: 0, meat: 0 };
const tools = { rod: 1, farm: 1, purifier: 1, turret: 0 };

let fishing = { state: 'idle', timer: 0 };
let purifyTimer = 0;
let crops = [];
let megalodon = null;
let harpoons = [];
let turretCooldown = 0;
let bossWarningTimer = 0;

const BOAT_LEVELS = [
  { name: "Плот", speed: 130, size: 18, costW: 0, costM: 0 },
  { name: "Лодка", speed: 160, size: 24, costW: 40, costM: 10 },
  { name: "Катер", speed: 200, size: 32, costW: 120, costM: 50 },
  { name: "Яхта", speed: 240, size: 45, costW: 300, costM: 150 },
  { name: "Мега-Яхта", speed: 280, size: 65, costW: 800, costM: 400 }
];

let resources = [];
let particles = [];
let sharks = [];
let buildings = [];
let mobs = [];
let ores = [];

const island = { x: 2000, y: 2000, r: 900 };
const caveEntrance = { x: 2000, y: 1400 };
const boatDock = { x: 2000, y: 2800 };
const elevatorPos = { x: 0, y: -400 };
const exitPos = { x: 0, y: 400 };

let spawnTimer = 0, sharkTimer = 0, shake = 0;
const joystick = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
const JOY_MAX = 55;
const keys = { w: false, a: false, s: false, d: false };

function showToast(text, color = '#a855f7') {
  toastEl.textContent = text; toastEl.style.background = color;
  toastEl.style.opacity = 1; game.toastTimer = 3;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  if (fishing.state === 'biting') {
    inventory.fish++; fishing.state = 'idle'; beep(1200, 0.15, 'sine'); updateUI();
    for(let i=0; i<10; i++) particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 0.5, maxLife: 0.5, size: 4, color: '#38bdf8' });
    return;
  }
  for (const t of e.changedTouches) {
    if (!joystick.active) { joystick.active = true; joystick.id = t.identifier; joystick.bx = t.clientX; joystick.by = t.clientY; joystick.dx = 0; joystick.dy = 0; }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      let dx = t.clientX - joystick.bx; let dy = t.clientY - joystick.by;
      const d = Math.hypot(dx, dy);
      if (d > JOY_MAX) { dx = dx/d * JOY_MAX; dy = dy/d * JOY_MAX; }
      joystick.dx = dx / JOY_MAX; joystick.dy = dy / JOY_MAX;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) { joystick.active = false; joystick.id = null; joystick.dx = 0; joystick.dy = 0; }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });
window.addEventListener('keydown', e => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

function startGame() {
  initAudio();
  game.wood = 0; game.metal = 0; game.plastic = 0; game.fabric = 0;
  game.copper = 0; game.iron = 0; game.coal = 0; game.gold = 0; game.diamond = 0; game.core = 0;
  game.boatLevel = 1; game.isNight = false; game.zone = 'ocean'; game.caveDepth = 1;
  game.blueprints = { gen: false, drill: false };
  game.toastTimer = 0;
  tools.rod = 1; tools.farm = 1; tools.purifier = 1; tools.turret = 0;
  player.x = 0; player.y = 0; player.vx = 0; player.vy = 0; player.isOnFoot = false; player.invuln = 0;
  player.hp = 100; player.hunger = 100; player.thirst = 100;
  inventory.fish = 0; inventory.water = 0; inventory.seeds = 0; inventory.crops = 0; inventory.meat = 0;
  crops = []; megalodon = null; harpoons = []; buildings = []; mobs = []; ores = [];
  turretCooldown = 0;
  game.camera.x = 0; game.camera.y = 0; game.camera.zoom = 1; game.camera.targetZoom = 1;
  resources = []; particles = []; sharks = [];
  fishing.state = 'idle'; purifyTimer = 0; bossWarningTimer = 0; shake = 0;
  bossBarContainer.style.display = 'none';
  coreRow.style.display = 'none'; goldRow.style.display = 'none'; diamondRow.style.display = 'none';
  game.state = 'playing';
  overlay.classList.add('hidden');
  updateUI(); spawnResources(20); // Даём стартовые ресурсы
  lastTime = performance.now();
}

function updateUI() {
  uiWood.textContent = game.wood; uiMetal.textContent = game.metal;
  uiPlastic.textContent = game.plastic; uiFabric.textContent = game.fabric;
  uiCopper.textContent = game.copper; uiIron.textContent = game.iron;
  uiCoal.textContent = game.coal; uiGold.textContent = game.gold; uiDiamond.textContent = game.diamond;
  uiCore.textContent = game.core;
  invFish.textContent = inventory.fish; invWater.textContent = inventory.water; invMeat.textContent = inventory.meat;

  if (game.core > 0) coreRow.style.display = 'block';
  if (game.gold > 0) goldRow.style.display = 'block';
  if (game.diamond > 0) diamondRow.style.display = 'block';

  hpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
  hungerBar.style.width = Math.max(0, (player.hunger / player.maxHunger) * 100) + '%';
  thirstBar.style.width = Math.max(0, (player.thirst / player.maxThirst) * 100) + '%';

  if (game.boatLevel < BOAT_LEVELS.length && !player.isOnFoot) {
    const next = BOAT_LEVELS[game.boatLevel];
    uiCost.textContent = `🪵 ${next.costW} | ⚙️ ${next.costM}`;
    upgradeBtn.disabled = !(game.wood >= next.costW && game.metal >= next.costM);
    upgradeBtn.style.display = 'flex';
  } else { upgradeBtn.style.display = 'none'; }

  fishBtn.disabled = fishing.state !== 'idle' || player.isOnFoot;
  purifyBtn.disabled = purifyTimer > 0 || player.isOnFoot;
  plantBtn.disabled = !(inventory.seeds > 0 && game.boatLevel >= 2 && !player.isOnFoot);

  if (megalodon) {
    bossBarContainer.style.display = 'flex';
    bossHpBar.style.width = Math.max(0, (megalodon.hp / megalodon.maxHp) * 100) + '%';
  } else { bossBarContainer.style.display = 'none'; }

  if (player.interactMode !== 'none') {
    interactBtn.style.display = 'block';
    if (player.interactMode === 'island') interactBtn.textContent = '🏝️ ВЫСАДИТЬСЯ';
    else if (player.interactMode === 'boat') interactBtn.textContent = '⚓ СЕСТЬ В ЛОДКУ';
    else if (player.interactMode === 'cave') interactBtn.textContent = '🕳️ ВОЙТИ В ПЕЩЕРУ';
    else if (player.interactMode === 'exitCave') interactBtn.textContent = '☀️ ВЫЙТИ ИЗ ПЕЩЕРЫ';
    else if (player.interactMode === 'elevator') interactBtn.textContent = `🛗 СПУСТИТЬСЯ НА УР. ${game.caveDepth + 1}`;
  } else { interactBtn.style.display = 'none'; }
}

function upgradeBoat() {
  if (game.boatLevel >= BOAT_LEVELS.length || player.isOnFoot) return;
  const next = BOAT_LEVELS[game.boatLevel];
  if (game.wood >= next.costW && game.metal >= next.costM) {
    game.wood -= next.costW; game.metal -= next.costM;
    game.boatLevel++;
    game.camera.targetZoom = Math.max(0.5, 1 - (game.boatLevel * 0.1));
    beep(400, 0.1, 'square', 0.08);
    for(let i=0; i<30; i++) particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 1, maxLife: 1, size: Math.random()*4+2, color: '#fbbf24' });

    if (game.boatLevel === 5 && !game.isNight) {
      game.isNight = true; bossWarningTimer = 5;
      beep(200, 1.0, 'sawtooth', 0.1);
      setTimeout(() => beep(150, 1.5, 'sawtooth', 0.1), 500);
    }
    updateUI();
  }
}

function spawnMegalodon() {
  const angle = Math.random() * Math.PI * 2;
  megalodon = {
    x: player.x + Math.cos(angle) * 600, y: player.y + Math.sin(angle) * 600,
    hp: 3000, maxHp: 3000, speed: 80, angle: angle + Math.PI,
    state: 'circling', stateTimer: 3, r: 60, hitFlash: 0
  };
  updateUI();
}

function spawnResources(n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 200 + Math.random() * 400; // Ближе к игроку
    const r = Math.random();
    let type = 'wood';
    if (r > 0.4 && r <= 0.6) type = 'plastic';
    else if (r > 0.6 && r <= 0.75) type = 'metal';
    else if (r > 0.75 && r <= 0.85) type = 'fabric';
    else if (r > 0.85) type = 'seed';
    resources.push({
      x: player.x + Math.cos(angle) * dist, y: player.y + Math.sin(angle) * dist,
      type: type, r: type === 'metal' ? 14 : 16, rotation: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 2,
      seed: Math.random() * 1000
    });
  }
}

function spawnShark() {
  if (game.boatLevel < 2 || game.isNight || player.isOnFoot) return;
  const angle = Math.random() * Math.PI * 2;
  const dist = 1000 + Math.random() * 400; // Спавн очень далеко
  sharks.push({
    x: player.x + Math.cos(angle) * dist, y: player.y + Math.sin(angle) * dist,
    speed: 40 + (game.boatLevel * 5), angle: angle + Math.PI, biteCooldown: 0 // Медленные акулы
  });
}

function generateIslandOres() {
  ores = [];
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * (island.r * 0.7);
    ores.push({
      x: island.x + Math.cos(angle) * dist,
      y: island.y + Math.sin(angle) * dist,
      type: Math.random() > 0.5 ? 'copper' : 'iron',
      hp: 3, seed: Math.random() * 1000
    });
  }
}

function generateCaveOres(depth) {
  ores = [];
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 500;
    let type = 'coal';
    if (depth === 1) type = Math.random() > 0.4 ? 'coal' : 'copper';
    else if (depth === 2) type = Math.random() > 0.4 ? 'iron' : 'gold';
    else if (depth === 3) type = Math.random() > 0.5 ? 'diamond' : 'gold';
    ores.push({ x: Math.cos(angle) * dist, y: Math.sin(angle) * dist, type: type, hp: 3, seed: Math.random() * 1000 });
  }
}

function update(dt) {
  if (game.state !== 'playing') return;
  game.time += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  if (game.toastTimer > 0) { game.toastTimer -= dt; if (game.toastTimer <= 0) toastEl.style.opacity = 0; }
  if (player.invuln > 0) player.invuln -= dt;

  if (bossWarningTimer > 0) {
    bossWarningTimer -= dt;
    if (bossWarningTimer <= 0 && !megalodon) spawnMegalodon();
  }

  player.hunger -= 0.3 * dt; player.thirst -= 0.5 * dt;
  if (player.hunger <= 0 || player.thirst <= 0) player.hp -= 3 * dt;

  if (player.hunger < 50 && inventory.meat > 0) { inventory.meat--; player.hunger += 50; beep(600, 0.1, 'sine'); }
  else if (player.hunger < 50 && inventory.fish > 0) { inventory.fish--; player.hunger += 30; beep(600, 0.1, 'sine'); }
  else if (player.hunger < 50 && inventory.crops > 0) { inventory.crops--; player.hunger += 40; beep(600, 0.1, 'sine'); }
  if (player.thirst < 50 && inventory.water > 0) { inventory.water--; player.thirst += 40; beep(800, 0.1, 'sine'); }

  player.hunger = Math.max(0, Math.min(100, player.hunger));
  player.thirst = Math.max(0, Math.min(100, player.thirst));
  player.hp = Math.max(0, Math.min(100, player.hp));

  if (player.hp <= 0) {
    game.state = 'gameover';
    beep(150, 0.5, 'sawtooth', 0.1);
    overlayContent.innerHTML = `<h1 class="title red">ТЫ ПОГИБ</h1><p class="subtitle">Твоя история оборвалась...</p><button class="btn" onclick="startGame()">▶ ЗАНОВО</button>`;
    overlay.classList.remove('hidden');
    return;
  }

  if (fishing.state === 'casting') {
    fishing.timer -= dt;
    if (fishing.timer <= 0) { fishing.state = 'waiting'; fishing.timer = Math.max(1, 4 - tools.rod) + Math.random() * 2; }
  } else if (fishing.state === 'waiting') {
    fishing.timer -= dt;
    if (fishing.timer <= 0) { fishing.state = 'biting'; fishing.timer = 1.5 + (tools.rod * 0.3); beep(900, 0.2, 'square', 0.08); }
  } else if (fishing.state === 'biting') {
    fishing.timer -= dt;
    if (fishing.timer <= 0) { fishing.state = 'idle'; }
  }

  if (purifyTimer > 0) {
    purifyTimer -= dt;
    if (purifyTimer <= 0) { inventory.water++; beep(1000, 0.2, 'sine'); }
  }

  for (let i = crops.length - 1; i >= 0; i--) {
    crops[i].progress += dt * (0.08 + (tools.farm * 0.03));
    if (crops[i].progress >= 1) { inventory.crops++; crops.splice(i, 1); beep(700, 0.2, 'sine', 0.08); }
  }

  if (game.zone === 'ocean' && !player.isOnFoot) {
    const d = Math.hypot(player.x - island.x, player.y - island.y);
    player.interactMode = (d < island.r + 50) ? 'island' : 'none';
  } else if (game.zone === 'island' && player.isOnFoot) {
    const dCave = Math.hypot(player.x - caveEntrance.x, player.y - caveEntrance.y);
    const dBoat = Math.hypot(player.x - boatDock.x, player.y - boatDock.y);
    if (dCave < 100) player.interactMode = 'cave';
    else if (dBoat < 150) player.interactMode = 'boat';
    else player.interactMode = 'none';
  } else if (game.zone === 'cave') {
    const dElev = Math.hypot(player.x - elevatorPos.x, player.y - elevatorPos.y);
    const dExit = Math.hypot(player.x - exitPos.x, player.y - exitPos.y);
    if (dElev < 90 && game.caveDepth < 3) player.interactMode = 'elevator';
    else if (dExit < 80) player.interactMode = 'exitCave';
    else player.interactMode = 'none';
  }

  const level = BOAT_LEVELS[game.boatLevel - 1];
  if (!level) return;
  let speed = player.isOnFoot ? 150 : level.speed;

  let mx = 0, my = 0;
  if (joystick.active) { mx = joystick.dx; my = joystick.dy; }
  if (keys.w) my -= 1; if (keys.s) my += 1; if (keys.a) mx -= 1; if (keys.d) mx += 1;

  const mag = Math.hypot(mx, my);
  if (mag > 1) { mx /= mag; my /= mag; }
  if (mag > 0.1) { player.vx += mx * speed * 3 * dt; player.vy += my * speed * 3 * dt; player.angle = Math.atan2(my, mx); }

  player.vx *= 0.9; player.vy *= 0.9;
  const pSpeed = Math.hypot(player.vx, player.vy);
  if (pSpeed > speed) { player.vx = (player.vx / pSpeed) * speed; player.vy = (player.vy / pSpeed) * speed; }

  player.x += player.vx * dt; player.y += player.vy * dt;
  game.camera.x = player.x; game.camera.y = player.y;

  if (pSpeed > 20 && !player.isOnFoot) {
    player.wakeTimer -= dt;
    if (player.wakeTimer <= 0) {
      player.wakeTimer = 0.05;
      particles.push({
        x: player.x - Math.cos(player.angle)*level.size*0.5,
        y: player.y - Math.sin(player.angle)*level.size*0.5,
        vx: (Math.random()-0.5)*30 - player.vx*0.2,
        vy: (Math.random()-0.5)*30 - player.vy*0.2,
        life: 1.5, maxLife: 1.5, size: Math.random()*8+4, color: 'rgba(255,255,255,0.6)'
      });
    }
  }

  if (game.zone === 'ocean' && !player.isOnFoot) {
    // Постоянный, но не частый спавн
    spawnTimer -= dt;
    if (spawnTimer <= 0) { 
      spawnTimer = 0.8; 
      if (resources.length < 40) spawnResources(1); 
    }

    if (!game.isNight) {
      sharkTimer -= dt;
      if (sharkTimer <= 0) { sharkTimer = 15; if (sharks.length < 2) spawnShark(); }
    }

    for (let i = resources.length - 1; i >= 0; i--) {
      const res = resources[i];
      res.rotation += res.rotSpeed * dt;
      const dx = player.x - res.x; const dy = player.y - res.y;
      const dist = Math.hypot(dx, dy);
      if (dist < level.size + 150 && dist > 0.1) {
        res.x += (dx / dist) * 500 * dt;
        res.y += (dy / dist) * 500 * dt;
      }
      if (dist < level.size + res.r + 30) {
        if (res.type === 'wood') { game.wood += 5; beep(300, 0.08, 'triangle', 0.05); }
        else if (res.type === 'metal') { game.metal += 3; beep(500, 0.08, 'square', 0.04); }
        else if (res.type === 'plastic') { game.plastic += 4; beep(400, 0.08, 'sine', 0.04); }
        else if (res.type === 'fabric') { game.fabric += 2; beep(350, 0.08, 'triangle', 0.04); }
        else if (res.type === 'seed') { inventory.seeds++; beep(600, 0.1, 'sine', 0.05); }
        resources.splice(i, 1);
      }
    }

    for (let i = sharks.length - 1; i >= 0; i--) {
      const sh = sharks[i];
      const dx = player.x - sh.x; const dy = player.y - sh.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 800) {
        sh.angle = Math.atan2(dy, dx);
        sh.x += Math.cos(sh.angle) * sh.speed * dt;
        sh.y += Math.sin(sh.angle) * sh.speed * dt;
        
        // Акула атакует с проверкой неуязвимости
        if (dist < level.size + 15 && sh.biteCooldown <= 0 && player.invuln <= 0) {
          sh.biteCooldown = 4; player.invuln = 2; beep(100, 0.2, 'sawtooth', 0.1);
          player.hp -= 12;
          sh.x -= Math.cos(sh.angle) * 250; sh.y -= Math.sin(sh.angle) * 250;
          shake = Math.min(15, shake + 8);
          for(let j=0; j<10; j++) particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*100, vy: (Math.random()-0.5)*100, life: 0.5, maxLife: 0.5, size: 3, color: '#ef4444' });
        }
      }
      if (sh.biteCooldown > 0) sh.biteCooldown -= dt;
      if (dist > 2000) sharks.splice(i, 1);
    }

    if (tools.turret > 0 && megalodon && megalodon.hp > 0) {
      turretCooldown -= dt;
      if (turretCooldown <= 0) {
        turretCooldown = Math.max(0.3, 2.0 - (tools.turret * 0.4));
        const dx = megalodon.x - player.x; const dy = megalodon.y - player.y;
        const angle = Math.atan2(dy, dx);
        harpoons.push({
          x: player.x + Math.cos(angle) * level.size,
          y: player.y + Math.sin(angle) * level.size,
          vx: Math.cos(angle) * 800, vy: Math.sin(angle) * 800,
          life: 2, dmg: 30 + (tools.turret * 25), angle: angle
        });
        beep(400, 0.1, 'square', 0.06);
      }
    }

    for (let i = harpoons.length - 1; i >= 0; i--) {
      const h = harpoons[i];
      h.x += h.vx * dt; h.y += h.vy * dt; h.life -= dt;
      if (megalodon && megalodon.hp > 0) {
        const dx = megalodon.x - h.x; const dy = megalodon.y - h.y;
        if (Math.hypot(dx, dy) < megalodon.r + 10) {
          megalodon.hp -= h.dmg;
          megalodon.hitFlash = 0.2;
          harpoons.splice(i, 1);
          beep(200, 0.1, 'sawtooth', 0.05);
          for(let j=0; j<5; j++) particles.push({ x: h.x, y: h.y, vx: (Math.random()-0.5)*150, vy: (Math.random()-0.5)*150, life: 0.5, maxLife: 0.5, size: 3, color: '#ef4444' });
          continue;
        }
      }
      if (h.life <= 0) harpoons.splice(i, 1);
    }

    if (megalodon) {
      if (megalodon.hitFlash > 0) megalodon.hitFlash -= dt;
      const dx = player.x - megalodon.x; const dy = player.y - megalodon.y;
      const dist = Math.hypot(dx, dy);
      megalodon.stateTimer -= dt;

      if (megalodon.state === 'circling') {
        const targetAngle = Math.atan2(dy, dx) - Math.PI / 2;
        megalodon.angle = targetAngle;
        megalodon.x += Math.cos(targetAngle) * megalodon.speed * dt;
        megalodon.y += Math.sin(targetAngle) * megalodon.speed * dt;
        if (dist > 400) {
          megalodon.x += (dx / dist) * megalodon.speed * dt;
          megalodon.y += (dy / dist) * megalodon.speed * dt;
        }
        if (megalodon.stateTimer <= 0) {
          megalodon.state = 'charging'; megalodon.stateTimer = 1.5;
          beep(100, 0.5, 'sawtooth', 0.1);
        }
      } else if (megalodon.state === 'charging') {
        if (megalodon.stateTimer <= 0.5) {
          megalodon.angle = Math.atan2(dy, dx);
          megalodon.x += Math.cos(megalodon.angle) * megalodon.speed * 4 * dt;
          megalodon.y += Math.sin(megalodon.angle) * megalodon.speed * 4 * dt;
          if (dist < megalodon.r + level.size) {
            player.hp -= 35;
            megalodon.state = 'stunned'; megalodon.stateTimer = 2.5;
            beep(60, 0.4, 'sawtooth', 0.2);
            shake = 25;
            for(let j=0; j<20; j++) particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300, life: 1, maxLife: 1, size: 5, color: '#ef4444' });
          }
        }
      } else if (megalodon.state === 'stunned') {
        if (megalodon.stateTimer <= 0) { megalodon.state = 'circling'; megalodon.stateTimer = 4; }
      }

      if (megalodon.hp <= 0) {
        megalodon = null;
        bossBarContainer.style.display = 'none';
        game.isNight = false;
        game.core += 1;
        game.blueprints.gen = true;
        game.wood += 300; game.metal += 200; game.plastic += 150; game.fabric += 100;
        showToast('🔮 Энергоядро и 📜 Чертеж Генератора получены!', '#a855f7');
        beep(600, 0.5, 'sine', 0.1);
        setTimeout(() => beep(800, 0.5, 'sine', 0.1), 300);
        setTimeout(() => beep(1000, 0.5, 'sine', 0.1), 600);
      }
    }
  }

  else if (game.zone === 'island') {
    if (mobs.length < 5 && Math.random() < dt * 0.5) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 300 + Math.random() * 200;
      mobs.push({ x: player.x + Math.cos(angle)*dist, y: player.y + Math.sin(angle)*dist, type: 'boar', hp: 30, speed: 60, damage: 20 });
    }
    for (let i = ores.length - 1; i >= 0; i--) {
      const ore = ores[i];
      if (Math.hypot(player.x - ore.x, player.y - ore.y) < 45) {
        ore.hp -= dt * 2;
        if (Math.random() < dt * 8) beep(300, 0.05, 'square', 0.02);
        if (ore.hp <= 0) {
          if (ore.type === 'copper') game.copper += 5;
          else if (ore.type === 'iron') game.iron += 4;
          ores.splice(i, 1);
          beep(800, 0.1, 'sine');
        }
      }
    }
  }

  else if (game.zone === 'cave') {
    const spawnRate = 0.5 + (game.caveDepth * 0.5);
    if (mobs.length < 8 + game.caveDepth * 2 && Math.random() < dt * spawnRate) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 400 + Math.random() * 200;
      const hp = 15 + (game.caveDepth * 10);
      mobs.push({ x: player.x + Math.cos(angle)*dist, y: player.y + Math.sin(angle)*dist, type: 'bat', hp: hp, speed: 100 + game.caveDepth*20, damage: 8 + game.caveDepth*3 });
    }
    for (let i = ores.length - 1; i >= 0; i--) {
      const ore = ores[i];
      if (Math.hypot(player.x - ore.x, player.y - ore.y) < 45) {
        ore.hp -= dt * 2;
        if (Math.random() < dt * 8) beep(300, 0.05, 'square', 0.02);
        if (ore.hp <= 0) {
          if (ore.type === 'copper') game.copper += 5;
          else if (ore.type === 'coal') game.coal += 5;
          else if (ore.type === 'iron') game.iron += 4;
          else if (ore.type === 'gold') game.gold += 3;
          else if (ore.type === 'diamond') game.diamond += 1;

          if (game.caveDepth === 1 && !game.blueprints.drill && Math.random() < 0.2) {
            game.blueprints.drill = true;
            showToast('📜 НАЙДЕН ЧЕРТЕЖ: Электробур!', '#fbbf24');
          }

          ores.splice(i, 1);
          beep(800, 0.1, 'sine');
        }
      }
    }
  }

  for (let i = mobs.length - 1; i >= 0; i--) {
    const m = mobs[i];
    const dx = player.x - m.x; const dy = player.y - m.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 500) {
      m.x += (dx/dist) * m.speed * dt;
      m.y += (dy/dist) * m.speed * dt;
      if (dist < 30) {
        player.hp -= m.damage * dt;
        shake = Math.min(10, shake + dt * 20);
        if (Math.random() < dt * 2) beep(100, 0.1, 'sawtooth', 0.05);
      }
    }
    if (dist > 800) mobs.splice(i, 1);
  }

  for (const b of buildings) {
    if (b.type === 'drill') {
      let powered = false;
      for (const gen of buildings) {
        if (gen.type === 'gen' && Math.hypot(b.x - gen.x, b.y - gen.y) < 250) { powered = true; break; }
      }
      if (powered) {
        if (b.fuel > 0) {
          b.timer -= dt;
          if (b.timer <= 0) {
            b.timer = 4; b.fuel--;
            const r = Math.random();
            if (r < 0.3) game.copper += 2;
            else if (r < 0.6) game.iron += 2;
            else if (r < 0.8) game.gold += 1;
            else game.diamond += 1;
            beep(400, 0.05, 'sine', 0.02);
          }
        } else {
          if (game.coal > 0) {
            game.coal -= 1; b.fuel = 5; beep(300, 0.1, 'triangle', 0.03);
          } else {
            b.timer = 2;
          }
        }
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  updateUI();
}

const CRAFT_RECIPES = [
  { id: 'rod', name: '🎣 Удочка', maxLvl: 3, desc: 'Ускоряет клев.', costs: [ {w:30, f:10, p:5}, {w:80, f:30, m:20, p:15} ] },
  { id: 'farm', name: '🌱 Грядка', maxLvl: 3, desc: 'Ускоряет рост урожая.', costs: [ {w:40, p:20}, {w:100, p:50, m:20} ] },
  { id: 'purifier', name: '💧 Опреснитель', maxLvl: 3, desc: 'Ускоряет очистку воды.', costs: [ {m:20, p:15}, {m:60, p:50, f:20} ] },
  { id: 'turret', name: '🎯 Гарпунная Турель', maxLvl: 3, desc: 'Стреляет по боссу.', costs: [ {m:100, p:50, f:30}, {m:300, p:150, f:100} ] },
];

const BUILD_RECIPES = [
  { id: 'gen', name: '⚡ Генератор', desc: 'Дает энергию. Требует Чертеж.', costs: [{core: 1, iron: 20, copper: 30}], reqBp: 'gen' },
  { id: 'drill', name: '⛏️ Электробур', desc: 'Копает руду (жрет уголь). Требует Чертеж.', costs: [{iron: 15, copper: 15, m: 20}], reqBp: 'drill' },
];

function openCraftMenu() {
  if (!overlay.classList.contains('hidden')) return;
  game.state = 'paused';
  joystick.active = false; joystick.dx = 0; joystick.dy = 0;
  renderCraftMenu();
}

function renderCraftMenu() {
  try {
    overlayContent.innerHTML = '';
    
    const closeTop = document.createElement('button');
    closeTop.className = 'craft-close-top';
    closeTop.textContent = '✕ ЗАКРЫТЬ';
    closeTop.onclick = closeCraftMenu;
    overlayContent.appendChild(closeTop);

    const title = document.createElement('h1');
    title.className = 'title';
    title.style.color = '#8b5cf6';
    title.textContent = '🛠️ ВЕРСТАК';
    overlayContent.appendChild(title);

    const subtitle = document.createElement('p');
    subtitle.className = 'subtitle';
    subtitle.textContent = 'Крафт и механизмы';
    overlayContent.appendChild(subtitle);

    const list = document.createElement('div');
    list.className = 'craft-list';

    CRAFT_RECIPES.forEach(r => {
      const lvl = tools[r.id];
      const isMax = lvl >= r.maxLvl;
      const item = document.createElement('div');
      item.className = 'craft-item';
      
      const itemTitle = document.createElement('div');
      itemTitle.className = 'craft-title';
      itemTitle.innerHTML = `<span>${r.name} (Ур. ${lvl}/${r.maxLvl})</span>`;
      item.appendChild(itemTitle);

      const itemDesc = document.createElement('div');
      itemDesc.className = 'craft-desc';
      itemDesc.textContent = r.desc;
      item.appendChild(itemDesc);

      if (!isMax) {
        const cost = r.costs[lvl - 1];
        const canAfford = (game.wood >= (cost.w||0)) && (game.metal >= (cost.m||0)) && (game.plastic >= (cost.p||0)) && (game.fabric >= (cost.f||0));
        const costDiv = document.createElement('div');
        costDiv.className = 'craft-cost';
        costDiv.innerHTML = `Стоимость: ${cost.w ? `🪵${cost.w} ` : ''}${cost.m ? `⚙️${cost.m} ` : ''}${cost.p ? `🧴${cost.p} ` : ''}${cost.f ? `🧵${cost.f}` : ''}`;
        item.appendChild(costDiv);

        const btn = document.createElement('button');
        btn.className = 'craft-btn';
        btn.textContent = 'УЛУЧШИТЬ';
        btn.disabled = !canAfford;
        btn.onclick = () => doCraft(r.id);
        item.appendChild(btn);
      } else {
        const maxDiv = document.createElement('div');
        maxDiv.className = 'craft-cost';
        maxDiv.style.color = '#22c55e';
        maxDiv.textContent = 'МАКС. УРОВЕНЬ';
        item.appendChild(maxDiv);
      }
      list.appendChild(item);
    });

    if (game.core > 0) {
      const industryTitle = document.createElement('h2');
      industryTitle.style.color = '#a855f7';
      industryTitle.style.marginTop = '15px';
      industryTitle.style.marginBottom = '10px';
      industryTitle.textContent = '⚡ ИНДУСТРИЯ';
      list.appendChild(industryTitle);

      const bp = game.blueprints || { gen: false, drill: false };
      BUILD_RECIPES.forEach(r => {
        const hasBp = bp[r.reqBp];
        const c = r.costs[0];
        const canAfford = (game.core >= (c.core||0)) && (game.iron >= (c.iron||0)) && (game.copper >= (c.copper||0)) && (game.metal >= (c.m||0));
        const item = document.createElement('div');
        item.className = 'craft-item';
        if (!hasBp) item.style.opacity = '0.6';

        const itemTitle = document.createElement('div');
        itemTitle.className = 'craft-title';
        itemTitle.innerHTML = `<span>${r.name}</span> ${!hasBp ? '<span style="font-size:12px; color:#ef4444;">📜 НЕТ ЧЕРТЕЖА</span>' : ''}`;
        item.appendChild(itemTitle);

        const itemDesc = document.createElement('div');
        itemDesc.className = 'craft-desc';
        itemDesc.textContent = r.desc;
        item.appendChild(itemDesc);

        const costDiv = document.createElement('div');
        costDiv.className = 'craft-cost';
        costDiv.innerHTML = `Стоимость: ${c.core ? `🔮${c.core} ` : ''}${c.iron ? `⛓️${c.iron} ` : ''}${c.copper ? `🟠${c.copper} ` : ''}${c.m ? `⚙️${c.m}` : ''}`;
        item.appendChild(costDiv);

        const btn = document.createElement('button');
        btn.className = 'craft-btn';
        btn.textContent = 'ПОСТРОИТЬ';
        btn.disabled = !(canAfford && hasBp);
        btn.onclick = () => buildItem(r.id);
        item.appendChild(btn);
        list.appendChild(item);
      });
    }
    overlayContent.appendChild(list);

    const closeBottom = document.createElement('button');
    closeBottom.className = 'btn btn-gray';
    closeBottom.textContent = 'ЗАКРЫТЬ';
    closeBottom.onclick = closeCraftMenu;
    overlayContent.appendChild(closeBottom);

    overlay.classList.remove('hidden');
  } catch (err) {
    console.error(err);
    overlayContent.innerHTML = `<h1 class="title red">ОШИБКА</h1><p style="color:#fff;padding:15px;font-size:14px;">${err.message}</p><button class="btn btn-gray" onclick="closeCraftMenu()">ЗАКРЫТЬ</button>`;
    overlay.classList.remove('hidden');
  }
}

function doCraft(id) {
  const recipe = CRAFT_RECIPES.find(r => r.id === id);
  if (!recipe) return;
  const lvl = tools[id];
  if (lvl >= recipe.maxLvl) return;
  const cost = recipe.costs[lvl - 1];
  if (!cost) return;
  if ((game.wood >= (cost.w||0)) && (game.metal >= (cost.m||0)) && (game.plastic >= (cost.p||0)) && (game.fabric >= (cost.f||0))) {
    game.wood -= (cost.w||0); game.metal -= (cost.m||0); game.plastic -= (cost.p||0); game.fabric -= (cost.f||0);
    tools[id]++;
    beep(600, 0.1, 'square', 0.08);
    updateUI(); renderCraftMenu();
  }
}

function buildItem(id) {
  const recipe = BUILD_RECIPES.find(r => r.id === id);
  if (!recipe) return;
  if (!game.blueprints[recipe.reqBp]) return;
  const c = recipe.costs[0];
  if ((game.core >= (c.core||0)) && (game.iron >= (c.iron||0)) && (game.copper >= (c.copper||0)) && (game.metal >= (c.m||0))) {
    if (game.core > 0) game.core -= (c.core||0);
    game.iron -= (c.iron||0); game.copper -= (c.copper||0); game.metal -= (c.m||0);
    const bx = player.x + Math.cos(player.angle) * 70;
    const by = player.y + Math.sin(player.angle) * 70;
    buildings.push({ x: bx, y: by, type: id, timer: 0, fuel: id === 'drill' ? 0 : undefined });
    beep(500, 0.2, 'sine', 0.1);
    updateUI(); renderCraftMenu();
  }
}
