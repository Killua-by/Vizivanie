<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Морской Волк</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0f172a;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #f8fafc;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }
  #uiLayer { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
  .top-panel { display: flex; justify-content: space-between; align-items: flex-start; }
  #bossBarContainer { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 400px; display: none; flex-direction: column; align-items: center; }
  .boss-name { font-size: 16px; font-weight: 900; color: #ef4444; letter-spacing: 2px; text-shadow: 0 2px 4px #000; margin-bottom: 4px; }
  .boss-bar-bg { width: 100%; height: 16px; background: rgba(0,0,0,0.8); border: 2px solid #7f1d1d; border-radius: 8px; overflow: hidden; }
  .boss-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #b91c1c, #ef4444, #f87171); transition: width 0.1s; }
  .stats-container { display: flex; flex-direction: column; gap: 5px; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 14px; width: 150px; }
  .bar-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.6); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; width: 100%; transition: width 0.2s; border-radius: 5px; }
  .hp-fill { background: linear-gradient(90deg, #dc2626, #f87171); }
  .hunger-fill { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .thirst-fill { background: linear-gradient(90deg, #0284c7, #38bdf8); }
  .resources { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 15px; font-weight: 800; font-size: 14px; }
  .res-wood { color: #fbbf24; } .res-metal { color: #cbd5e1; } .res-plastic { color: #38bdf8; } .res-fabric { color: #d8b4fe; }
  .res-copper { color: #f97316; } .res-iron { color: #94a3b8; } .res-coal { color: #cbd5e1; } .res-gold { color: #fbbf24; }
  .res-diamond { color: #67e8f9; } .res-core { color: #a855f7; font-size: 16px; grid-column: span 2; text-align: center; }
  #pauseBtn { width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; background: rgba(15, 23, 42, 0.9); color: #f8fafc; font-size: 20px; pointer-events: auto; position: absolute; bottom: 20px; left: 20px; z-index: 5; }
  .inventory { pointer-events: auto; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 8px 14px; margin-top: 10px; display: flex; gap: 15px; font-size: 14px; font-weight: 800; }
  .bottom-panel { display: flex; justify-content: flex-end; align-items: flex-end; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; pointer-events: auto; width: 100%; max-width: 300px; margin-left: auto; }
  .action-btn { width: 100%; aspect-ratio: 1; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); background: rgba(30, 41, 59, 0.9); color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; }
  .action-btn:active { transform: scale(0.9); background: rgba(56, 189, 248, 0.4); }
  .action-btn:disabled { opacity: 0.4; filter: grayscale(1); }
  .action-btn.craft-btn { background: linear-gradient(135deg, #8b5cf6, #6d28d9); grid-column: span 4; height: 50px; font-size: 15px; font-weight: 800; }
  #interactBtn { display: none; position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 30px; border: 2px solid #38bdf8; background: rgba(15, 23, 42, 0.95); color: #38bdf8; font-weight: 900; font-size: 16px; pointer-events: auto; white-space: nowrap; }
  #toast { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); background: rgba(168, 85, 247, 0.95); color: white; padding: 10px 20px; border-radius: 20px; font-weight: 800; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 20; text-align: center; max-width: 80%; }
  #miniMapCanvas { position: absolute; top: 10px; right: 10px; width: 110px; height: 110px; border: 2px solid rgba(56, 189, 248, 0.5); border-radius: 10px; background: rgba(2, 6, 23, 0.8); pointer-events: none; z-index: 6; }
  #craftScreen { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: none; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  #craftScreen.active { display: block; }
  .craft-inner { max-width: 420px; margin: 0 auto; padding: 20px; padding-bottom: 60px; text-align: center; }
  .craft-close-btn { position: sticky; top: 10px; width: 100%; padding: 14px; background: #ef4444; color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; margin-bottom: 20px; z-index: 10; }
  #overlay { position: absolute; inset: 0; background: #0f172a; z-index: 10; display: none; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; text-align: center; }
  #overlay.active { display: block; }
  .modal { max-width: 420px; width: 100%; padding: 70px 20px 80px; margin: 0 auto; }
  .title { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-bottom: 15px; color: #38bdf8; }
  .title.red { color: #ef4444; } .title.purple { color: #a855f7; }
  .subtitle { font-size: 15px; color: #94a3b8; margin-bottom: 25px; line-height: 1.6; }
  .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #0f172a; font-size: 17px; font-weight: 800; margin-bottom: 12px; }
  .btn-gray { background: linear-gradient(135deg, #475569, #334155); color: white; }
  .craft-item { background: #1e293b; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 15px; text-align: left; margin-bottom: 12px; }
  .craft-item.boat-card { border: 2px solid #10b981; background: linear-gradient(135deg, #064e3b, #0f172a); }
  .craft-item .craft-title { font-weight: 900; font-size: 16px; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .craft-item .craft-desc { font-size: 13px; color: #cbd5e1; margin-bottom: 10px; line-height: 1.4; }
  .craft-item .craft-cost { font-size: 13px; font-weight: 800; margin-bottom: 10px; color: #fbbf24; }
  .craft-item .craft-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; font-weight: 800; font-size: 15px; }
  .craft-item .craft-btn:disabled { background: #475569; opacity: 0.6; }
  .craft-item.boat-card .craft-btn { background: linear-gradient(135deg, #10b981, #047857); }
  .hint { font-size: 13px; color: #64748b; margin-top: 15px; line-height: 2; text-align: left; padding-left: 10px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="miniMapCanvas" width="220" height="220"></canvas>

<div id="uiLayer">
  <div class="top-panel">
    <div>
      <div class="stats-container">
        <div class="bar-bg"><div class="bar-fill hp-fill" id="hpBar"></div></div>
        <div class="bar-bg"><div class="bar-fill hunger-fill" id="hungerBar"></div></div>
        <div class="bar-bg"><div class="bar-fill thirst-fill" id="thirstBar"></div></div>
      </div>
      <div class="inventory">
        <span>🐟 <span id="invFish">0</span></span>
        <span>💧 <span id="invWater">0</span></span>
        <span>🥩 <span id="invMeat">0</span></span>
      </div>
    </div>
    <div class="resources" style="margin-right: 120px;">
      <div><span class="res-wood">🪵</span> <span id="uiWood">0</span></div>
      <div><span class="res-metal">⚙️</span> <span id="uiMetal">0</span></div>
      <div><span class="res-plastic">🧴</span> <span id="uiPlastic">0</span></div>
      <div><span class="res-fabric">🧵</span> <span id="uiFabric">0</span></div>
      <div><span class="res-copper">🟠</span> <span id="uiCopper">0</span></div>
      <div><span class="res-iron">⛓️</span> <span id="uiIron">0</span></div>
      <div><span class="res-coal">⚫</span> <span id="uiCoal">0</span></div>
      <div id="goldRow" style="display:none;"><span class="res-gold">🟡</span> <span id="uiGold">0</span></div>
      <div id="diamondRow" style="display:none;"><span class="res-diamond">💎</span> <span id="uiDiamond">0</span></div>
      <div class="res-core" id="coreRow" style="display:none;">🔮 <span id="uiCore">0</span></div>
    </div>
  </div>
  
  <div id="bossBarContainer">
    <div class="boss-name">🦈 МЕГАЛОДОН 🦈</div>
    <div class="boss-bar-bg"><div class="boss-bar-fill" id="bossHpBar"></div></div>
  </div>

  <button id="pauseBtn">⏸</button>
  <button id="interactBtn">ДЕЙСТВИЕ</button>
  <div id="toast"></div>

  <div class="bottom-panel">
    <div class="actions">
      <button class="action-btn" id="fishBtn">🎣</button>
      <button class="action-btn" id="purifyBtn">💧</button>
      <button class="action-btn" id="plantBtn">🌱</button>
      <button class="action-btn craft-btn" id="craftBtn">🛠️ ВЕРСТАК / УЛУЧШЕНИЯ</button>
    </div>
  </div>
</div>

<div id="overlay"><div class="modal" id="overlayContent"></div></div>
<div id="craftScreen"><div class="craft-inner" id="craftInner"></div></div>

<script>
"use strict";

let lastTime = performance.now();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('miniMapCanvas');
const miniCtx = miniCanvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayContent = document.getElementById('overlayContent');
const craftScreen = document.getElementById('craftScreen');
const craftInner = document.getElementById('craftInner');
const toastEl = document.getElementById('toast');

const uiWood = document.getElementById('uiWood'); const uiMetal = document.getElementById('uiMetal');
const uiPlastic = document.getElementById('uiPlastic'); const uiFabric = document.getElementById('uiFabric');
const uiCopper = document.getElementById('uiCopper'); const uiIron = document.getElementById('uiIron');
const uiCoal = document.getElementById('uiCoal'); const uiGold = document.getElementById('uiGold');
const uiDiamond = document.getElementById('uiDiamond'); const uiCore = document.getElementById('uiCore');
const coreRow = document.getElementById('coreRow'); const goldRow = document.getElementById('goldRow'); const diamondRow = document.getElementById('diamondRow');
const fishBtn = document.getElementById('fishBtn'); const purifyBtn = document.getElementById('purifyBtn');
const plantBtn = document.getElementById('plantBtn'); const craftBtn = document.getElementById('craftBtn');
const pauseBtn = document.getElementById('pauseBtn'); const interactBtn = document.getElementById('interactBtn');
const bossBarContainer = document.getElementById('bossBarContainer'); const bossHpBar = document.getElementById('bossHpBar');
const invFish = document.getElementById('invFish'); const invWater = document.getElementById('invWater'); const invMeat = document.getElementById('invMeat');
const hpBar = document.getElementById('hpBar'); const hungerBar = document.getElementById('hungerBar'); const thirstBar = document.getElementById('thirstBar');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

let actx = null;
function initAudio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.05) {
  if (!actx || actx.state !== 'running') return;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}

function pseudo(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
function rnd(min, max) { return min + Math.random() * (max - min); }

// ГРАНИЦЫ МИРА (горы по периметру)
const WORLD = { minX: -1500, maxX: 1500, minY: -1500, maxY: 1500 };
// ОСТРОВ внутри мира
const island = { x: 900, y: 900, r: 400 };
const caveEntrance = { x: 900, y: 550 };
const boatDock = { x: 900, y: 1350 };

const game = {
  state: 'menu', wood: 0, metal: 0, plastic: 0, fabric: 0, copper: 0, iron: 0, coal: 0, gold: 0, diamond: 0, core: 0,
  boatLevel: 1, isNight: false, zone: 'ocean', caveDepth: 1,
  blueprints: { gen: false, drill: false },
  camera: { x: 0, y: 0, zoom: 1, targetZoom: 1 }, time: 0, toastTimer: 0
};

const player = {
  x: 0, y: 0, vx: 0, vy: 0, angle: -Math.PI/2, wakeTimer: 0,
  hp: 100, maxHp: 100, hunger: 100, maxHunger: 100, thirst: 100, maxThirst: 100,
  isOnFoot: false, interactMode: 'none', invuln: 0
};

const inventory = { fish: 0, water: 0, seeds: 0, crops: 0, meat: 0 };
const tools = { rod: 1, farm: 1, purifier: 1, turret: 0 };

let fishing = { state: 'idle', timer: 0 };
let purifyTimer = 0;
let crops = [];
let megalodon = null;
let harpoons = [];
let turretCooldown = 0;
let bossWarningTimer = 0;
let harpoonCooldown = 0;

const BOAT_LEVELS = [
  { name: "Плот", speed: 130, size: 18, costW: 0, costM: 0 },
  { name: "Лодка", speed: 160, size: 24, costW: 40, costM: 10 },
  { name: "Катер", speed: 200, size: 32, costW: 120, costM: 50 },
  { name: "Яхта", speed: 240, size: 45, costW: 300, costM: 150 },
  { name: "Мега-Яхта", speed: 280, size: 65, costW: 800, costM: 400 }
];

let resources = [];
let particles = [];
let sharks = [];
let buildings = [];
let mobs = [];
let ores = [];
let mountains = [];

// Генерация гор по периметру мира
function generateMountains() {
  mountains = [];
  const margin = 80;
  // Верх
  for (let x = WORLD.minX; x <= WORLD.maxX; x += 120) {
    mountains.push({ x: x + rnd(-30,30), y: WORLD.minY + rnd(-20,20), size: rnd(60,110), seed: Math.random()*1000 });
  }
  // Низ
  for (let x = WORLD.minX; x <= WORLD.maxX; x += 120) {
    mountains.push({ x: x + rnd(-30,30), y: WORLD.maxY + rnd(-20,20), size: rnd(60,110), seed: Math.random()*1000 });
  }
  // Лево
  for (let y = WORLD.minY + 120; y <= WORLD.maxY - 120; y += 120) {
    mountains.push({ x: WORLD.minX + rnd(-20,20), y: y + rnd(-30,30), size: rnd(60,110), seed: Math.random()*1000 });
  }
  // Право
  for (let y = WORLD.minY + 120; y <= WORLD.maxY - 120; y += 120) {
    mountains.push({ x: WORLD.maxX + rnd(-20,20), y: y + rnd(-30,30), size: rnd(60,110), seed: Math.random()*1000 });
  }
}
generateMountains();

// КРАФТ
const CRAFT_RECIPES = [
  { id: 'rod', name: '🎣 Удочка', maxLvl: 3, desc: 'Ускоряет клев.',
    costs: [ {w:30, f:10, p:5}, {w:80, f:30, m:20, p:15} ] },
  { id: 'farm', name: '🌱 Грядка', maxLvl: 3, desc: 'Ускоряет рост урожая.',
    costs: [ {w:40, p:20}, {w:100, p:50, m:20} ] },
  { id: 'purifier', name: '💧 Опреснитель', maxLvl: 3, desc: 'Ускоряет очистку.',
    costs: [ {m:20, p:15}, {m:60, p:50, f:20} ] },
  { id: 'turret', name: '🎯 Гарпун-турель', maxLvl: 3, desc: 'Автострельба по врагам. КД -0.2с за ур.',
    costs: [ {m:50, p:20, f:10}, {m:150, p:80, f:50}, {m:400, p:200, f:120} ] },
];

const BUILD_RECIPES = [
  { id: 'gen', name: '⚡ Генератор', desc: 'Дает энергию.', costs: [{core: 1, iron: 20, copper: 30}], reqBp: 'gen' },
  { id: 'drill', name: '⛏️ Электробур', desc: 'Копает руду (жрёт уголь).', costs: [{iron: 15, copper: 15, m: 20}], reqBp: 'drill' },
];

const joystick = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
const JOY_MAX = 55;
const keys = { w: false, a: false, s: false, d: false };

function showToast(text, color = '#a855f7') {
  toastEl.textContent = text; toastEl.style.background = color;
  toastEl.style.opacity = 1; game.toastTimer = 3;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  if (fishing.state === 'biting') {
    inventory.fish++; fishing.state = 'idle'; beep(1200, 0.15, 'sine'); updateUI();
    for(let i=0; i<10; i++) particles.push({ x: player.x, y: player.y, vx: rnd(-100,100), vy: rnd(-100,100), life: 0.5, maxLife: 0.5, size: 4, color: '#38bdf8' });
    return;
  }
  for (const t of e.changedTouches) {
    if (!joystick.active) { joystick.active = true; joystick.id = t.identifier; joystick.bx = t.clientX; joystick.by = t.clientY; joystick.dx = 0; joystick.dy = 0; }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      let dx = t.clientX - joystick.bx; let dy = t.clientY - joystick.by;
      const d = Math.hypot(dx, dy);
      if (d > JOY_MAX) { dx = dx/d * JOY_MAX; dy = dy/d * JOY_MAX; }
      joystick.dx = dx / JOY_MAX; joystick.dy = dy / JOY_MAX;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) { joystick.active = false; joystick.id = null; joystick.dx = 0; joystick.dy = 0; }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });
window.addEventListener('keydown', e => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

function startGame() {
  initAudio();
  game.wood = 0; game.metal = 0; game.plastic = 0; game.fabric = 0;
  game.copper = 0; game.iron = 0; game.coal = 0; game.gold = 0; game.diamond = 0; game.core = 0;
  game.boatLevel = 1; game.isNight = false; game.zone = 'ocean'; game.caveDepth = 1;
  game.blueprints = { gen: false, drill: false };
  game.toastTimer = 0;
  tools.rod = 1; tools.farm = 1; tools.purifier = 1; tools.turret = 0;
  player.x = 0; player.y = 0; player.vx = 0; player.vy = 0; player.isOnFoot = false; player.invuln = 0;
  player.hp = 100; player.hunger = 100; player.thirst = 100;
  inventory.fish = 0; inventory.water = 0; inventory.seeds = 0; inventory.crops = 0; inventory.meat = 0;
  crops = []; megalodon = null; harpoons = []; buildings = []; mobs = []; ores = [];
  turretCooldown = 0; harpoonCooldown = 0;
  game.camera.x = 0; game.camera.y = 0; game.camera.zoom = 1; game.camera.targetZoom = 1;
  resources = []; particles = []; sharks = [];
  fishing.state = 'idle'; purifyTimer = 0; bossWarningTimer = 0;
  bossBarContainer.style.display = 'none';
  coreRow.style.display = 'none'; goldRow.style.display = 'none'; diamondRow.style.display = 'none';
  overlay.classList.remove('active');
  craftScreen.classList.remove('active');
  game.state = 'playing';
  // Стартовые ресурсы
  spawnResources(25);
  // Разбросанные по карте ресурсы
  for (let i = 0; i < 60; i++) spawnScatteredResource();
  updateUI();
  lastTime = performance.now();
}

function spawnScatteredResource() {
  // Спавн по всей карте, кроме зоны вокруг острова
  for (let attempt = 0; attempt < 10; attempt++) {
    const x = rnd(WORLD.minX + 200, WORLD.maxX - 200);
    const y = rnd(WORLD.minY + 200, WORLD.maxY - 200);
    // Не спавнить внутри острова
    if (Math.hypot(x - island.x, y - island.y) < island.r + 100) continue;
    
    const r = Math.random();
    let type = 'wood';
    if (r > 0.4 && r <= 0.6) type = 'plastic';
    else if (r > 0.6 && r <= 0.75) type = 'metal';
    else if (r > 0.75 && r <= 0.85) type = 'fabric';
    else if (r > 0.85) type = 'seed';
    
    resources.push({
      x, y, type, r: type === 'metal' ? 14 : 16,
      rotation: Math.random() * Math.PI, rotSpeed: rnd(-1, 1), seed: Math.random() * 1000
    });
    return;
  }
}

function spawnResources(n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 200 + Math.random() * 400;
    const r = Math.random();
    let type = 'wood';
    if (r > 0.4 && r <= 0.6) type = 'plastic';
    else if (r > 0.6 && r <= 0.75) type = 'metal';
    else if (r > 0.75 && r <= 0.85) type = 'fabric';
    else if (r > 0.85) type = 'seed';
    resources.push({
      x: player.x + Math.cos(angle) * dist, y: player.y + Math.sin(angle) * dist,
      type, r: type === 'metal' ? 14 : 16, rotation: Math.random() * Math.PI, rotSpeed: rnd(-1,1), seed: Math.random() * 1000
    });
  }
}

function updateUI() {
  uiWood.textContent = game.wood; uiMetal.textContent = game.metal;
  uiPlastic.textContent = game.plastic; uiFabric.textContent = game.fabric;
  uiCopper.textContent = game.copper; uiIron.textContent = game.iron;
  uiCoal.textContent = game.coal; uiGold.textContent = game.gold; uiDiamond.textContent = game.diamond;
  uiCore.textContent = game.core;
  invFish.textContent = inventory.fish; invWater.textContent = inventory.water; invMeat.textContent = inventory.meat;
  if (game.core > 0) coreRow.style.display = 'block';
  if (game.gold > 0) goldRow.style.display = 'block';
  if (game.diamond > 0) diamondRow.style.display = 'block';
  hpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
  hungerBar.style.width = Math.max(0, (player.hunger / player.maxHunger) * 100) + '%';
  thirstBar.style.width = Math.max(0, (player.thirst / player.maxThirst) * 100) + '%';
  fishBtn.disabled = fishing.state !== 'idle' || player.isOnFoot;
  purifyBtn.disabled = purifyTimer > 0 || player.isOnFoot;
  plantBtn.disabled = !(inventory.seeds > 0 && game.boatLevel >= 2 && !player.isOnFoot);
  if (megalodon) {
    bossBarContainer.style.display = 'flex';
    bossHpBar.style.width = Math.max(0, (megalodon.hp / megalodon.maxHp) * 100) + '%';
  } else { bossBarContainer.style.display = 'none'; }
  if (player.interactMode !== 'none') {
    interactBtn.style.display = 'block';
    if (player.interactMode === 'island') interactBtn.textContent = '🏝️ ВЫСАДИТЬСЯ';
    else if (player.interactMode === 'boat') interactBtn.textContent = '⚓ СЕСТЬ В ЛОДКУ';
    else if (player.interactMode === 'cave') interactBtn.textContent = '🕳️ ВОЙТИ В ПЕЩЕРУ';
    else if (player.interactMode === 'exitCave') interactBtn.textContent = '☀️ ВЫЙТИ ИЗ ПЕЩЕРЫ';
    else if (player.interactMode === 'elevator') interactBtn.textContent = `🛗 СПУСТИТЬСЯ НА УР. ${game.caveDepth + 1}`;
  } else { interactBtn.style.display = 'none'; }
}

function upgradeBoat() {
  if (game.boatLevel >= BOAT_LEVELS.length || player.isOnFoot) return;
  const next = BOAT_LEVELS[game.boatLevel];
  if (game.wood >= next.costW && game.metal >= next.costM) {
    game.wood -= next.costW; game.metal -= next.costM;
    game.boatLevel++;
    game.camera.targetZoom = Math.max(0.5, 1 - (game.boatLevel * 0.08));
    beep(400, 0.1, 'square', 0.08);
    for(let i=0; i<30; i++) particles.push({ x: player.x, y: player.y, vx: rnd(-200,200), vy: rnd(-200,200), life: 1, maxLife: 1, size: rnd(2,6), color: '#fbbf24' });
    if (game.boatLevel === 5 && !game.isNight) {
      game.isNight = true; bossWarningTimer = 5;
      beep(200, 1.0, 'sawtooth', 0.1);
      setTimeout(() => beep(150, 1.5, 'sawtooth', 0.1), 500);
    }
    updateUI();
  }
}

function spawnMegalodon() {
  const angle = Math.random() * Math.PI * 2;
  megalodon = {
    x: player.x + Math.cos(angle) * 600, y: player.y + Math.sin(angle) * 600,
    hp: 3000, maxHp: 3000, speed: 80, angle: angle + Math.PI,
    state: 'circling', stateTimer: 3, r: 60, hitFlash: 0
  };
  updateUI();
}

function spawnShark() {
  if (game.boatLevel < 2 || game.isNight || player.isOnFoot) return;
  const angle = Math.random() * Math.PI * 2;
  const dist = 900 + Math.random() * 600;
  const shSpeed = 50 + game.boatLevel * 30; // 75-80% от скорости лодки
  sharks.push({
    x: player.x + Math.cos(angle) * dist, y: player.y + Math.sin(angle) * dist,
    speed: shSpeed, angle: angle + Math.PI, biteCooldown: 0,
    state: 'patrol',
    patrolTargetX: rnd(WORLD.minX + 300, WORLD.maxX - 300),
    patrolTargetY: rnd(WORLD.minY + 300, WORLD.maxY - 300),
    patrolTimer: rnd(4, 8)
  });
}

function generateIslandOres() {
  ores = [];
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * (island.r * 0.7);
    ores.push({
      x: island.x + Math.cos(angle) * dist, y: island.y + Math.sin(angle) * dist,
      type: Math.random() > 0.5 ? 'copper' : 'iron', hp: 3, seed: Math.random() * 1000
    });
  }
}

function generateCaveOres(depth) {
  ores = [];
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 500;
    let type = 'coal';
    if (depth === 1) type = Math.random() > 0.4 ? 'coal' : 'copper';
    else if (depth === 2) type = Math.random() > 0.4 ? 'iron' : 'gold';
    else if (depth === 3) type = Math.random() > 0.5 ? 'diamond' : 'gold';
    ores.push({ x: Math.cos(angle) * dist, y: Math.sin(angle) * dist, type, hp: 3, seed: Math.random() * 1000 });
  }
}

function update(dt) {
  if (game.state !== 'playing') return;
  game.time += dt;
  if (game.toastTimer > 0) { game.toastTimer -= dt; if (game.toastTimer <= 0) toastEl.style.opacity = 0; }
  if (player.invuln > 0) player.invuln -= dt;

  if (bossWarningTimer > 0) {
    bossWarningTimer -= dt;
    if (bossWarningTimer <= 0 && !megalodon) spawnMegalodon();
  }

  // Голод/жажда
  player.hunger -= 0.3 * dt; player.thirst -= 0.5 * dt;
  if (player.hunger <= 0 || player.thirst <= 0) player.hp -= 3 * dt;
  if (player.hunger < 50 && inventory.meat > 0) { inventory.meat--; player.hunger += 50; beep(600, 0.1, 'sine'); }
  else if (player.hunger < 50 && inventory.fish > 0) { inventory.fish--; player.hunger += 30; beep(600, 0.1, 'sine'); }
  else if (player.hunger < 50 && inventory.crops > 0) { inventory.crops--; player.hunger += 40; beep(600, 0.1, 'sine'); }
  if (player.thirst < 50 && inventory.water > 0) { inventory.water--; player.thirst += 40; beep(800, 0.1, 'sine'); }
  player.hunger = Math.max(0, Math.min(100, player.hunger));
  player.thirst = Math.max(0, Math.min(100, player.thirst));
  player.hp = Math.max(0, Math.min(100, player.hp));

  if (player.hp <= 0) {
    game.state = 'gameover';
    beep(150, 0.5, 'sawtooth', 0.1);
    overlayContent.innerHTML = `<h1 class="title red">ТЫ ПОГИБ</h1><p class="subtitle">Твоя история оборвалась...</p><button class="btn" onclick="startGame()">▶ ЗАНОВО</button>`;
    overlay.classList.add('active');
    return;
  }

  // Рыбалка / опреснение / урожай
  if (fishing.state === 'casting') {
    fishing.timer -= dt;
    if (fishing.timer <= 0) { fishing.state = 'waiting'; fishing.timer = Math.max(1, 4 - tools.rod) + Math.random() * 2; }
  } else if (fishing.state === 'waiting') {
    fishing.timer -= dt;
    if (fishing.timer <= 0) { fishing.state = 'biting'; fishing.timer = 1.5 + (tools.rod * 0.3); beep(900, 0.2, 'square', 0.08); }
  } else if (fishing.state === 'biting') {
    fishing.timer -= dt;
    if (fishing.timer <= 0) { fishing.state = 'idle'; }
  }
  if (purifyTimer > 0) {
    purifyTimer -= dt;
    if (purifyTimer <= 0) { inventory.water++; beep(1000, 0.2, 'sine'); }
  }
  for (let i = crops.length - 1; i >= 0; i--) {
    crops[i].progress += dt * (0.08 + (tools.farm * 0.03));
    if (crops[i].progress >= 1) { inventory.crops++; crops.splice(i, 1); beep(700, 0.2, 'sine', 0.08); }
  }

  // Зоны взаимодействия
  if (game.zone === 'ocean' && !player.isOnFoot) {
    const d = Math.hypot(player.x - island.x, player.y - island.y);
    player.interactMode = (d < island.r + 100) ? 'island' : 'none';
  } else if (game.zone === 'island' && player.isOnFoot) {
    const dCave = Math.hypot(player.x - caveEntrance.x, player.y - caveEntrance.y);
    const dBoat = Math.hypot(player.x - boatDock.x, player.y - boatDock.y);
    if (dCave < 80) player.interactMode = 'cave';
    else if (dBoat < 120) player.interactMode = 'boat';
    else player.interactMode = 'none';
  } else if (game.zone === 'cave') {
    const dElev = Math.hypot(player.x - 0, player.y - (-400));
    const dExit = Math.hypot(player.x - 0, player.y - 400);
    if (dElev < 90 && game.caveDepth < 3) player.interactMode = 'elevator';
    else if (dExit < 80) player.interactMode = 'exitCave';
    else player.interactMode = 'none';
  }

  // Движение
  const level = BOAT_LEVELS[game.boatLevel - 1];
  if (!level) return;
  let speed = player.isOnFoot ? 150 : level.speed;
  let mx = 0, my = 0;
  if (joystick.active) { mx = joystick.dx; my = joystick.dy; }
  if (keys.w) my -= 1; if (keys.s) my += 1; if (keys.a) mx -= 1; if (keys.d) mx += 1;
  const mag = Math.hypot(mx, my);
  if (mag > 1) { mx /= mag; my /= mag; }
  if (mag > 0.1) { player.vx += mx * speed * 3 * dt; player.vy += my * speed * 3 * dt; player.angle = Math.atan2(my, mx); }
  player.vx *= 0.9; player.vy *= 0.9;
  const pSpeed = Math.hypot(player.vx, player.vy);
  if (pSpeed > speed) { player.vx = (player.vx / pSpeed) * speed; player.vy = (player.vy / pSpeed) * speed; }
  player.x += player.vx * dt; player.y += player.vy * dt;

  // ОГРАНИЧЕНИЕ КАРТЫ (горы)
  const pad = 60;
  if (player.x < WORLD.minX + pad) { player.x = WORLD.minX + pad; player.vx = 0; }
  if (player.x > WORLD.maxX - pad) { player.x = WORLD.maxX - pad; player.vx = 0; }
  if (player.y < WORLD.minY + pad) { player.y = WORLD.minY + pad; player.vy = 0; }
  if (player.y > WORLD.maxY - pad) { player.y = WORLD.maxY - pad; player.vy = 0; }

  game.camera.x = player.x; game.camera.y = player.y;

  // Пена
  if (pSpeed > 20 && !player.isOnFoot) {
    player.wakeTimer -= dt;
    if (player.wakeTimer <= 0) {
      player.wakeTimer = 0.05;
      particles.push({
        x: player.x - Math.cos(player.angle)*level.size*0.5,
        y: player.y - Math.sin(player.angle)*level.size*0.5,
        vx: rnd(-30,30) - player.vx*0.2, vy: rnd(-30,30) - player.vy*0.2,
        life: 1.5, maxLife: 1.5, size: rnd(4,12), color: 'rgba(255,255,255,0.6)'
      });
    }
  }

  // ОКЕАН: спавн ресурсов и акул
  if (game.zone === 'ocean' && !player.isOnFoot) {
    // Постоянная генерация в зоне + разбросанных
    if (resources.length < 60) {
      if (Math.random() < dt * 8) spawnScatteredResource();
    }
    if (resources.length < 25) {
      spawnResources(1);
    }

    // Акулы
    if (!game.isNight) {
      if (sharks.length < 3 && Math.random() < dt * 0.2) spawnShark();
    }

    // Сбор ресурсов
    for (let i = resources.length - 1; i >= 0; i--) {
      const res = resources[i];
      res.rotation += res.rotSpeed * dt;
      const dx = player.x - res.x; const dy = player.y - res.y;
      const dist = Math.hypot(dx, dy);
      if (dist < level.size + 150 && dist > 0.1) {
        res.x += (dx / dist) * 500 * dt;
        res.y += (dy / dist) * 500 * dt;
      }
      if (dist < level.size + res.r + 30) {
        // ЛУТ ЗАВИСИТ ОТ УРОВНЯ ЛОДКИ
        const bonus = game.boatLevel * 2;
        if (res.type === 'wood') { game.wood += 5 + bonus; beep(300, 0.08, 'triangle', 0.05); }
        else if (res.type === 'metal') { game.metal += 3 + bonus; beep(500, 0.08, 'square', 0.04); }
        else if (res.type === 'plastic') { game.plastic += 4 + bonus; beep(400, 0.08, 'sine', 0.04); }
        else if (res.type === 'fabric') { game.fabric += 2 + bonus; beep(350, 0.08, 'triangle', 0.04); }
        else if (res.type === 'seed') { inventory.seeds++; beep(600, 0.1, 'sine', 0.05); }
        resources.splice(i, 1);
      }
    }

    // АКУЛЫ: патруль → преследование → патруль
    for (let i = sharks.length - 1; i >= 0; i--) {
      const sh = sharks[i];
      const dx = player.x - sh.x; const dy = player.y - sh.y;
      const distToPlayer = Math.hypot(dx, dy);
      
      // Смена состояния
      if (sh.state === 'patrol' && distToPlayer < 500) {
        sh.state = 'chase';
      } else if (sh.state === 'chase' && distToPlayer > 800) {
        sh.state = 'patrol';
        sh.patrolTimer = 0.1; // Сразу выбрать новую цель
      }
      
      // Удаление, если очень далеко
      if (distToPlayer > 1400 && sh.state === 'patrol') {
        sharks.splice(i, 1);
        continue;
      }

      if (sh.state === 'chase') {
        // Преследование игрока
        sh.angle = Math.atan2(dy, dx);
        sh.x += Math.cos(sh.angle) * sh.speed * dt;
        sh.y += Math.sin(sh.angle) * sh.speed * dt;
        
        if (distToPlayer < level.size + 20 && sh.biteCooldown <= 0 && player.invuln <= 0) {
          sh.biteCooldown = 4; player.invuln = 2; beep(100, 0.2, 'sawtooth', 0.1);
          player.hp -= 12;
          sh.x -= Math.cos(sh.angle) * 250; sh.y -= Math.sin(sh.angle) * 250;
          for(let j=0; j<10; j++) particles.push({ x: player.x, y: player.y, vx: rnd(-100,100), vy: rnd(-100,100), life: 0.5, maxLife: 0.5, size: 3, color: '#ef4444' });
        }
      } else {
        // Патруль
        const pdx = sh.patrolTargetX - sh.x; const pdy = sh.patrolTargetY - sh.y;
        const pdist = Math.hypot(pdx, pdy);
        if (pdist < 60 || sh.patrolTimer <= 0) {
          sh.patrolTargetX = rnd(WORLD.minX + 200, WORLD.maxX - 200);
          sh.patrolTargetY = rnd(WORLD.minY + 200, WORLD.maxY - 200);
          sh.patrolTimer = rnd(5, 10);
        }
        sh.patrolTimer -= dt;
        if (pdist > 0.1) {
          sh.angle = Math.atan2(pdy, pdx);
          sh.x += Math.cos(sh.angle) * sh.speed * 0.5 * dt; // Медленнее в патруле
          sh.y += Math.sin(sh.angle) * sh.speed * 0.5 * dt;
        }
      }
      
      if (sh.biteCooldown > 0) sh.biteCooldown -= dt;
    }

    // ГАРПУН-ТУРЕЛЬ: автострельба
    if (tools.turret > 0) {
      harpoonCooldown -= dt;
      if (harpoonCooldown <= 0) {
        // Найти ближайшую цель
        let target = null; let bestD = 500;
        if (megalodon && megalodon.hp > 0) {
          const d = Math.hypot(megalodon.x - player.x, megalodon.y - player.y);
          if (d < bestD) { bestD = d; target = megalodon; }
        }
        for (const sh of sharks) {
          const d = Math.hypot(sh.x - player.x, sh.y - player.y);
          if (d < bestD) { bestD = d; target = sh; }
        }
        if (target) {
          const angle = Math.atan2(target.y - player.y, target.x - player.x);
          const dmg = 25 + tools.turret * 20;
          harpoons.push({
            x: player.x + Math.cos(angle) * level.size,
            y: player.y + Math.sin(angle) * level.size,
            vx: Math.cos(angle) * 900, vy: Math.sin(angle) * 900,
            life: 1.5, dmg, angle, isPlayerTurret: true
          });
          harpoonCooldown = 1.0 - (tools.turret - 1) * 0.2; // 1.0, 0.8, 0.6
          beep(500, 0.06, 'square', 0.05);
        }
      }
    }

    // Обновление гарпунов
    for (let i = harpoons.length - 1; i >= 0; i--) {
      const h = harpoons[i];
      h.x += h.vx * dt; h.y += h.vy * dt; h.life -= dt;
      
      // Попадание в Мегалодона
      if (megalodon && megalodon.hp > 0) {
        if (Math.hypot(megalodon.x - h.x, megalodon.y - h.y) < megalodon.r + 10) {
          megalodon.hp -= h.dmg; megalodon.hitFlash = 0.2;
          harpoons.splice(i, 1);
          beep(200, 0.1, 'sawtooth', 0.05);
          for(let j=0; j<5; j++) particles.push({ x: h.x, y: h.y, vx: rnd(-150,150), vy: rnd(-150,150), life: 0.5, maxLife: 0.5, size: 3, color: '#ef4444' });
          continue;
        }
      }
      
      // Попадание в акулу
      let hitShark = false;
      for (let j = sharks.length - 1; j >= 0; j--) {
        const sh = sharks[j];
        if (Math.hypot(sh.x - h.x, sh.y - h.y) < 25) {
          sharks.splice(j, 1);
          harpoons.splice(i, 1);
          beep(300, 0.15, 'square', 0.06);
          for(let k=0; k<8; k++) particles.push({ x: h.x, y: h.y, vx: rnd(-150,150), vy: rnd(-150,150), life: 0.6, maxLife: 0.6, size: 3, color: '#ef4444' });
          hitShark = true;
          break;
        }
      }
      if (hitShark) continue;
      
      if (h.life <= 0) harpoons.splice(i, 1);
    }

    // Мегалодон
    if (megalodon) {
      if (megalodon.hitFlash > 0) megalodon.hitFlash -= dt;
      const dx = player.x - megalodon.x; const dy = player.y - megalodon.y;
      const dist = Math.hypot(dx, dy);
      megalodon.stateTimer -= dt;

      if (megalodon.state === 'circling') {
        const targetAngle = Math.atan2(dy, dx) - Math.PI / 2;
        megalodon.angle = targetAngle;
        megalodon.x += Math.cos(targetAngle) * megalodon.speed * dt;
        megalodon.y += Math.sin(targetAngle) * megalodon.speed * dt;
        if (dist > 400) {
          megalodon.x += (dx / dist) * megalodon.speed * dt;
          megalodon.y += (dy / dist) * megalodon.speed * dt;
        }
        if (megalodon.stateTimer <= 0) {
          megalodon.state = 'charging'; megalodon.stateTimer = 1.5;
          beep(100, 0.5, 'sawtooth', 0.1);
        }
      } else if (megalodon.state === 'charging') {
        if (megalodon.stateTimer <= 0.5) {
          megalodon.angle = Math.atan2(dy, dx);
          megalodon.x += Math.cos(megalodon.angle) * megalodon.speed * 4 * dt;
          megalodon.y += Math.sin(megalodon.angle) * megalodon.speed * 4 * dt;
          if (dist < megalodon.r + level.size) {
            player.hp -= 35;
            megalodon.state = 'stunned'; megalodon.stateTimer = 2.5;
            beep(60, 0.4, 'sawtooth', 0.2);
            for(let j=0; j<20; j++) particles.push({ x: player.x, y: player.y, vx: rnd(-300,300), vy: rnd(-300,300), life: 1, maxLife: 1, size: 5, color: '#ef4444' });
          }
        }
      } else if (megalodon.state === 'stunned') {
        if (megalodon.stateTimer <= 0) { megalodon.state = 'circling'; megalodon.stateTimer = 4; }
      }

      if (megalodon.hp <= 0) {
        megalodon = null;
        bossBarContainer.style.display = 'none';
        game.isNight = false;
        game.core += 1;
        game.blueprints.gen = true;
        game.wood += 300; game.metal += 200; game.plastic += 150; game.fabric += 100;
        showToast('🔮 Энергоядро и 📜 Чертеж Генератора!', '#a855f7');
        beep(600, 0.5, 'sine', 0.1);
      }
    }
  }

  else if (game.zone === 'island') {
    if (mobs.length < 5 && Math.random() < dt * 0.5) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 200;
      const mx = player.x + Math.cos(angle)*dist;
      const my = player.y + Math.sin(angle)*dist;
      if (Math.hypot(mx - island.x, my - island.y) < island.r * 0.85) {
        mobs.push({ x: mx, y: my, type: 'boar', hp: 30, speed: 60, damage: 20 });
      }
    }
    for (let i = ores.length - 1; i >= 0; i--) {
      const ore = ores[i];
      if (Math.hypot(player.x - ore.x, player.y - ore.y) < 45) {
        ore.hp -= dt * 2;
        if (Math.random() < dt * 8) beep(300, 0.05, 'square', 0.02);
        if (ore.hp <= 0) {
          if (ore.type === 'copper') game.copper += 5 + game.boatLevel;
          else if (ore.type === 'iron') game.iron += 4 + game.boatLevel;
          ores.splice(i, 1);
          beep(800, 0.1, 'sine');
        }
      }
    }
  }

  else if (game.zone === 'cave') {
    const spawnRate = 0.5 + (game.caveDepth * 0.5);
    if (mobs.length < 8 + game.caveDepth * 2 && Math.random() < dt * spawnRate) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 400 + Math.random() * 200;
      const hp = 15 + (game.caveDepth * 10);
      mobs.push({ x: player.x + Math.cos(angle)*dist, y: player.y + Math.sin(angle)*dist, type: 'bat', hp, speed: 100 + game.caveDepth*20, damage: 8 + game.caveDepth*3 });
    }
    for (let i = ores.length - 1; i >= 0; i--) {
      const ore = ores[i];
      if (Math.hypot(player.x - ore.x, player.y - ore.y) < 45) {
        ore.hp -= dt * 2;
        if (Math.random() < dt * 8) beep(300, 0.05, 'square', 0.02);
        if (ore.hp <= 0) {
          if (ore.type === 'copper') game.copper += 5 + game.boatLevel;
          else if (ore.type === 'coal') game.coal += 5 + game.boatLevel;
          else if (ore.type === 'iron') game.iron += 4 + game.boatLevel;
          else if (ore.type === 'gold') game.gold += 3 + Math.floor(game.boatLevel/2);
          else if (ore.type === 'diamond') game.diamond += 1 + Math.floor(game.boatLevel/3);
          if (game.caveDepth === 1 && !game.blueprints.drill && Math.random() < 0.2) {
            game.blueprints.drill = true;
            showToast('📜 НАЙДЕН ЧЕРТЕЖ: Электробур!', '#fbbf24');
          }
          ores.splice(i, 1);
          beep(800, 0.1, 'sine');
        }
      }
    }
  }

  // Мобы
  for (let i = mobs.length - 1; i >= 0; i--) {
    const m = mobs[i];
    const dx = player.x - m.x; const dy = player.y - m.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 500) {
      m.x += (dx/dist) * m.speed * dt;
      m.y += (dy/dist) * m.speed * dt;
      if (dist < 30) {
        player.hp -= m.damage * dt;
        if (Math.random() < dt * 2) beep(100, 0.1, 'sawtooth', 0.05);
      }
    }
    if (dist > 800) mobs.splice(i, 1);
  }

  // Постройки
  for (const b of buildings) {
    if (b.type === 'drill') {
      let powered = false;
      for (const gen of buildings) {
        if (gen.type === 'gen' && Math.hypot(b.x - gen.x, b.y - gen.y) < 250) { powered = true; break; }
      }
      if (powered) {
        if (b.fuel > 0) {
          b.timer -= dt;
          if (b.timer <= 0) {
            b.timer = 4; b.fuel--;
            const r = Math.random();
            if (r < 0.3) game.copper += 2 + game.boatLevel;
            else if (r < 0.6) game.iron += 2 + game.boatLevel;
            else if (r < 0.8) game.gold += 1 + Math.floor(game.boatLevel/2);
            else game.diamond += 1 + Math.floor(game.boatLevel/3);
            beep(400, 0.05, 'sine', 0.02);
          }
        } else if (game.coal > 0) {
          game.coal -= 1; b.fuel = 5; beep(300, 0.1, 'triangle', 0.03);
        }
      }
    }
  }

  // Частицы
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  updateUI();
}

// КРАФТ МЕНЮ
function getRecipeCost(recipe, currentLevel) {
  if (recipe.id === 'turret') return recipe.costs[currentLevel] || null;
  return recipe.costs[currentLevel - 1] || null;
}

function openCraftMenu() {
  if (craftScreen.classList.contains('active')) return;
  game.state = 'paused';
  joystick.active = false; joystick.dx = 0; joystick.dy = 0;
  renderCraftMenu();
  craftScreen.classList.add('active');
}

function renderCraftMenu() {
  craftInner.innerHTML = '';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'craft-close-btn';
  closeBtn.textContent = '✕ ЗАКРЫТЬ';
  closeBtn.addEventListener('click', closeCraftMenu);
  craftInner.appendChild(closeBtn);

  const h = document.createElement('h1');
  h.className = 'title';
  h.style.color = '#8b5cf6';
  h.textContent = '🛠️ ВЕРСТАК';
  craftInner.appendChild(h);

  // === ЛОДКА (сверху, отдельной картой) ===
  if (game.boatLevel < BOAT_LEVELS.length) {
    const next = BOAT_LEVELS[game.boatLevel];
    const cur = BOAT_LEVELS[game.boatLevel - 1];
    const boatCard = document.createElement('div');
    boatCard.className = 'craft-item boat-card';
    const canAfford = game.wood >= next.costW && game.metal >= next.costM;
    boatCard.innerHTML = `
      <div class="craft-title"><span>🚤 ${cur.name} → ${next.name}</span></div>
      <div class="craft-desc">Скорость: ${cur.speed} → ${next.speed}. Лут: +${game.boatLevel * 2} к каждому ресурсу.</div>
      <div class="craft-cost">Стоимость: 🪵${next.costW} ⚙️${next.costM}</div>
      <button class="craft-btn" id="boatUpgradeBtn" ${canAfford ? '' : 'disabled'}>УЛУЧШИТЬ ЛОДКУ</button>`;
    craftInner.appendChild(boatCard);
    const bbtn = boatCard.querySelector('#boatUpgradeBtn');
    bbtn.addEventListener('click', () => { upgradeBoat(); renderCraftMenu(); });
  } else {
    const boatCard = document.createElement('div');
    boatCard.className = 'craft-item boat-card';
    boatCard.innerHTML = `<div class="craft-title"><span>🚤 Мега-Яхта (МАКС)</span></div><div class="craft-desc">Ты достиг максимума!</div>`;
    craftInner.appendChild(boatCard);
  }

  // === ОБЫЧНЫЙ КРАФТ ===
  CRAFT_RECIPES.forEach(r => {
    const lvl = tools[r.id];
    const isMax = lvl >= r.maxLvl;
    const item = document.createElement('div');
    item.className = 'craft-item';
    const title = document.createElement('div');
    title.className = 'craft-title';
    title.innerHTML = `<span>${r.name} (Ур. ${lvl}/${r.maxLvl})</span>`;
    item.appendChild(title);
    const desc = document.createElement('div');
    desc.className = 'craft-desc';
    desc.textContent = r.desc;
    item.appendChild(desc);

    if (!isMax) {
      const cost = getRecipeCost(r, lvl);
      if (cost) {
        const canAfford = (game.wood >= (cost.w||0)) && (game.metal >= (cost.m||0)) && (game.plastic >= (cost.p||0)) && (game.fabric >= (cost.f||0));
        const costDiv = document.createElement('div');
        costDiv.className = 'craft-cost';
        costDiv.innerHTML = `Стоимость: ${cost.w ? `🪵${cost.w} ` : ''}${cost.m ? `⚙️${cost.m} ` : ''}${cost.p ? `🧴${cost.p} ` : ''}${cost.f ? `🧵${cost.f}` : ''}`;
        item.appendChild(costDiv);
        const btn = document.createElement('button');
        btn.className = 'craft-btn';
        btn.textContent = 'УЛУЧШИТЬ';
        btn.disabled = !canAfford;
        btn.addEventListener('click', () => doCraft(r.id));
        item.appendChild(btn);
      }
    } else {
      const maxDiv = document.createElement('div');
      maxDiv.className = 'craft-cost';
      maxDiv.style.color = '#22c55e';
      maxDiv.textContent = 'МАКС. УРОВЕНЬ';
      item.appendChild(maxDiv);
    }
    craftInner.appendChild(item);
  });

  // === ИНДУСТРИЯ ===
  if (game.core > 0) {
    const h2 = document.createElement('h2');
    h2.style.color = '#a855f7';
    h2.style.marginTop = '20px'; h2.style.marginBottom = '12px';
    h2.textContent = '⚡ ИНДУСТРИЯ';
    craftInner.appendChild(h2);
    BUILD_RECIPES.forEach(r => {
      const hasBp = game.blueprints[r.reqBp];
      const c = r.costs[0];
      const canAfford = (game.core >= (c.core||0)) && (game.iron >= (c.iron||0)) && (game.copper >= (c.copper||0)) && (game.metal >= (c.m||0));
      const item = document.createElement('div');
      item.className = 'craft-item';
      if (!hasBp) item.style.opacity = '0.6';
      const title = document.createElement('div');
      title.className = 'craft-title';
      title.innerHTML = `<span>${r.name}</span>${!hasBp ? '<span style="font-size:12px; color:#ef4444;">📜 НЕТ ЧЕРТЕЖА</span>' : ''}`;
      item.appendChild(title);
      const desc = document.createElement('div');
      desc.className = 'craft-desc'; desc.textContent = r.desc;
      item.appendChild(desc);
      const costDiv = document.createElement('div');
      costDiv.className = 'craft-cost';
      costDiv.innerHTML = `Стоимость: ${c.core ? `🔮${c.core} ` : ''}${c.iron ? `⛓️${c.iron} ` : ''}${c.copper ? `🟠${c.copper} ` : ''}${c.m ? `⚙️${c.m}` : ''}`;
      item.appendChild(costDiv);
      const btn = document.createElement('button');
      btn.className = 'craft-btn';
      btn.textContent = 'ПОСТРОИТЬ';
      btn.disabled = !(canAfford && hasBp);
      btn.addEventListener('click', () => buildItem(r.id));
      item.appendChild(btn);
      craftInner.appendChild(item);
    });
  }

  const closeBtn2 = document.createElement('button');
  closeBtn2.className = 'btn btn-gray';
  closeBtn2.style.marginTop = '20px';
  closeBtn2.textContent = 'ЗАКРЫТЬ';
  closeBtn2.addEventListener('click', closeCraftMenu);
  craftInner.appendChild(closeBtn2);
}

function doCraft(id) {
  const recipe = CRAFT_RECIPES.find(r => r.id === id);
  if (!recipe) return;
  const lvl = tools[id];
  if (lvl >= recipe.maxLvl) return;
  const cost = getRecipeCost(recipe, lvl);
  if (!cost) return;
  if ((game.wood >= (cost.w||0)) && (game.metal >= (cost.m||0)) && (game.plastic >= (cost.p||0)) && (game.fabric >= (cost.f||0))) {
    game.wood -= (cost.w||0); game.metal -= (cost.m||0); game.plastic -= (cost.p||0); game.fabric -= (cost.f||0);
    tools[id]++;
    beep(600, 0.1, 'square', 0.08);
    updateUI(); renderCraftMenu();
  }
}

function buildItem(id) {
  const recipe = BUILD_RECIPES.find(r => r.id === id);
  if (!recipe || !game.blueprints[recipe.reqBp]) return;
  const c = recipe.costs[0];
  if ((game.core >= (c.core||0)) && (game.iron >= (c.iron||0)) && (game.copper >= (c.copper||0)) && (game.metal >= (c.m||0))) {
    if (game.core > 0) game.core -= (c.core||0);
    game.iron -= (c.iron||0); game.copper -= (c.copper||0); game.metal -= (c.m||0);
    const bx = player.x + Math.cos(player.angle) * 70;
    const by = player.y + Math.sin(player.angle) * 70;
    buildings.push({ x: bx, y: by, type: id, timer: 0, fuel: id === 'drill' ? 0 : undefined });
    beep(500, 0.2, 'sine', 0.1);
    updateUI(); renderCraftMenu();
  }
}

function closeCraftMenu() {
  craftScreen.classList.remove('active');

  lastTime = performance.now();
}
