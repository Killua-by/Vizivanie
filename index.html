<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dota Runner: Wards & Items</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c; /* Темный фон для контраста */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        canvas {
            background-color: #f4f4f4;
            border-bottom: 4px solid #333;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Игровые переменные
    let score = 0;
    let gameOver = false;
    let frameCount = 0;
    
    // Настройки персонажа (Lion)
    const player = {
        x: 100,
        y: 320, 
        width: 40,
        height: 60,
        dy: 0, 
        gravity: 0.6,
        jumpForce: -12,
        isGrounded: true,
        color: '#8e44ad' // Фиолетовый цвет для Лайона
    };

    // Массивы для препятствий и предметов
    let obstacles = [];
    let items = [];

    // Настройки спавна
    let spawnTimer = 0;
    let spawnInterval = 90; 

    // Список предметов
    const dotaItems = ['ward', 'force', 'glimmer'];

    // Обработка управления
    function jump() {
        if (player.isGrounded && !gameOver) {
            player.dy = player.jumpForce;
            player.isGrounded = false;
        } else if (gameOver) {
            resetGame();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            jump();
        }
    });
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        jump();
    });

    window.addEventListener('mousedown', (e) => {
        jump();
    });

    function resetGame() {
        score = 0;
        gameOver = false;
        obstacles = [];
        items = [];
        player.y = 320;
        player.dy = 0;
        spawnTimer = 0;
    }

    function update() {
        if (gameOver) return;

        if (frameCount % 6 === 0) score += 1;
        frameCount++;

        // Физика прыжка
        player.y += player.dy;
        player.dy += player.gravity;

        if (player.y > 320) {
            player.y = 320;
            player.dy = 0;
            player.isGrounded = true;
        }

        // Логика спавна
        spawnTimer++;
        if (spawnTimer > spawnInterval) {
            // 60% шанс препятствия, 40% шанс предмета
            const isObstacle = Math.random() > 0.4; 
            
            if (isObstacle) {
                obstacles.push({
                    x: canvas.width,
                    y: 340,
                    width: 50,
                    height: 40,
                    color: '#d35400' // Цвет крипа
                });
            } else {
                // Выбираем случайный предмет из списка
                const randomType = dotaItems[Math.floor(Math.random() * dotaItems.length)];
                items.push({
                    x: canvas.width,
                    y: 280, // Предметы висят в воздухе, чтобы их нужно было ловить
                    width: 40,
                    height: 40,
                    type: randomType,
                    bobbing: 0 // Для анимации парения
                });
            }
            
            spawnTimer = 0;
            spawnInterval = Math.floor(Math.random() * 50) + 70; 
        }

        // Движение и коллизии препятствий
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= 7; // Скорость игры

            if (
                player.x < obs.x + obs.width &&
                player.x + player.width > obs.x &&
                player.y < obs.y + obs.height &&
                player.y + player.height > obs.y
            ) {
                gameOver = true; 
            }

            if (obs.x + obs.width < 0) obstacles.splice(i, 1);
        }

        // Движение и сбор предметов
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.x -= 7;
            item.bobbing += 0.1; // Анимация покачивания

            // Коллизия с предметом
            if (
                player.x < item.x + item.width &&
                player.x + player.width > item.x &&
                player.y < item.y + item.height &&
                player.y + player.height > item.y
            ) {
                // Бонусы за разные предметы
                if (item.type === 'ward') score += 50;
                if (item.type === 'force') score += 150;
                if (item.type === 'glimmer') score += 100;
                
                items.splice(i, 1);
                continue;
            }

            if (item.x + item.width < 0) items.splice(i, 1);
        }
    }

    function draw() {
        // Очистка
        ctx.fillStyle = '#f4f4f4';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Земля (пунктирная линия)
        ctx.fillStyle = '#333';
        for(let i=0; i<canvas.width; i+=40) {
            ctx.fillRect(i, 380, 20, 4);
        }

        // Отрисовка персонажа
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        // Глаз Лайона
        ctx.fillStyle = 'white';
        ctx.fillRect(player.x + 25, player.y + 10, 10, 10);
        ctx.fillStyle = 'black';
        ctx.fillRect(player.x + 28, player.y + 13, 4, 4);

        // Отрисовка препятствий (Крипы)
        obstacles.forEach(obs => {
            ctx.fillStyle = obs.color;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            // Глаз крипа
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(obs.x + 35, obs.y + 15, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(obs.x + 38, obs.y + 15, 3, 0, Math.PI * 2);
            ctx.fill();
        });

        // Отрисовка предметов (Эмодзи)
        items.forEach(item => {
            // Вычисляем высоту с учетом парения
            let floatY = item.y + Math.sin(item.bobbing) * 10;
            
            ctx.font = '35px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (item.type === 'ward') {
                ctx.fillText('👁️', item.x + item.width/2, floatY + item.height/2);
            } else if (item.type === 'force') {
                ctx.fillText('🪄', item.x + item.width/2, floatY + item.height/2);
            } else if (item.type === 'glimmer') {
                ctx.fillText('🧥', item.x + item.width/2, floatY + item.height/2);
            }
        });

        // Интерфейс (Счет)
        ctx.fillStyle = '#333';
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('СЧЕТ: ' + String(score).padStart(5, '0'), 20, 40);

        // Экран Game Over
        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 40px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('ВЫ ПОЙМАНЫ КРИПОМ!', canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.fillStyle = 'white';
            ctx.font = '20px "Courier New", monospace';
            ctx.fillText('Нажмите Пробел или Тапните для рестарта', canvas.width / 2, canvas.height / 2 + 30);
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
