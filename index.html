function drawOceanBg() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  if (game.isNight) {
    bgGrad.addColorStop(0, '#0b1220'); bgGrad.addColorStop(0.5, '#020617'); bgGrad.addColorStop(1, '#000000');
  } else {
    bgGrad.addColorStop(0, '#1a5f8a'); bgGrad.addColorStop(0.5, '#0c4a6e'); bgGrad.addColorStop(1, '#082f49');
  }
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  const cx = game.camera.x, cy = game.camera.y, zoom = game.camera.zoom;
  
  ctx.lineWidth = 3;
  ctx.strokeStyle = game.isNight ? 'rgba(56, 189, 248, 0.08)' : 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath();
  const s1 = 180;
  const o1x = (cx * zoom) % s1;
  const o1y = (cy * zoom) % s1;
  for (let x = -s1; x < W + s1; x += s1) {
    for (let y = -s1; y < H + s1; y += s1) {
      const px = x - o1x + Math.sin((y + game.time*50)*0.01)*20;
      const py = y - o1y + Math.cos((x + game.time*50)*0.01)*20;
      ctx.moveTo(px - 40, py);
      ctx.quadraticCurveTo(px, py - 12, px + 40, py);
    }
  }
  ctx.stroke();

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = game.isNight ? 'rgba(56, 189, 248, 0.06)' : 'rgba(255, 255, 255, 0.09)';
  ctx.beginPath();
  const s2 = 90;
  const o2x = (cx * zoom * 1.3) % s2;
  const o2y = (cy * zoom * 1.3) % s2;
  for (let x = -s2; x < W + s2; x += s2) {
    for (let y = -s2; y < H + s2; y += s2) {
      const px = x - o2x + Math.sin(y*0.03 + game.time*2)*8;
      const py = y - o2y + Math.cos(x*0.03 + game.time*2)*8;
      ctx.moveTo(px - 20, py);
      ctx.lineTo(px + 20, py);
    }
  }
  ctx.stroke();

  if (!game.isNight) {
    for (let i = 0; i < 30; i++) {
      const bx = (pseudo(i*7) * W + game.time * 15 * (0.5 + pseudo(i))) % W;
      const by = (pseudo(i*13) * H + game.time * 8 * (0.5 + pseudo(i*3))) % H;
      const alpha = 0.3 + 0.5 * Math.sin(game.time * 3 + i);
      ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, alpha) * 0.4})`;
      ctx.beginPath(); ctx.ellipse(bx, by, 12, 3, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  if (game.isNight) {
    ctx.fillStyle = 'rgba(255, 250, 205, 0.85)';
    ctx.beginPath(); ctx.arc(W - 80, 100, 40, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(240, 230, 180, 0.6)';
    ctx.beginPath(); ctx.arc(W - 90, 95, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W - 65, 115, 5, 0, Math.PI*2); ctx.fill();
    
    for (let i = 0; i < 80; i++) {
      const sx = pseudo(i) * W;
      const sy = pseudo(i*3) * H * 0.9;
      const blink = 0.5 + 0.5 * Math.sin(game.time * 2 + i);
      ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + blink * 0.6})`;
      const size = pseudo(i*5) > 0.9 ? 2.5 : 1;
      ctx.fillRect(sx, sy, size, size);
    }
  }
}

function drawIsland() {
  ctx.fillStyle = 'rgba(255, 224, 130, 0.3)';
  ctx.beginPath(); ctx.arc(island.x, island.y, island.r + 60, 0, Math.PI*2); ctx.fill();

  const sandGrad = ctx.createRadialGradient(island.x, island.y, island.r*0.7, island.x, island.y, island.r);
  sandGrad.addColorStop(0, '#fcd34d'); sandGrad.addColorStop(1, '#d97706');
  ctx.fillStyle = sandGrad;
  ctx.beginPath(); ctx.arc(island.x, island.y, island.r, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(180, 83, 9, 0.5)';
  for (let i = 0; i < 40; i++) {
    const angle = pseudo(i*3) * Math.PI * 2;
    const r = island.r * (0.85 + pseudo(i*7) * 0.15);
    const x = island.x + Math.cos(angle) * r;
    const y = island.y + Math.sin(angle) * r;
    ctx.fillRect(x, y, 2, 2);
  }

  const grassGrad = ctx.createRadialGradient(island.x, island.y, 0, island.x, island.y, island.r*0.85);
  grassGrad.addColorStop(0, '#4ade80'); grassGrad.addColorStop(0.7, '#22c55e'); grassGrad.addColorStop(1, '#166534');
  ctx.fillStyle = grassGrad;
  ctx.beginPath(); ctx.arc(island.x, island.y, island.r * 0.85, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(20, 83, 45, 0.5)';
  for (let i = 0; i < 25; i++) {
    const angle = pseudo(i*11) * Math.PI * 2;
    const r = pseudo(i*13) * island.r * 0.7;
    const x = island.x + Math.cos(angle) * r;
    const y = island.y + Math.sin(angle) * r;
    ctx.beginPath(); ctx.ellipse(x, y, 25, 15, pseudo(i)*Math.PI, 0, Math.PI*2); ctx.fill();
  }

  for (let i = 0; i < 8; i++) {
    const angle = pseudo(i*17) * Math.PI * 2;
    const r = 150 + pseudo(i*23) * island.r * 0.55;
    const tx = island.x + Math.cos(angle) * r;
    const ty = island.y + Math.sin(angle) * r;
    drawPalmTree(tx, ty, i);
  }

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let a = 0; a < Math.PI * 2; a += 0.05) {
    const r = island.r + Math.sin(a * 8 + game.time * 2) * 6 + 8;
    const x = island.x + Math.cos(a) * r;
    const y = island.y + Math.sin(a) * r;
    if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.stroke();

  ctx.fillStyle = '#1e293b';
  ctx.beginPath(); ctx.arc(caveEntrance.x, caveEntrance.y, 55, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#475569';
  ctx.beginPath(); ctx.arc(caveEntrance.x, caveEntrance.y, 48, 0, Math.PI*2); ctx.fill();
  
  const caveGrad = ctx.createRadialGradient(caveEntrance.x, caveEntrance.y, 5, caveEntrance.x, caveEntrance.y, 35);
  caveGrad.addColorStop(0, '#000000'); caveGrad.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = caveGrad;
  ctx.beginPath(); ctx.arc(caveEntrance.x, caveEntrance.y, 35, 0, Math.PI*2); ctx.fill();
  
  ctx.fillStyle = '#334155';
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const rx = caveEntrance.x + Math.cos(a) * 58;
    const ry = caveEntrance.y + Math.sin(a) * 58;
    ctx.beginPath(); ctx.arc(rx, ry, 8 + pseudo(i)*6, 0, Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = '#78350f';
  ctx.fillRect(boatDock.x - 55, boatDock.y - 22, 110, 44);
  for (let i = 0; i < 10; i++) {
    ctx.strokeStyle = i % 2 === 0 ? '#5a2d0c' : '#92400e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(boatDock.x - 55 + i * 11, boatDock.y - 22);
    ctx.lineTo(boatDock.x - 55 + i * 11, boatDock.y + 22);
    ctx.stroke();
  }
  ctx.fillStyle = '#451a03';
  ctx.fillRect(boatDock.x - 60, boatDock.y - 26, 8, 12);
  ctx.fillRect(boatDock.x + 52, boatDock.y - 26, 8, 12);
}

function drawPalmTree(x, y, seed) {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath(); ctx.ellipse(x + 15, y + 15, 35, 12, 0, 0, Math.PI*2); ctx.fill();
  
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + 10, y - 30, x + 8, y - 60);
  ctx.stroke();
  
  ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5;
  for (let i = 1; i < 6; i++) {
    const t = i / 6;
    const cx = x + 10 * t * (1-t) * 4 * t;
    const cy = y - 60 * t;
    ctx.beginPath(); ctx.moveTo(cx - 4, cy); ctx.lineTo(cx + 4, cy); ctx.stroke();
  }

  const topX = x + 8, topY = y - 60;
  const leafCount = 6;
  for (let i = 0; i < leafCount; i++) {
    const a = (i / leafCount) * Math.PI * 2 + Math.PI/2 + pseudo(seed*7 + i) * 0.3;
    const len = 35 + pseudo(seed*11 + i) * 15;
    const endX = topX + Math.cos(a) * len;
    const endY = topY + Math.sin(a) * len * 0.6;
    
    ctx.fillStyle = i % 2 === 0 ? '#16a34a' : '#15803d';
    ctx.beginPath();
    ctx.moveTo(topX, topY);
    ctx.quadraticCurveTo((topX + endX)/2 + Math.cos(a+Math.PI/2)*10, (topY + endY)/2 + Math.sin(a+Math.PI/2)*10, endX, endY);
    ctx.quadraticCurveTo((topX + endX)/2, (topY + endY)/2, topX, topY);
    ctx.fill();
    
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(topX, topY); ctx.lineTo(endX, endY); ctx.stroke();
  }
  
  ctx.fillStyle = '#451a03';
  ctx.beginPath(); ctx.arc(topX - 4, topY + 3, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(topX + 5, topY + 5, 3, 0, Math.PI*2); ctx.fill();
}

function drawBoat() {
  const level = BOAT_LEVELS[game.boatLevel - 1];
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle + Math.PI/2);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.beginPath(); ctx.ellipse(6, 6, level.size * 0.9, level.size * 1.5, 0, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, level.size*1.2, level.size*1.8, 0, 0, Math.PI*2);
  ctx.stroke();

  if (game.boatLevel === 1) {
    for (let i = -2; i <= 2; i++) {
      const g = ctx.createLinearGradient(i*9, -level.size*1.5, i*9, level.size*1.5);
      g.addColorStop(0, '#92400e'); g.addColorStop(0.5, '#78350f'); g.addColorStop(1, '#5a2d0c');
      ctx.fillStyle = g;
      ctx.fillRect(i*9 - 4, -level.size*1.5, 8, level.size*3);
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1;
      ctx.strokeRect(i*9 - 4, -level.size*1.5, 8, level.size*3);
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      for (let j = 0; j < 3; j++) {
        ctx.beginPath();
        ctx.moveTo(i*9 - 2 + j*2, -level.size*1.3);
        ctx.lineTo(i*9 - 2 + j*2, level.size*1.3);
        ctx.stroke();
      }
    }
    ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2.5;
    for (let i = 0; i < 2; i++) {
      const y = -level.size*0.8 + i * level.size*1.2;
      ctx.beginPath(); ctx.moveTo(-level.size*1.2, y); ctx.lineTo(level.size*1.2, y); ctx.stroke();
      ctx.fillStyle = '#a16207';
      for (let k = -2; k <= 2; k += 2) {
        ctx.beginPath(); ctx.arc(k*9, y, 2.5, 0, Math.PI*2); ctx.fill();
      }
    }
  }
  else if (game.boatLevel === 2) {
    const innerGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, level.size*1.4);
    innerGrad.addColorStop(0, '#5a2d0c'); innerGrad.addColorStop(1, '#78350f');
    ctx.fillStyle = innerGrad;
    ctx.beginPath();
    ctx.moveTo(0, -level.size*1.6);
    ctx.quadraticCurveTo(level.size, -level.size*0.5, level.size*0.8, level.size*1.2);
    ctx.lineTo(-level.size*0.8, level.size*1.2);
    ctx.quadraticCurveTo(-level.size, -level.size*0.5, 0, -level.size*1.6);
    ctx.fill();

    ctx.strokeStyle = '#b45309'; ctx.lineWidth = 4;
    ctx.stroke();
    
    ctx.strokeStyle = 'rgba(69, 26, 3, 0.6)'; ctx.lineWidth = 1.5;
    for (let i = -3; i <= 3; i++) {
      const t = i / 4;
      ctx.beginPath();
      ctx.moveTo(t * level.size, -level.size*1.5);
      ctx.quadraticCurveTo(t * level.size, 0, t * level.size*0.85, level.size*1.1);
      ctx.stroke();
    }
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.beginPath(); ctx.ellipse(0, -level.size*1.4, level.size*0.3, level.size*0.4, 0, 0, Math.PI*2); ctx.fill();
    
    for (let i = 0; i < 2; i++) {
      const sy = -5 + i * 20;
      ctx.fillStyle = '#d97706';
      ctx.fillRect(-level.size*0.6, sy, level.size*1.2, 6);
      ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1;
      ctx.strokeRect(-level.size*0.6, sy, level.size*1.2, 6);
    }
    
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-level.size*0.4, 10); ctx.lineTo(-level.size*1.3, 40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(level.size*0.4, 10); ctx.lineTo(level.size*1.3, 40); ctx.stroke();
    ctx.fillStyle = '#78350f';
    ctx.beginPath(); ctx.ellipse(-level.size*1.35, 42, 4, 8, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(level.size*1.35, 42, 4, 8, 0.3, 0, Math.PI*2); ctx.fill();
  }
  else if (game.boatLevel === 3) {
    const hullGrad = ctx.createLinearGradient(-level.size, 0, level.size, 0);
    hullGrad.addColorStop(0, '#1e293b'); hullGrad.addColorStop(0.5, '#334155'); hullGrad.addColorStop(1, '#0f172a');
    ctx.fillStyle = hullGrad;
    ctx.beginPath();
    ctx.moveTo(0, -level.size*1.6);
    ctx.quadraticCurveTo(level.size, -level.size*0.5, level.size*0.8, level.size*1.2);
    ctx.lineTo(-level.size*0.8, level.size*1.2);
    ctx.quadraticCurveTo(-level.size, -level.size*0.5, 0, -level.size*1.6);
    ctx.fill();
    
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5;
    ctx.stroke();
    
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-level.size*0.5, -level.size*0.8);
    ctx.quadraticCurveTo(-level.size*0.7, 0, -level.size*0.5, level.size*0.8);
    ctx.stroke();
    
    ctx.fillStyle = '#94a3b8';
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI*0.8 + i * (Math.PI*1.6/5);
      const r = level.size * 0.7;
      ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 1.5, 0, Math.PI*2); ctx.fill();
    }
    
    const cabinGrad = ctx.createLinearGradient(0, -level.size*0.5, 0, level.size*0.3);
    cabinGrad.addColorStop(0, '#1e293b'); cabinGrad.addColorStop(1, '#0f172a');
    ctx.fillStyle = cabinGrad;
    ctx.fillRect(-level.size*0.5, -level.size*0.5, level.size, level.size*0.8);
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
    ctx.strokeRect(-level.size*0.5, -level.size*0.5, level.size, level.size*0.8);
    
    const glassGrad = ctx.createLinearGradient(0, -level.size*0.5, 0, -level.size*0.1);
    glassGrad.addColorStop(0, 'rgba(56, 189, 248, 0.8)'); glassGrad.addColorStop(1, 'rgba(14, 165, 233, 0.6)');
    ctx.fillStyle = glassGrad;
    ctx.fillRect(-level.size*0.4, -level.size*0.4, level.size*0.8, level.size*0.3);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(-level.size*0.35, -level.size*0.38, level.size*0.3, 3);
    
    ctx.fillStyle = '#475569';
    ctx.fillRect(-level.size*0.3, level.size*1.2, level.size*0.6, level.size*0.3);
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
    ctx.strokeRect(-level.size*0.3, level.size*1.2, level.size*0.6, level.size*0.3);
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(-level.size*0.2, level.size*1.55, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(level.size*0.2, level.size*1.55, 3, 0, Math.PI*2); ctx.fill();
  }
  else if (game.boatLevel === 4) {
    const hullGrad = ctx.createLinearGradient(-level.size, 0, level.size, 0);
    hullGrad.addColorStop(0, '#cbd5e1'); hullGrad.addColorStop(0.5, '#ffffff'); hullGrad.addColorStop(1, '#94a3b8');
    ctx.fillStyle = hullGrad;
    ctx.beginPath();
    ctx.moveTo(0, -level.size*1.6);
    ctx.quadraticCurveTo(level.size, -level.size*0.5, level.size*0.8, level.size*1.2);
    ctx.lineTo(-level.size*0.8, level.size*1.2);
    ctx.quadraticCurveTo(-level.size, -level.size*0.5, 0, -level.size*1.6);
    ctx.fill();
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-level.size*0.75, level.size*0.7);
    ctx.lineTo(level.size*0.75, level.size*0.7);
    ctx.stroke();
    
    const deckGrad = ctx.createLinearGradient(0, -level.size*0.9, 0, -level.size*0.1);
    deckGrad.addColorStop(0, '#f8fafc'); deckGrad.addColorStop(1, '#cbd5e1');
    ctx.fillStyle = deckGrad;
    ctx.fillRect(-level.size*0.65, -level.size*0.9, level.size*1.3, level.size*0.9);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-level.size*0.65, -level.size*0.9, level.size*1.3, level.size*0.9);
    
    for (let i = -1; i <= 1; i++) {
      const ix = i * level.size * 0.35;
      const iy = -level.size*0.55;
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath(); ctx.arc(ix, iy, level.size*0.1, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath(); ctx.arc(ix - level.size*0.03, iy - level.size*0.03, level.size*0.04, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ix, iy, level.size*0.1, 0, Math.PI*2); ctx.stroke();
    }
  }
  else if (game.boatLevel === 5) {
    const hullGrad = ctx.createLinearGradient(-level.size*1.1, 0, level.size*1.1, 0);
    hullGrad.addColorStop(0, '#94a3b8'); hullGrad.addColorStop(0.5, '#ffffff'); hullGrad.addColorStop(1, '#64748b');
    ctx.fillStyle = hullGrad;
    ctx.beginPath();
    ctx.moveTo(0, -level.size*1.8);
    ctx.quadraticCurveTo(level.size*1.1, -level.size*0.5, level.size*0.9, level.size*1.2);
    ctx.lineTo(-level.size*0.9, level.size*1.2);
    ctx.quadraticCurveTo(-level.size*1.1, -level.size*0.5, 0, -level.size*1.8);
    ctx.fill();
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
    ctx.stroke();
    
    ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-level.size*0.85, level.size*0.6);
    ctx.lineTo(level.size*0.85, level.size*0.6);
    ctx.stroke();
    
    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(-level.size*0.75, -level.size*1.2, level.size*1.5, level.size*0.8);
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
    ctx.strokeRect(-level.size*0.75, -level.size*1.2, level.size*1.5, level.size*0.8);
    
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(-level.size*0.5, -level.size*1.6, level.size, level.size*0.4);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-level.size*0.5, -level.size*1.6, level.size, level.size*0.4);
    
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -level.size*0.85, level.size*0.28, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fbbf24'; ctx.font = `bold ${level.size*0.3}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('H', 0, -level.size*0.85);
    
    for (let i = -2; i <= 2; i++) {
      const wx = i * level.size * 0.22;
      const wy = level.size*0.15;
      ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
      ctx.beginPath(); ctx.arc(wx, wy, level.size*0.12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.95)';
      ctx.fillRect(wx - level.size*0.06, wy - level.size*0.04, level.size*0.12, level.size*0.06);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillRect(wx - level.size*0.04, wy - level.size*0.03, level.size*0.04, 1.5);
    }
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.beginPath(); ctx.ellipse(0, -level.size*1.6, level.size*0.35, level.size*0.15, 0, 0, Math.PI*2); ctx.fill();
  }

  if (game.zone === 'ocean' && crops.length > 0) {
    for (let i = 0; i < crops.length; i++) {
      const cx = -level.size*0.6 + (i * 15) % level.size;
      const cy = level.size*0.4;
      ctx.fillStyle = '#451a03'; ctx.fillRect(cx - 1, cy - 1, 14, 14);
      ctx.fillStyle = '#5a2d0c'; ctx.fillRect(cx, cy, 12, 12);
      ctx.fillStyle = '#1f2937'; ctx.fillRect(cx + 1, cy + 1, 10, 10);
      const h = 8 * crops[i].progress;
      ctx.fillStyle = '#22c55e'; ctx.fillRect(cx + 5, cy + 10 - h, 2, h);
      if (crops[i].progress > 0.5) {
        ctx.fillStyle = '#16a34a';
        ctx.beginPath(); ctx.arc(cx + 4, cy + 10 - h, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 8, cy + 10 - h + 1, 2, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  if (tools.turret > 0) {
    ctx.save();
    ctx.translate(0, -level.size*0.5);
    
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(0, 0, level.size*0.25, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 2; ctx.stroke();
    
    ctx.fillStyle = '#94a3b8';
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*level.size*0.18, Math.sin(a)*level.size*0.18, 1.5, 0, Math.PI*2); ctx.fill();
    }
    
    if (megalodon) {
      const worldAngle = Math.atan2(megalodon.y - player.y, megalodon.x - player.x);
      const localAngle = worldAngle - (player.angle + Math.PI/2);
      ctx.rotate(localAngle);
    }
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, -3, level.size*0.7, 6);
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(level.size*0.55, -5, level.size*0.15, 10);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fillRect(0, -2, level.size*0.7, 1);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(level.size*0.65, -1.5, 4, 3);
    
    ctx.restore();
  }

  ctx.restore();
}

function drawResource(res) {
  ctx.save();
  ctx.translate(res.x, res.y);
  ctx.rotate(res.rotation);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath(); ctx.ellipse(2, 4, res.r*1.1, res.r*0.5, 0, 0, Math.PI*2); ctx.fill();

  if (res.type === 'wood') {
    for (let j = 0; j < 2; j++) {
      const y = -res.r*0.4 + j * res.r*0.6;
      ctx.fillStyle = '#451a03'; ctx.fillRect(-res.r, y - 1, res.r*2, res.r*0.6 + 2);
      const g = ctx.createLinearGradient(0, y, 0, y + res.r*0.6);
      g.addColorStop(0, '#b45309'); g.addColorStop(0.5, '#92400e'); g.addColorStop(1, '#78350f');
      ctx.fillStyle = g;
      ctx.fillRect(-res.r, y, res.r*2, res.r*0.6);
      ctx.strokeStyle = 'rgba(69, 26, 3, 0.5)'; ctx.lineWidth = 0.8;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(-res.r, y + 2 + k*3);
        ctx.lineTo(res.r, y + 2 + k*3);
        ctx.stroke();
      }
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(-res.r+2, y + res.r*0.3, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(res.r-2, y + res.r*0.3, 2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#92400e'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(-res.r+2, y + res.r*0.3, 3.5, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(res.r-2, y + res.r*0.3, 3.5, 0, Math.PI*2); ctx.stroke();
    }
  } 
  else if (res.type === 'metal') {
    const g = ctx.createLinearGradient(-res.r, 0, res.r, 0);
    g.addColorStop(0, '#1e293b'); g.addColorStop(0.3, '#475569');
    g.addColorStop(0.5, '#64748b'); g.addColorStop(0.7, '#475569'); g.addColorStop(1, '#1e293b');
    ctx.fillStyle = g;
    ctx.fillRect(-res.r*0.8, -res.r, res.r*1.6, res.r*2);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-res.r*0.8, -res.r*0.5); ctx.lineTo(res.r*0.8, -res.r*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-res.r*0.8, res.r*0.5); ctx.lineTo(res.r*0.8, res.r*0.5); ctx.stroke();
    ctx.fillStyle = '#cbd5e1';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(-res.r*0.6, -res.r*0.5 + i*res.r*0.5, 1.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(res.r*0.6, -res.r*0.5 + i*res.r*0.5, 1.2, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(-res.r*0.3, -res.r*0.8, 2, res.r*1.6);
  } 
  else if (res.type === 'plastic') {
    const g = ctx.createLinearGradient(-res.r*0.5, 0, res.r*0.5, 0);
    g.addColorStop(0, 'rgba(14, 165, 233, 0.7)');
    g.addColorStop(0.5, 'rgba(56, 189, 248, 0.85)');
    g.addColorStop(1, 'rgba(14, 165, 233, 0.7)');
    ctx.fillStyle = g;
    ctx.fillRect(-res.r*0.5, -res.r, res.r, res.r*2);
    ctx.fillStyle = 'rgba(14, 165, 233, 0.9)';
    ctx.fillRect(-res.r*0.2, -res.r*1.15, res.r*0.4, res.r*0.2);
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(-res.r*0.25, -res.r*1.3, res.r*0.5, 4);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.fillRect(-res.r*0.25, -res.r*0.8, 2, res.r*1.5);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillRect(-res.r*0.4, -res.r*0.1, res.r*0.8, res.r*0.5);
    ctx.fillStyle = '#0c4a6e';
    ctx.font = `bold ${res.r*0.4}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('H₂O', 0, res.r*0.15);
  } 
  else if (res.type === 'fabric') {
    const g = ctx.createLinearGradient(-res.r*0.7, 0, res.r*0.7, 0);
    g.addColorStop(0, '#7e22ce'); g.addColorStop(0.5, '#a855f7'); g.addColorStop(1, '#7e22ce');
    ctx.fillStyle = g;
    ctx.fillRect(-res.r*0.7, -res.r*0.9, res.r*1.4, res.r*1.8);
    ctx.strokeStyle = '#6b21a8'; ctx.lineWidth = 1;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(i*res.r*0.4, -res.r*0.9); ctx.lineTo(i*res.r*0.4, res.r*0.9); ctx.stroke();
    }
    ctx.strokeStyle = '#e9d5ff'; ctx.lineWidth = 2;
    ctx.strokeRect(-res.r*0.7, -res.r*0.9, res.r*1.4, res.r*1.8);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fillRect(-res.r*0.6, -res.r*0.7, 3, res.r*1.4);
  } 
  else if (res.type === 'seed') {
    ctx.fillStyle = '#10b981';
    ctx.fillRect(-res.r*0.6, -res.r*0.7, res.r*1.2, res.r*1.4);
    ctx.strokeStyle = '#86efac'; ctx.lineWidth = 2;
    ctx.strokeRect(-res.r*0.6, -res.r*0.7, res.r*1.2, res.r*1.4);
    ctx.fillStyle = '#86efac';
    ctx.beginPath(); ctx.arc(0, 0, res.r*0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#065f46';
    ctx.font = `bold ${res.r*0.6}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🌱', 0, 0);
    ctx.fillStyle = '#059669';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(-res.r*0.5 + i*res.r*0.25, -res.r*0.85, res.r*0.15, res.r*0.15);
    }
  }
  ctx.restore();
}

function drawMegalodon() {
  if (!megalodon) return;
  ctx.save();
  ctx.translate(megalodon.x, megalodon.y);
  ctx.rotate(megalodon.angle);

  if (megalodon.state === 'charging' && megalodon.stateTimer > 0.5) {
    const auraR = megalodon.r * (2 + Math.sin(game.time*20)*0.15);
    const auraGrad = ctx.createRadialGradient(0, 0, megalodon.r, 0, 0, auraR);
    auraGrad.addColorStop(0, 'rgba(239, 68, 68, 0.5)');
    auraGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath(); ctx.arc(0, 0, auraR, 0, Math.PI*2); ctx.fill();
  }
  
  if (megalodon.state === 'stunned') {
    for (let i = 0; i < 5; i++) {
      const a = game.time * 3 + i * (Math.PI*2/5);
      const sx = Math.cos(a) * megalodon.r * 0.9;
      const sy = Math.sin(a) * megalodon.r * 0.6 - megalodon.r*0.5;
      ctx.fillStyle = 'rgba(251, 191, 36, 0.8)';
      ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('⭐', sx, sy);
    }
  }

  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.beginPath(); ctx.ellipse(-15, 25, megalodon.r*1.9, megalodon.r*1.2, 0, 0, Math.PI*2); ctx.fill();

  const bodyGrad = ctx.createLinearGradient(0, -megalodon.r, 0, megalodon.r);
  if (megalodon.hitFlash > 0) {
    bodyGrad.addColorStop(0, '#ffffff'); bodyGrad.addColorStop(1, '#e0e0e0');
  } else if (megalodon.state === 'stunned') {
    bodyGrad.addColorStop(0, '#64748b'); bodyGrad.addColorStop(1, '#334155');
  } else {
    bodyGrad.addColorStop(0, '#475569'); bodyGrad.addColorStop(0.5, '#1e293b'); bodyGrad.addColorStop(1, '#0f172a');
  }
  
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(megalodon.r*1.5, 0);
  ctx.quadraticCurveTo(megalodon.r*0.8, -megalodon.r*1.0, -megalodon.r*0.3, -megalodon.r*0.9);
  ctx.lineTo(-megalodon.r*1.2, -megalodon.r*0.7);
  ctx.lineTo(-megalodon.r*0.9, 0);
  ctx.lineTo(-megalodon.r*1.2, megalodon.r*0.7);
  ctx.lineTo(-megalodon.r*0.3, megalodon.r*0.9);
  ctx.quadraticCurveTo(megalodon.r*0.8, megalodon.r*1.0, megalodon.r*1.5, 0);
  ctx.fill();
  
  ctx.strokeStyle = megalodon.hitFlash > 0 ? '#ef4444' : '#334155';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  
  if (megalodon.hitFlash <= 0) {
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)'; ctx.lineWidth = 1;
    for (let row = 0; row < 3; row++) {
      const rowY = -megalodon.r*0.4 + row * megalodon.r*0.4;
      for (let i = -2; i <= 3; i++) {
        const cx = i * megalodon.r*0.35;
        ctx.beginPath();
        ctx.arc(cx, rowY, megalodon.r*0.12, 0, Math.PI);
        ctx.stroke();
      }
    }
  }
  
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const gx = megalodon.r*0.3 + i * 5;
    ctx.beginPath();
    ctx.moveTo(gx, -megalodon.r*0.25);
    ctx.quadraticCurveTo(gx + 3, 0, gx, megalodon.r*0.25);
    ctx.stroke();
  }
  
  ctx.fillStyle = megalodon.state === 'stunned' ? '#475569' : '#1e293b';
  ctx.beginPath();
  ctx.moveTo(-megalodon.r*0.1, -megalodon.r*0.85);
  ctx.lineTo(-megalodon.r*0.5, -megalodon.r*1.4);
  ctx.lineTo(-megalodon.r*0.5, -megalodon.r*0.7);
  ctx.fill();
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5; ctx.stroke();
  
  ctx.fillStyle = megalodon.state === 'stunned' ? '#475569' : '#1e293b';
  ctx.beginPath();
  ctx.moveTo(megalodon.r*0.2, megalodon.r*0.5);
  ctx.lineTo(megalodon.r*0.1, megalodon.r*1.1);
  ctx.lineTo(megalodon.r*0.6, megalodon.r*0.7);
  ctx.fill();
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(megalodon.r*0.2, -megalodon.r*0.5);
  ctx.lineTo(megalodon.r*0.1, -megalodon.r*1.1);
  ctx.lineTo(megalodon.r*0.6, -megalodon.r*0.7);
  ctx.fill();
  ctx.stroke();
  
  ctx.fillStyle = megalodon.state === 'stunned' ? '#475569' : '#1e293b';
  const tailWave = Math.sin(game.time*8) * 5;
  ctx.beginPath();
  ctx.moveTo(-megalodon.r*1.0, 0);
  ctx.lineTo(-megalodon.r*1.6, -megalodon.r*0.6 + tailWave);
  ctx.lineTo(-megalodon.r*1.4, 0);
  ctx.lineTo(-megalodon.r*1.6, megalodon.r*0.6 + tailWave);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = 'rgba(148, 163, 184, 0.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(megalodon.r*0.3, -megalodon.r*0.3); ctx.lineTo(megalodon.r*0.6, megalodon.r*0.1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(megalodon.r*0.7, -megalodon.r*0.15); ctx.lineTo(megalodon.r*0.9, -megalodon.r*0.4); ctx.stroke();

  if (megalodon.state === 'charging' && megalodon.stateTimer <= 0.5) {
    ctx.fillStyle = '#ffffff';
    for (let i = -3; i <= 3; i++) {
      const ty = i * 6;
      ctx.beginPath();
      ctx.moveTo(megalodon.r*1.35, ty);
      ctx.lineTo(megalodon.r*1.55, ty + 3);
      ctx.lineTo(megalodon.r*1.35, ty + 6);
      ctx.fill();
    }
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(megalodon.r*1.35, -21); ctx.lineTo(megalodon.r*1.35, 21); ctx.stroke();
  }

  ctx.fillStyle = '#ef4444';
  ctx.shadowBlur = 15; ctx.shadowColor = '#ef4444';
  ctx.beginPath(); ctx.arc(megalodon.r*0.65, -15, 6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(megalodon.r*0.65, 15, 6, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(megalodon.r*0.67, -15, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(megalodon.r*0.67, 15, 2.5, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawShark(sh) {
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.rotate(sh.angle);
  
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath(); ctx.ellipse(0, 0, 28, 12, 0, 0, Math.PI*2); ctx.fill();
  
  const finGrad = ctx.createLinearGradient(0, -20, 0, 10);
  finGrad.addColorStop(0, '#64748b'); finGrad.addColorStop(1, '#334155');
  ctx.fillStyle = finGrad;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(18, 12);
  ctx.lineTo(8, 14);
  ctx.lineTo(0, 8);
  ctx.lineTo(-8, 14);
  ctx.lineTo(-18, 12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5; ctx.stroke();
  
  ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(6, 5); ctx.lineTo(0, 8); ctx.fill();
  
  ctx.restore();
}

function drawOre(ore) {
  ctx.save();
  ctx.translate(ore.x, ore.y);
  
  const rockGrad = ctx.createRadialGradient(-5, -5, 3, 0, 0, 28);
  rockGrad.addColorStop(0, '#475569'); rockGrad.addColorStop(1, '#1e293b');
  ctx.fillStyle = rockGrad;
  ctx.beginPath();
  ctx.moveTo(-22, -8);
  ctx.lineTo(-15, -22);
  ctx.lineTo(5, -25);
  ctx.lineTo(22, -10);
  ctx.lineTo(20, 12);
  ctx.lineTo(-5, 25);
  ctx.lineTo(-20, 15);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
  
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-10, -15); ctx.lineTo(0, -5); ctx.lineTo(-5, 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(5, 15); ctx.stroke();
  
  let colors = [];
  if (ore.type === 'copper') { colors = ['#fb923c', '#f97316', '#c2410c']; }
  else if (ore.type === 'iron') { colors = ['#cbd5e1', '#94a3b8', '#64748b']; }
  else if (ore.type === 'coal') { colors = ['#334155', '#0f172a', '#000000']; }
  else if (ore.type === 'gold') { colors = ['#fde047', '#fbbf24', '#d97706']; }
  else if (ore.type === 'diamond') { colors = ['#a5f3fc', '#67e8f9', '#06b6d4']; }
  
  for (let i = 0; i < 3; i++) {
    const cx = -12 + i * 12;
    const cy = -3 + (i % 2) * 5;
    const size = 6 + (i % 2) * 2;
    
    ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.lineTo(cx + size*0.6, cy);
    ctx.lineTo(cx, cy + size);
    ctx.lineTo(cx - size*0.6, cy);
    ctx.closePath(); ctx.fill();
    
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)'; ctx.lineWidth = 1; ctx.stroke();
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.lineTo(cx + size*0.3, cy - size*0.3);
    ctx.lineTo(cx, cy + size*0.2);
    ctx.closePath(); ctx.fill();
  }
  
  const twinkle = Math.sin(game.time * 3 + ore.seed) * 0.5 + 0.5;
  ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * 0.8})`;
  ctx.beginPath();
  const bx = 0, by = 3, bs = 4 + twinkle * 2;
  ctx.moveTo(bx, by - bs); ctx.lineTo(bx + bs*0.3, by); ctx.lineTo(bx, by + bs);
  ctx.lineTo(bx - bs*0.3, by); ctx.closePath(); ctx.fill();

  if (ore.hp < 3) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(-18, -32, 36, 5);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-17, -31, 34 * (ore.hp/3), 3);
  }
  
  ctx.restore();
}

function drawMob(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  
  if (m.type === 'boar') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath(); ctx.ellipse(0, 12, 28, 8, 0, 0, Math.PI*2); ctx.fill();
    
    const bodyGrad = ctx.createRadialGradient(-5, -5, 5, 0, 0, 28);
    bodyGrad.addColorStop(0, '#92400e'); bodyGrad.addColorStop(1, '#451a03');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 16, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1c0a02'; ctx.lineWidth = 2; ctx.stroke();
    
    ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.5;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(i*4, -13);
      ctx.lineTo(i*4 + 1, -19);
      ctx.stroke();
    }
    
    ctx.fillStyle = '#7c2d12';
    ctx.beginPath(); ctx.arc(20, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#1c0a02';
    ctx.beginPath(); ctx.arc(22, -3, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(22, 3, 1.5, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.moveTo(24, -6); ctx.lineTo(28, -10); ctx.lineTo(26, -4);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(24, 6); ctx.lineTo(28, 10); ctx.lineTo(26, 4);
    ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(12, -6, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(13, -6, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1c0a02'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(9, -10); ctx.lineTo(15, -9); ctx.stroke();
    
    ctx.fillStyle = '#451a03';
    ctx.beginPath();
    ctx.moveTo(-5, -14); ctx.lineTo(-10, -22); ctx.lineTo(2, -16);
    ctx.fill();
    
  } else if (m.type === 'bat') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath(); ctx.ellipse(0, 15, 15, 5, 0, 0, Math.PI*2); ctx.fill();
    
    const wing = Math.sin(game.time * 20) * 12;
    
    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-25, -10 + wing); ctx.lineTo(-15, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(25, -10 + wing); ctx.lineTo(15, 0); ctx.fill();
    
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-15, -5 + wing*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-10, 2 + wing*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(15, -5 + wing*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(10, 2 + wing*0.3); ctx.stroke();
    
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    
    ctx.beginPath(); ctx.moveTo(-5, -8); ctx.lineTo(-8, -15); ctx.lineTo(-2, -10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5, -8); ctx.lineTo(8, -15); ctx.lineTo(2, -10); ctx.fill();
    
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(-3, -2, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -2, 1.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBuilding(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  
  if (b.type === 'gen') {
    ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#d8b4fe'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('⚡', 0, 2);
    ctx.strokeStyle = 'rgba(168, 85, 247, 0.2)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 250, 0, Math.PI*2); ctx.stroke();
  } else if (b.type === 'drill') {
    ctx.fillStyle = '#64748b'; ctx.fillRect(-25, -25, 50, 50);
    ctx.strokeStyle = b.fuel > 0 ? '#22c55e' : '#ef4444'; ctx.lineWidth = 3; ctx.strokeRect(-25, -25, 50, 50);
    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(15,10); ctx.lineTo(-15,10); ctx.fill();
    if (b.fuel > 0) { 
      ctx.fillStyle = '#22c55e'; 
      ctx.font = 'bold 14px sans-serif'; 
      ctx.textAlign = 'center';
      ctx.fillText(b.fuel, 0, 42); 
    }
  }
  ctx.restore();
}

function drawPlayer() {
  if (!player.isOnFoot) {
    drawBoat();
    if (fishing.state !== 'idle') {
      const lineLen = 120;
      const lineX = player.x + Math.cos(player.angle) * lineLen;
      const lineY = player.y + Math.sin(player.angle) * lineLen;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(lineX, lineY); ctx.stroke();
      ctx.fillStyle = fishing.state === 'biting' ? '#ef4444' : '#fbbf24';
      ctx.beginPath(); ctx.arc(lineX, lineY, 6, 0, Math.PI*2); ctx.fill();
      if (fishing.state === 'biting') { 
        ctx.fillStyle = '#fff'; 
        ctx.font = 'bold 30px sans-serif'; 
        ctx.textAlign='center'; 
        ctx.fillText('❗', lineX, lineY - 20); 
      }
    }
  } else {
    ctx.save(); 
    ctx.translate(player.x, player.y); 
    ctx.rotate(player.angle);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; 
    ctx.beginPath(); 
    ctx.ellipse(0, 5, 15, 8, 0, 0, Math.PI*2); 
    ctx.fill();
    ctx.fillStyle = '#38bdf8'; 
    ctx.beginPath(); 
    ctx.arc(0, 0, 14, 0, Math.PI*2); 
    ctx.fill();
    ctx.strokeStyle = '#bae6fd'; 
    ctx.lineWidth = 2; 
    ctx.stroke();
    ctx.fillStyle = '#fff'; 
    ctx.beginPath(); 
    ctx.arc(6, -4, 3, 0, Math.PI*2); 
    ctx.fill();
    ctx.restore();
  }
}

function draw() {
  if (game.zone === 'ocean' || game.zone === 'island') drawOceanBg();
  else if (game.zone === 'cave') { 
    ctx.fillStyle = '#020617'; 
    ctx.fillRect(0, 0, W, H); 
  }

  if (game.state === 'menu') return;

  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.translate(W/2, H/2); 
  ctx.scale(game.camera.zoom, game.camera.zoom); 
  ctx.translate(-game.camera.x, -game.camera.y);

  if (game.zone === 'island' || game.zone === 'ocean') drawIsland();

  if (game.zone === 'island' || game.zone === 'cave') {
    for (const ore of ores) drawOre(ore);
  }

  if (game.zone === 'cave') {
    if (game.caveDepth < 3) {
      ctx.fillStyle = '#475569'; 
      ctx.fillRect(elevatorPos.x - 30, elevatorPos.y - 30, 60, 60);
      ctx.strokeStyle = '#fbbf24'; 
      ctx.lineWidth = 3; 
      ctx.strokeRect(elevatorPos.x - 30, elevatorPos.y - 30, 60, 60);
      ctx.fillStyle = '#fbbf24'; 
      ctx.font = 'bold 30px sans-serif'; 
      ctx.textAlign = 'center'; 
      ctx.fillText('🛗', elevatorPos.x, elevatorPos.y + 10);
    }
    ctx.fillStyle = '#1e293b'; 
    ctx.beginPath(); 
    ctx.arc(exitPos.x, exitPos.y, 40, 0, Math.PI*2); 
    ctx.fill();
    ctx.fillStyle = '#fff'; 
    ctx.font = 'bold 24px sans-serif'; 
    ctx.textAlign = 'center'; 
    ctx.fillText('🚪', exitPos.x, exitPos.y + 8);
  }

  for (const b of buildings) drawBuilding(b);
  for (const m of mobs) drawMob(m);

  if (megalodon) drawMegalodon();

  for (const h of harpoons) {
    ctx.save(); 
    ctx.translate(h.x, h.y); 
    ctx.rotate(h.angle);
    ctx.strokeStyle = '#d97706'; 
    ctx.lineWidth = 4;
    ctx.beginPath(); 
    ctx.moveTo(-20, 0); 
    ctx.lineTo(10, 0); 
    ctx.stroke();
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath(); 
    ctx.moveTo(15, 0); 
    ctx.lineTo(5, -6); 
    ctx.lineTo(5, 6); 
    ctx.fill();
    ctx.restore();
  }

  if (game.zone === 'ocean') {
    for (const res of resources) drawResource(res);
    for (const sh of sharks) drawShark(sh);
  }

  drawPlayer();

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife); 
    ctx.fillStyle = pt.color;
    ctx.beginPath(); 
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); 
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (game.zone === 'ocean' && game.isNight) {
    const lightGrad = ctx.createRadialGradient(player.x, player.y, 80, player.x, player.y, 350);
    lightGrad.addColorStop(0, 'rgba(15, 23, 42, 0)'); 
    lightGrad.addColorStop(1, 'rgba(2, 6, 23, 0.9)');
    ctx.fillStyle = lightGrad; 
    ctx.beginPath(); 
    ctx.arc(player.x, player.y, 450, 0, Math.PI*2); 
    ctx.fill();
  } else if (game.zone === 'cave') {
    const darkness = Math.min(0.95, 0.8 + game.caveDepth * 0.05);
    const lightGrad = ctx.createRadialGradient(player.x, player.y, 50, player.x, player.y, 200);
    lightGrad.addColorStop(0, 'rgba(0, 0, 0, 0)'); 
    lightGrad.addColorStop(1, `rgba(0, 0, 0, ${darkness})`);
    ctx.fillStyle = lightGrad; 
    ctx.beginPath(); 
    ctx.arc(player.x, player.y, 300, 0, Math.PI*2); 
    ctx.fill();
  }

  ctx.restore();

  if (joystick.active) {
    ctx.save(); 
    ctx.globalAlpha = 0.2;
    ctx.beginPath(); 
    ctx.arc(joystick.bx, joystick.by, JOY_MAX, 0, Math.PI*2); 
    ctx.fillStyle = '#ffffff'; 
    ctx.fill();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); 
    ctx.arc(joystick.bx + joystick.dx*JOY_MAX, joystick.by + joystick.dy*JOY_MAX, 22, 0, Math.PI*2); 
    ctx.fillStyle = '#38bdf8'; 
    ctx.fill();
    ctx.restore();
  }

  if (bossWarningTimer > 0 && !megalodon) {
    ctx.fillStyle = 'rgba(239, 68, 68, ' + (Math.sin(game.time * 15) * 0.5 + 0.5) + ')';
    ctx.font = '900 22px system-ui, sans-serif'; 
    ctx.textAlign = 'center';
    ctx.fillText('ВНИМАНИЕ: МЕГАЛОДОН', W/2, H/2 - 60);
    ctx.fillText('ПРИБЛИЖАЕТСЯ', W/2, H/2 - 30);
  }
}

function loop(now) {
  let dt = (now - lastTime) / 1000; 
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  if (game.state === 'playing') {
    update(dt); 
    draw(); 
  }
  
  requestAnimationFrame(loop);
}

function showMenu() {
  game.state = 'menu';
  overlayContent.innerHTML = `
    <h1 class="title">МОРСКОЙ ВОЛК</h1>
    <p class="subtitle">Выживи, победи Мегалодона, найди Остров и построй свою империю!</p>
    <button class="btn" id="playBtn">▶ НАЧАТЬ</button>
    <div class="hint">
      <p>🕹️ Двигайся пальцем по экрану</p>
      <p>🎣 Собирай ресурсы, лови рыбу, чисти воду</p>
      <p>🦈 На 5 ур. лодки — ночь и Мегалодон</p>
      <p>🏝️ После босса плыви вправо-вниз к острову</p>
      <p>🕳️ В пещере найди чертеж Бура и спустись на лифте</p>
      <p>⚡ Построй Генератор и Электробур (жрет уголь)</p>
    </div>`;
  overlay.classList.remove('hidden');
  document.getElementById('playBtn').addEventListener('click', startGame);
}

window.addEventListener('error', e => {
  console.error('JS ERROR:', e.message, 'at', e.filename, e.lineno);
});

showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
