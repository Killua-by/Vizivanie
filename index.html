<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dota Runner: Killer Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none; /* Отключаем скролл на телефоне */
        }
        #game-container {
            position: relative;
            max-width: 100%;
            max-height: 80vh;
        }
        canvas {
            background-color: #f4f4f4;
            border: 4px solid #111;
            display: block;
            image-rendering: pixelated; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 80vh;
        }
        /* Сенсорные кнопки для мобилок */
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #444;
            color: white;
            border: 2px solid #888;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            user-select: none;
            cursor: pointer;
            flex: 1;
            margin: 0 5px;
            text-align: center;
        }
        .btn:active {
            background-color: #666;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<div id="mobile-controls">
    <div class="btn" id="btnSlide">⬇️ Подкат</div>
    <div class="btn" id="btnJump">⬆️ Прыжок</div>
    <div class="btn" id="btnShoot">💥 Атака</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // --- ДЕТАЛИЗИРОВАННЫЕ ПИКСЕЛЬНЫЕ СПРАЙТЫ (16x16) ---
    // B=Черный, P=Фиолетовый, R=Красный, Y=Желтый, O=Оранжевый, G=Зеленый, W=Белый, L=Голубой
    const colors = {
        'B': '#000000', 'P': '#6b2fa0', 'R': '#d93a3a', 'Y': '#f1c40f', 
        'O': '#e67e22', 'G': '#2ecc71', 'W': '#ffffff', 'L': '#3498db',
        'D': '#2c3e50' // Темный для теней
    };

    const sprites = {
        lion: [
            "....B......B....",
            "...BPB....BPB...",
            "...BPPB..BPPB...",
            "....BPPPPPPB....",
            "....BRRRRRRB....",
            "....BRYRRYRB....",
            "....BRRRRRRB....",
            ".....BBBBBB.....",
            "...BBPPPPPPBB...",
            "..BPPPPPPPPPPB..",
            "..BPPBBPPBBPPB..",
            "..BPPBBPPBBPPB..",
            "...BB..BB..BB...",
            "......BBBB......",
            ".....BB..BB.....",
            "....BB....BB...."
        ],
        creep: [
            "....YYYYYYYY....",
            "..YYYYYYYYYYYY..",
            ".YYYWWWWWWWWYYY.",
            "YYYWWBBBBBBWWYYY",
            "YYYWWBBBBBBWWYYY",
            "YYYWWWWWWWWWWYYY",
            "YYYYYYYYYYYYYYYY",
            ".YYYYYYYYYYYYYY.",
            "..YYYDDDDDDYYY..",
            "...YYYYYYYYYY...",
            "..YYYYYYYYYYYY..",
            ".YYY.YYYYYY.YYY.",
            "YY...YYYYYY...YY",
            "Y....YYYYYY....Y",
            "......YYYY......",
            "................"
        ],
        flyingEye: [
            "......PPPP......",
            "....PPPPPPPP....",
            "...PPWWWWWWPP...",
            "..PPWWBBBBWWPP..",
            "..PWWBBBBBBWWP..",
            "..PWWBBBBBBWWP..",
            "..PWWBBBBBBWWP..",
            "..PWWWWWWWWWWP..",
            "...PPPPPPPPPP...",
            ".....PPPPPP.....",
            "....PP.PP.PP....",
            "...BB...BB..BB..",
            "..B......B...B..",
            "................",
            "................",
            "................"
        ]
    };

    function drawSprite(spriteMap, x, y, scale) {
        for (let row = 0; row < spriteMap.length; row++) {
            for (let col = 0; col < spriteMap[row].length; col++) {
                const colorCode = spriteMap[row][col];
                if (colorCode !== '.') {
                    ctx.fillStyle = colors[colorCode];
                    ctx.fillRect(x + col * scale, y + row * scale, scale, scale);
                }
            }
        }
    }

    // --- ИГРОВЫЕ ПЕРЕМЕННЫЕ ---
    let score = 0;
    let gameOver = false;
    let frameCount = 0;
    let gameSpeed = 7;
    let spawnTimer = 0;
    let spawnInterval = 70;

    const GROUND_Y = 336; // Высота земли
    const P_SCALE = 4; // Размер пикселя персонажа

    const player = {
        x: 100,
        y: GROUND_Y - 64,
        width: 16 * P_SCALE,
        height: 16 * P_SCALE,
        dy: 0,
        gravity: 0.8,
        jumpForce: -15,
        isGrounded: true,
        isSliding: false,
        slideTimer: 0,
        shootCooldown: 0
    };

    let enemies = [];
    let projectiles = [];
    let particles = [];

    // --- УПРАВЛЕНИЕ ---
    function jump() {
        if (player.isGrounded && !gameOver) {
            player.dy = player.jumpForce;
            player.isGrounded = false;
            player.isSliding = false; // Отменяем подкат при прыжке
        } else if (gameOver) {
            resetGame();
        }
    }

    function slide() {
        if (player.isGrounded && !player.isSliding && !gameOver) {
            player.isSliding = true;
            player.slideTimer = 40; // Длительность подката (кадры)
        }
    }

    function shoot() {
        if (player.shootCooldown <= 0 && !gameOver) {
            projectiles.push({
                x: player.x + player.width,
                y: player.y + player.height / 2 - 10,
                width: 30,
                height: 20,
                speed: 15
            });
            player.shootCooldown = 15; // Задержка между выстрелами
        }
    }

    // Обработка клавиатуры
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); jump(); }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); slide(); }
        if (e.code === 'KeyX' || e.code === 'KeyJ' || e.code === 'ControlLeft') { e.preventDefault(); shoot(); }
    });

    // Обработка свайпов для мобилок
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
        if(e.target.classList.contains('btn')) return; // Игнорируем нажатия на кнопки
        touchStartY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', (e) => {
        if(e.target.classList.contains('btn')) return;
        let touchEndY = e.changedTouches[0].clientY;
        if (touchStartY - touchEndY > 30) jump(); // Свайп вверх
        else if (touchEndY - touchStartY > 30) slide(); // Свайп вниз
        else shoot(); // Тап - выстрел
    });

    // Привязка кнопок
    document.getElementById('btnJump').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
    document.getElementById('btnSlide').addEventListener('touchstart', (e) => { e.preventDefault(); slide(); });
    document.getElementById('btnShoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    
    // Клики мышкой на кнопки (для ПК)
    document.getElementById('btnJump').addEventListener('mousedown', jump);
    document.getElementById('btnSlide').addEventListener('mousedown', slide);
    document.getElementById('btnShoot').addEventListener('mousedown', shoot);


    function resetGame() {
        score = 0;
        gameOver = false;
        enemies = [];
        projectiles = [];
        particles = [];
        player.y = GROUND_Y - 64;
        player.dy = 0;
        player.isSliding = false;
        spawnTimer = 0;
    }

    function createExplosion(x, y) {
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 30,
                color: Math.random() > 0.5 ? '#e74c3c' : '#f1c40f'
            });
        }
    }

    // --- ЛОГИКА ---
    function update() {
        if (gameOver) return;

        if (frameCount % 5 === 0) score += 1;
        frameCount++;

        // Физика игрока
        player.y += player.dy;
        player.dy += player.gravity;

        // Приземление
        let currentHeight = player.isSliding ? 32 : 64; // Высота меняется в подкате
        if (player.y >= GROUND_Y - currentHeight) {
            player.y = GROUND_Y - currentHeight;
            player.dy = 0;
            player.isGrounded = true;
        }

        // Таймеры
        if (player.isSliding) {
            player.slideTimer--;
            if (player.slideTimer <= 0) player.isSliding = false;
        }
        if (player.shootCooldown > 0) player.shootCooldown--;

        // Спавн врагов
        spawnTimer++;
        if (spawnTimer > spawnInterval) {
            const isFlying = Math.random() > 0.6; // 40% шанс летающего врага
            if (isFlying) {
                // Летающий (нужно присесть)
                enemies.push({
                    type: 'flying',
                    x: canvas.width,
                    y: GROUND_Y - 140, // Высоко над землей
                    width: 16 * 4,
                    height: 16 * 4,
                    speedOffset: 2 // Летает чуть быстрее
                });
            } else {
                // Земляной (нужно прыгнуть)
                enemies.push({
                    type: 'ground',
                    x: canvas.width,
                    y: GROUND_Y - 64,
                    width: 16 * 4,
                    height: 16 * 4,
                    speedOffset: 0
                });
            }
            spawnTimer = 0;
            spawnInterval = Math.floor(Math.random() * 40) + 60; 
        }

        // Движение врагов
        for (let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            en.x -= (gameSpeed + en.speedOffset);

            // Коллизия с игроком
            let pHeight = player.isSliding ? 32 : 64;
            let pY = player.y;

            if (
                player.x < en.x + en.width &&
                player.x + player.width > en.x &&
                pY < en.y + en.height &&
                pY + pHeight > en.y
            ) {
                // Если это летающий враг и мы в подкате - мы его пропускаем (он над нами)
                if (en.type === 'flying' && player.isSliding) {
                    // Все ок, проскальзываем
                } else {
                    gameOver = true; // Смерть
                }
            }

            if (en.x + en.width < 0) enemies.splice(i, 1);
        }

        // Движение снарядов
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let pr = projectiles[i];
            pr.x += pr.speed;

            // Попадание в врагов
            for (let j = enemies.length - 1; j >= 0; j--) {
                let en = enemies[j];
                if (
                    pr.x < en.x + en.width &&
                    pr.x + pr.width > en.x &&
                    pr.y < en.y + en.height &&
                    pr.y + pr.height > en.y
                ) {
                    // Убиваем врага
                    createExplosion(en.x + en.width/2, en.y + en.height/2);
                    enemies.splice(j, 1);
                    projectiles.splice(i, 1);
                    score += 50; // Очки за убийство
                    break;
                }
            }

            if (pr.x > canvas.width) projectiles.splice(i, 1);
        }

        // Движение частиц
        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.life--;
            if (pt.life <= 0) particles.splice(i, 1);
        }
    }

    // --- ОТРИСОВКА ---
    function draw() {
        // Фон
        ctx.fillStyle = '#f4f4f4';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Земля
        ctx.fillStyle = '#333';
        for(let i=0; i<canvas.width; i+=40) {
            ctx.fillRect(i, GROUND_Y, 20, 4);
            ctx.fillRect(i+25, GROUND_Y+6, 10, 4);
        }

        // Отрисовка игрока (с учетом подката)
        if (player.isSliding) {
            // Визуально приплюскиваем спрайт при подкате
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.scale(1, 0.6); // Сжатие по вертикали
            ctx.translate(-player.x, -player.y + 25); // Корректировка
            drawSprite(sprites.lion, player.x, player.y - 25, P_SCALE);
            ctx.restore();
        } else {
            drawSprite(sprites.lion, player.x, player.y, P_SCALE);
        }

        // Отрисовка врагов
        enemies.forEach(en => {
            if (en.type === 'ground') {
                drawSprite(sprites.creep, en.x, en.y, 4);
            } else {
                drawSprite(sprites.flyingEye, en.x, en.y, 4);
            }
        });

        // Отрисовка снарядов (Красная магия)
        projectiles.forEach(pr => {
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(pr.x, pr.y, pr.width, pr.height);
            ctx.fillStyle = '#ffcccc';
            ctx.fillRect(pr.x + 5, pr.y + 5, pr.width - 10, pr.height - 10);
        });

        // Отрисовка частиц (взрывы)
        particles.forEach(pt => {
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, 6, 6);
        });

        // Интерфейс (Счет и Цель)
        ctx.fillStyle = '#555';
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('СЧЕТ: ' + String(score).padStart(5, '0'), 20, 40);

        // Рамка ЦЕЛЬ (как на скрине)
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;
        ctx.strokeRect(canvas.width - 160, 15, 140, 40);
        ctx.fillStyle = '#555';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText('🗡️ ЦЕЛЬ', canvas.width - 130, 43);

        // Game Over
        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 45px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('ВАС УБИЛИ!', canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.fillStyle = 'white';
            ctx.font = '20px "Courier New", monospace';
            ctx.fillText('Нажмите ПРОБЕЛ или ПРЫЖОК для рестарта', canvas.width / 2, canvas.height / 2 + 40);
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
