<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>Isometric Survival</title>
<script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
<script>window.vConsole = new window.VConsole();</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:system-ui,sans-serif;touch-action:none}
  #game{display:block;width:100%;height:100%}
  /* UI поверх игры */
  #ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px}
  .top-bar{display:flex;justify-content:space-between;align-items:flex-start;pointer-events:auto}
  .resources{display:flex;gap:12px;background:rgba(15,23,42,0.8);padding:8px 16px;border-radius:12px;border:2px solid #334155;box-shadow:0 4px 6px rgba(0,0,0,0.3)}
  .res-item{display:flex;align-items:center;gap:6px;color:#fff;font-weight:bold;font-size:14px;text-shadow:1px 1px 0 #000}
  .res-icon{font-size:18px}
  .bottom-bar{display:flex;justify-content:center;gap:12px;pointer-events:auto;padding-bottom:24px}
  .action-btn{width:60px;height:60px;border-radius:50%;background:rgba(30,41,59,0.9);border:2px solid #475569;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,0.5);cursor:pointer;transition:transform 0.1s}
  .action-btn:active{transform:scale(0.9);background:#334155}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="top-bar">
    <div class="resources">
      <div class="res-item"><span class="res-icon">🪵</span> 0</div>
      <div class="res-item"><span class="res-icon">🪨</span> 0</div>
      <div class="res-item"><span class="res-icon">🍖</span> 0</div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="action-btn" onclick="alert('Меню строительства в разработке!')">🏗️</div>
    <div class="action-btn" onclick="alert('Меню армии в разработке!')">⚔️</div>
  </div>
</div>

<script>
// ==========================================
// НАСТРОЙКИ И БАЗОВЫЕ ПЕРЕМЕННЫЕ
// ==========================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth;
let H = window.innerHeight;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

// Параметры изометрии (Размер тайла)
const TILE_W = 64;
const TILE_H = 32;
const MAP_SIZE = 30; // Карта 30x30

// Состояние камеры
const camera = {
  x: 0,
  y: 0,
  zoom: 1,
  minZoom: 0.5,
  maxZoom: 2,
  isDragging: false,
  lastX: 0,
  lastY: 0,
  pinchDist: 0
};

// Инициализация карты
let map = [];

// ==========================================
// ГЕНЕРАЦИЯ КАРТЫ
// ==========================================
function generateMap() {
  map = [];
  for (let y = 0; y < MAP_SIZE; y++) {
    map[y] = [];
    for (let x = 0; x < MAP_SIZE; x++) {
      // Определяем центр и края для создания острова
      const distFromCenter = Math.hypot(x - MAP_SIZE/2, y - MAP_SIZE/2);
      let type = 'grass';
      
      if (distFromCenter > MAP_SIZE * 0.45) {
        type = 'water'; // Вода по краям
      } else if (Math.random() < 0.2) {
        type = 'tree'; // Деревья на суше
      } else if (Math.random() < 0.1) {
        type = 'rock'; // Камни
      }
      
      map[y][x] = { x, y, type, seed: Math.random() * 100 };
    }
  }
}

// ==========================================
// ИЗОМЕТРИЧЕСКАЯ МАТЕМАТИКА
// ==========================================
// Преобразование координат карты в экранные координаты (до учета камеры)
function getScreenPos(mapX, mapY) {
  return {
    x: (mapX - mapY) * (TILE_W / 2),
    y: (mapX + mapY) * (TILE_H / 2)
  };
}

// Преобразование экранных координат в координаты карты (для кликов)
function getMapPos(screenX, screenY) {
  const sx = screenX - W/2 - camera.x;
  const sy = screenY - H/2 - camera.y;
  return {
    x: (sx / (TILE_W / 2) + sy / (TILE_H / 2)) / 2,
    y: (sy / (TILE_H / 2) - sx / (TILE_W / 2)) / 2
  };
}

// ==========================================
// ВВОД (МЫШЬ И ТАЧ)
// ==========================================
function handleStart(x, y) {
  camera.isDragging = true;
  camera.lastX = x;
  camera.lastY = y;
}
function handleMove(x, y) {
  if (camera.isDragging) {
    const dx = x - camera.lastX;
    const dy = y - camera.lastY;
    camera.x += dx;
    camera.y += dy;
    camera.lastX = x;
    camera.lastY = y;
  }
}
function handleEnd() {
  camera.isDragging = false;
}

// Мышь
canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
window.addEventListener('mouseup', handleEnd);

// Колесико для зума на ПК
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomDelta = e.deltaY > 0 ? -0.1 : 0.1;
  camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom + zoomDelta));
}, { passive: false });

// Тач (свайп и пинч)
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    handleStart(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2) {
    camera.isDragging = false;
    camera.pinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    handleMove(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2) {
    const newDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const delta = newDist - camera.pinchDist;
    camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom + delta * 0.005));
    camera.pinchDist = newDist;
  }
}, { passive: false });

canvas.addEventListener('touchend', handleEnd);

// ==========================================
// ОТРИСОВКА
// ==========================================
function drawTile(x, y) {
  const t = map[y][x];
  const pos = getScreenPos(x, y);
  
  ctx.save();
  ctx.translate(pos.x, pos.y);

  // Основание тайла (ромб)
  ctx.beginPath();
  ctx.moveTo(0, -TILE_H / 2);
  ctx.lineTo(TILE_W / 2, 0);
  ctx.lineTo(0, TILE_H / 2);
  ctx.lineTo(-TILE_W / 2, 0);
  ctx.closePath();

  if (t.type === 'water') {
    const wave = Math.sin(Date.now() / 500 + t.seed) * 5;
    const grad = ctx.createLinearGradient(-TILE_W/2, -TILE_H/2, TILE_W/2, TILE_H/2);
    grad.addColorStop(0, '#0ea5e9');
    grad.addColorStop(1, '#0284c7');
    ctx.fillStyle = grad;
    ctx.fill();
    // Блик
    ctx.fillStyle = `rgba(255,255,255,${0.1 + wave * 0.02})`;
    ctx.beginPath();
    ctx.moveTo(0, -TILE_H / 4 + wave);
    ctx.lineTo(TILE_W / 4, 0 + wave);
    ctx.lineTo(0, TILE_H / 4 + wave);
    ctx.lineTo(-TILE_W / 4, 0 + wave);
    ctx.fill();
  } else {
    // Трава
    const grad = ctx.createLinearGradient(0, -TILE_H/2, 0, TILE_H/2);
    grad.addColorStop(0, '#4ade80');
    grad.addColorStop(1, '#22c55e');
    ctx.fillStyle = grad;
    ctx.fill();
    
    // Текстура травы
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-TILE_W/4, -TILE_H/4); ctx.lineTo(0, 0);
    ctx.moveTo(0, -TILE_H/2); ctx.lineTo(0, 0);
    ctx.stroke();
  }
  
  ctx.restore();

  // Объекты на тайле
  if (t.type === 'tree') {
    const sway = Math.sin(Date.now() / 1000 + t.seed) * 2;
    ctx.save();
    ctx.translate(pos.x, pos.y);
    
    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, Math.PI*2); ctx.fill();
    
    // Ствол
    ctx.fillStyle = '#78350f';
    ctx.fillRect(-4, -25, 8, 25);
    
    // Крона
    ctx.fillStyle = '#166534';
    ctx.beginPath(); ctx.arc(sway, -35, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#15803d';
    ctx.beginPath(); ctx.arc(-5 + sway, -38, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#22c55e';
    ctx.beginPath(); ctx.arc(5 + sway, -40, 10, 0, Math.PI*2); ctx.fill();
    
    ctx.restore();
  } else if (t.type === 'rock') {
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = '#64748b';
    ctx.beginPath(); ctx.moveTo(-10, 5); ctx.lineTo(-5, -15); ctx.lineTo(10, -10); ctx.lineTo(15, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath(); ctx.moveTo(-5, -15); ctx.lineTo(10, -10); ctx.lineTo(0, -5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function draw() {
  // Очистка экрана
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  
  // Применяем камеру (сдвиг и зум в центр экрана)
  ctx.translate(W / 2 + camera.x, H / 2 + camera.y);
  ctx.scale(camera.zoom, camera.zoom);

  // Сортировка тайлов для правильного перекрытия (по y + x)
  // Рисуем сзади наперед
  for (let sum = 0; sum < MAP_SIZE * 2; sum++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const y = sum - x;
      if (y >= 0 && y < MAP_SIZE) {
        // Простейшая отсечка (рисуем только то, что близко к экрану)
        const pos = getScreenPos(x, y);
        const screenX = pos.x * camera.zoom + camera.x + W/2;
        const screenY = pos.y * camera.zoom + camera.y + H/2;
        
        if (screenX > -100 && screenX < W + 100 && screenY > -100 && screenY < H + 100) {
          drawTile(x, y);
        }
      }
    }
  }

  ctx.restore();
}

// ==========================================
// ИГРОВОЙ ЦИКЛ И ЗАПУСК
// ==========================================
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);
}

window.addEventListener('resize', resize);

function loop() {
  draw();
  requestAnimationFrame(loop);
}

// Старт
resize();
generateMap();
// Центрируем камеру
const centerPos = getScreenPos(MAP_SIZE/2, MAP_SIZE/2);
camera.x = -centerPos.x;
camera.y = -centerPos.y;

loop();
</script>
</body>
</html>
